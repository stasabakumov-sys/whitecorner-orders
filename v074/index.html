<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Corner Orders v0.7.4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1f5}#appframe{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden}
</style>
</head>
<body>
<iframe id="appframe" src="../v073/" title="White Corner Orders v0.7.4"></iframe>
<script>
const frame=document.getElementById('appframe');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    const style=d.createElement('style');
    style.textContent=`
      .boardtopscroll{position:fixed!important;left:254px!important;right:24px!important;bottom:8px!important;top:auto!important;margin:0!important;z-index:12!important;height:18px!important;box-shadow:0 0 0 1px rgba(223,229,236,.35);}
      .board{padding-bottom:28px!important;}
      @media(max-width:900px){.boardtopscroll{left:82px!important;right:12px!important;}}
    `;
    d.head.appendChild(style);
    const ver=[...d.querySelectorAll('.homebox')].find(x=>x.textContent.includes('Version'))?.querySelector('b');
    if(ver)ver.textContent='v0.7.4 Live';
    d.title='White Corner Orders v0.7.4';
    frame.style.visibility='visible';
  }catch(e){frame.style.visibility='visible';}
});
</script>
</body>
</html>
