<script type="module">

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));

}

async function setIssue(id,st){const {error}=await sb.from('wc_address_issues').update({validation_status:st,updated_at:new Date().toISOString()}).eq('id',id);if(error)return showErr(error.message);const a=A.find(x=>x.id===id);if(a)a.validation_status=st;renderAddress()}
function visibleProducts(){return SP.filter(p=>shipKind==='all'||kind(p.product_name)===shipKind)}
function renderShipping(){const vp=visibleProducts();if(selectedProduct&&!vp.some(p=>p.id===selectedProduct))selectedProduct=vp[0]?.id||null;const p=SP.find(x=>x.id===selectedProduct);$('#shipping').innerHTML=`<div class="shiphead"><b>Shipping Data</b><span>${vp.length} products</span><div class="typefilter" id="shipFilter"><button data-k="all" class="${shipKind==='all'?'on':''}">All</button><button data-k="backdrops" class="${shipKind==='backdrops'?'on':''}">Backdrops</button><button data-k="carts" class="${shipKind==='carts'?'on':''}">Carts</button><button data-k="others" class="${shipKind==='others'?'on':''}">Others</button></div><span class="mut" style="margin-left:auto">Packaging profiles for freight quotes</span></div><div class="shipgrid"><div class="shiplist">${vp.map(x=>{const ps=PK.filter(y=>y.shipping_product_id===x.id&&y.source_type==='Base'),inc=ps.filter(y=>y.length_mm==null||y.width_mm==null||y.height_mm==null||y.weight_kg==null).length;return`<button class="shipitem ${x.id===selectedProduct?'on':''}" data-sp="${x.id}"><div class="pn">${esc(x.product_name)}</div><div class="pm">${ps.length} base boxes · ${inc?`${inc} incomplete`:'complete'}</div></button>`}).join('')}</div><div class="shipdetail">${p?shipDetail(p):'<div class="mut">No products in this filter.</div>'}</div></div>`;$('#shipping').querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{selectedProduct=b.dataset.sp;renderShipping()});$('#shipFilter').querySelectorAll('button').forEach(b=>b.onclick=()=>{shipKind=b.dataset.k;renderShipping()});$('#shipping').querySelectorAll('[data-savepkg]').forEach(b=>b.onclick=()=>savePkg(b.dataset.savepkg));$('#shipping').querySelectorAll('[data-saverule]').forEach(b=>b.onclick=()=>saveRule(b.dataset.saverule))}
function shipDetail(p){const ps=PK.filter(x=>x.shipping_product_id===p.id).sort((a,b)=>a.package_no-b.package_no),rs=RL.filter(x=>x.shipping_product_id===p.id),inc=ps.filter(x=>x.length_mm==null||x.width_mm==null||x.height_mm==null||x.weight_kg==null).length;return`<div style="display:flex;gap:12px;align-items:flex-start"><div><h2>${esc(p.product_name)}</h2><div class="small">${esc(p.product_type)}</div></div><div style="margin-left:auto"><span class="badge ${inc?'warn':'ok'}">${inc?`${inc} packages incomplete`:'Ready for quoting'}</span></div></div><div class="shipsection"><h3>Packages</h3><table class="shiptable"><thead><tr><th>Source</th><th>Box</th><th>Name</th><th>L mm</th><th>W mm</th><th>H mm</th><th>kg</th><th></th></tr></thead><tbody>${ps.map(x=>`<tr><td>${esc(x.source_type)}</td><td>${x.package_no}</td><td><input class="shipinput name" id="n_${x.id}" value="${esc(x.package_name||'')}"></td><td><input class="shipinput" id="l_${x.id}" type="number" value="${x.length_mm??''}"></td><td><input class="shipinput" id="w_${x.id}" type="number" value="${x.width_mm??''}"></td><td><input class="shipinput" id="h_${x.id}" type="number" value="${x.height_mm??''}"></td><td><input class="shipinput" id="kg_${x.id}" type="number" step="0.1" value="${x.weight_kg??''}"></td><td><button class="btn primary" data-savepkg="${x.id}">Save</button></td></tr>`).join('')}</tbody></table></div><div class="shipsection"><h3>Rules</h3>${rs.length?rs.map(r=>`<div class="rule"><div><b>${esc(r.rule_type)}</b><div class="small">${r.active?'Active':'Inactive'}</div></div><div><b>${esc(r.match_name)}</b><div class="small">${r.match_value?`Value: ${esc(r.match_value)}`:'Any value'}</div></div><div>${esc(r.effect_type)}</div><div>Boxes: <input class="shipinput" style="width:55px" id="delta_${r.id}" type="number" value="${r.package_count_delta}"></div><button class="btn" data-saverule="${r.id}">Save</button></div>`).join(''):'<div class="mut">No rules for this product.</div>'}</div>`}
async function savePkg(id){const val=k=>{const v=$(`#${k}_${id}`).value.trim();return v===''?null:Number(v)};const payload={package_name:$(`#n_${id}`).value.trim()||null,length_mm:val('l'),width_mm:val('w'),height_mm:val('h'),weight_kg:val('kg'),updated_at:new Date().toISOString()};const{error}=await sb.from('wc_shipping_packages').update(payload).eq('id',id);if(error)return showErr(error.message);Object.assign(PK.find(x=>x.id===id)||{},payload);renderShipping()}
async function saveRule(id){const delta=Number($(`#delta_${id}`).value||0),{error}=await sb.from('wc_shipping_rules').update({package_count_delta:delta,updated_at:new Date().toISOString()}).eq('id',id);if(error)return showErr(error.message);const r=RL.find(x=>x.id===id);if(r)r.package_count_delta=delta;renderShipping()}
function renderAll(){renderOrders();renderBoard();renderAddress();renderShipping()}
function view(v){viewNow=v;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===v));['home','orders','board','address','shipping','stats','ordersTools','boardTools'].forEach(id=>{const el=$('#'+id);if(el)el.classList.add('hidden')});if(v==='home')$('#home').classList.remove('hidden');if(v==='orders'){$('#orders').classList.remove('hidden');$('#stats').classList.remove('hidden');$('#ordersTools').classList.remove('hidden')}if(v==='board'){ $('#board').classList.remove('hidden');$('#boardTools').classList.remove('hidden')}if(v==='address')$('#address').classList.remove('hidden');if(v==='shipping')$('#shipping').classList.remove('hidden');$('#pt').textContent=v==='home'?'Home':v==='orders'?'Orders':v==='board'?'Production Board':v==='address'?'Address Review':'Shipping Data'}
function itemCard(i,o){const im=image(i),qty=Number(i.quantity||1),unit=Number(i.unit_price||0);return`<div class="orderitem"><div>${im?`<img class="itemimg" src="${esc(im)}">`:'<div class="itemimg"></div>'}</div><div><b>${esc(i.product_name||'Unnamed item')}</b><div><span class="pill">qty: ${qty}</span>${options(i).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div><div style="text-align:right"><div>${money(unit,o.currency)} each</div><b>${money(unit*qty,o.currency)}</b></div></div>`}
function openOrder(id,unitId){const o=O.find(x=>x.id===id);if(!o)return;$('#dn').textContent='#'+o.order_number;$('#dc').textContent=o.customer_name||'';$('#dco').textContent=o.company||'';const focus=unitId?logical(o).find(x=>x.u.id===unitId):null;$('#headstatus').innerHTML=focus?`<div class="headstatus"><span class="mut">Change status</span><select id="drawerStatus">${S.map(s=>`<option ${s===(focus.u.production_status||'New')?'selected':''}>${s}</option>`).join('')}</select></div>`:'';$('#db').innerHTML=`<div class="sec"><div class="st">Overview</div><div class="grid3"><div class="box"><b>Payment</b><br>${pay(o)}</div><div class="box"><b>Fulfilment</b><br>${ful(o)}</div><div class="box"><b>Total</b><br>${money(o.total,o.currency)}</div><div class="box"><b>Date</b><br>${fmtDate(o.wix_created_at)}</div><div class="box"><b>Status</b><br>${esc(status(o))}</div><div class="box"><b>Items</b><br>${logical(o).length}</div></div></div><div class="sec"><div class="st">Order composition</div>${items(o).filter(i=>!/^delivery$/i.test(i.product_name||'')).map(i=>itemCard(i,o)).join('')}<div class="totals"><div class="tr final"><span>Total</span><span>${money(o.total,o.currency)}</span></div></div></div>`;if(focus)$('#drawerStatus').onchange=e=>setStatus(focus.u.id,e.target.value);$('#shade').classList.add('on')}
async function setStatus(id,st){for(const o of O)for(const i of items(o)){const u=units(i).find(x=>x.id===id);if(u){const old=u.production_status;u.production_status=st;renderAll();const{error}=await sb.from('wc_production_units').update({production_status:st}).eq('id',id);if(error){u.production_status=old;renderAll();showErr(error.message)}return}}}
S.forEach(s=>$('#sf').insertAdjacentHTML('beforeend',`<option>${s}</option>`));document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>view(b.dataset.v));['search','sf','ff'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',renderOrders));$('#clear').onclick=()=>{$('#search').value='';$('#sf').value='';$('#ff').value='';renderOrders()};$('#boardFilter').querySelectorAll('button').forEach(b=>b.onclick=()=>{boardKind=b.dataset.k;$('#boardFilter').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderBoard()});$('#x').onclick=()=>$('#shade').classList.remove('on');$('#shade').onclick=e=>{if(e.target===$('#shade'))$('#shade').classList.remove('on')};$('#signout').onclick=()=>sb.auth.signOut();$('#loginform').onsubmit=async e=>{e.preventDefault();$('#loginmsg').textContent='Signing in…';const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginmsg').textContent=error?error.message:''};
let hadSession=false;async function applySession(session){if(session){$('#loginwrap').classList.add('hidden');$('#app').classList.remove('hidden');$('#homeEmail').textContent=session.user.email||'';if(!hadSession){hadSession=true;await loadAll();view(viewNow||'home')}else if(!O.length)await loadAll()}else{hadSession=false;$('#app').classList.add('hidden');$('#loginwrap').classList.remove('hidden');O=[];A=[];SP=[];PK=[];RL=[]}}
const{data:{session}}=await sb.auth.getSession();await applySession(session);sb.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT')applySession(null);else if(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='USER_UPDATED')applySession(s)});
</script>
</body></html>
