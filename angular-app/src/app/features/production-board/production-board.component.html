<section class="toolbar">
  <div class="filters">
    <button [class.active]="filter()==='all'" (click)="selectFilter('all')">All</button>
    <button [class.active]="filter()==='backdrops'" (click)="selectFilter('backdrops')">Backdrops</button>
    <button [class.active]="filter()==='carts'" (click)="selectFilter('carts')">Carts</button>
    <button [class.active]="filter()==='others'" (click)="selectFilter('others')">Others</button>
  </div>
</section>

<div class="error" *ngIf="orders.error()">{{ orders.error() }}</div>
<div class="board" #boardEl (scroll)="bottomScroll.scrollLeft = boardEl.scrollLeft">
  <section class="column" *ngFor="let status of production.statuses">
    <header><b>{{ status }}</b><span>{{ units(status).length }}</span></header>
    <button class="card" *ngFor="let unit of units(status)" (click)="open(unit)">
      <img *ngIf="production.imageUrl(unit.mainItem) as src" [src]="src" alt="" />
      <div class="code">{{ unit.code }}</div>
      <div class="customer">{{ unit.order.customer_name || '—' }}</div>
      <small>{{ unit.order.company }}</small>
      <div class="product">{{ unit.mainItem.product_name }}</div>
      <div class="meta">{{ production.optionLabels(unit.mainItem).slice(0,2).join(' · ') }}</div>
    </button>
  </section>
</div>

<div class="boardscroll" #bottomScroll (scroll)="boardEl.scrollLeft = bottomScroll.scrollLeft" aria-label="Production board horizontal scroll">
  <div class="boardscroll-inner"></div>
</div>

<app-production-unit-drawer *ngIf="selected() as unit" [view]="unit" (closed)="selected.set(null)" />
