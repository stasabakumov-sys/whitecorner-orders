<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White Corner Orders v0.6.9</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}iframe{position:fixed;inset:0}</style></head><body><iframe id="outer" src="../v062/" title="White Corner Orders v0.6.9"></iframe><script>
const outer=document.getElementById('outer');
const SPECIAL='10812';
const ADDON_TERMS=['additional tabletop','custom cutout','custom cutouts','side shelves','integrated ice storage shelf','umbrella hole','support panel','customisation','customization','back panel with','benchtop upgrade'];
const REVIEW_HINTS=['upgrade','additional','cutout','cut-out','accessory','shelf','shelves','support panel','back panel'];
const CART_TERMS=['cart','mobile bar','serving table','event bar'];
let selectedBoardCard=null, openedFromBoard=false, applying=false, timer=null, installed=false;
function appDoc(){try{let d=outer.contentDocument||outer.contentWindow.document;for(let i=0;i<5;i++){if(d?.querySelector('#app'))return d;const f=d?.querySelector('iframe');if(!f)break;d=f.contentDocument||f.contentWindow.document;}return d}catch{return null}}
function orderNo(card){const t=(card.dataset.orderNo||card.querySelector('.ordercode')?.textContent||'').trim();const m=t.match(/#?(\d+)/);return m?m[1]:''}
function fullProduct(card){return card.dataset.fullProduct||card.querySelector('.product')?.textContent||''}
function shortProduct(s){const p=String(s||'').split(/\s[-–—]\s/);return (p[0]||s||'').trim()}
function isAddonName(s){s=String(s||'').toLowerCase();return ADDON_TERMS.some(x=>s.includes(x))}
function isCartName(s){s=String(s||'').toLowerCase();return CART_TERMS.some(x=>s.includes(x))}
function inject(d){if(d.getElementById('v069stable'))return;const s=d.createElement('style');s.id='v069stable';s.textContent=`
#board .pcard>select,#board .pcard select{display:none!important}
.v069-review td{background:#fff1f1!important;border-bottom-color:#efc9c9!important}.v069-review:hover td{background:#ffe8e8!important}.v069-review td:first-child{box-shadow:inset 4px 0 0 #d14343}.v069-review-badge{display:inline-block;margin-left:7px;padding:3px 7px;border-radius:4px;background:#ffdede;color:#8b2e2e;font-size:10px;font-weight:700;vertical-align:middle}.v069-hide{display:none!important}
.v069-headstatus{display:flex;align-items:center;gap:10px;margin-left:auto;margin-right:14px}.v069-headstatus label{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;white-space:nowrap}.v069-headstatus select{min-width:150px;height:40px;border-radius:20px;padding:8px 34px 8px 14px;font-size:14px;font-weight:600;background:#fff}.dh{align-items:flex-start}.v069-addons-title{font-size:11px;text-transform:uppercase;color:#7a8599;font-weight:700;margin:18px 0 9px;padding-top:14px;border-top:1px solid var(--line)}
#productTypeFilter{min-width:160px}
`;d.head.appendChild(s);
const board=d.querySelector('#board');board?.addEventListener('click',e=>{const card=e.target.closest('.pcard');if(!card)return;selectedBoardCard=card;openedFromBoard=true;schedule(d)},true);
const orders=d.querySelector('#orders');orders?.addEventListener('click',e=>{if(e.target.closest('tbody tr')){openedFromBoard=false;selectedBoardCard=null;schedule(d)}},true);
const close=d.querySelector('#x');close?.addEventListener('click',()=>{openedFromBoard=false;selectedBoardCard=null},true);
ensureProductFilter(d);
}
function ensureProductFilter(d){const tools=d.querySelector('.tools');if(!tools)return;let f=d.querySelector('#productTypeFilter');if(!f){f=d.createElement('select');f.id='productTypeFilter';f.innerHTML='<option value="all">All product types</option><option value="cart">Carts</option><option value="other">Others</option>';tools.insertBefore(f,tools.firstChild);f.addEventListener('change',()=>applyProductFilter(d));}}
function snapshotCards(d){d.querySelectorAll('#board .pcard').forEach(c=>{if(!c.dataset.orderNo)c.dataset.orderNo=orderNo(c);const p=c.querySelector('.product');if(p&&!c.dataset.fullProduct)c.dataset.fullProduct=p.textContent.trim();});}
function cleanSvg(d){const clean=t=>{if(!/logo\s+or\s+personalization\s*:\s*no/i.test(t)&&!/logo\s*:\s*no/i.test(t))return t;const i=t.search(/please email us|ready-to-use svg/i);return i>=0?t.slice(0,i).replace(/[·\-\s]+$/,'').trim():t};d.querySelectorAll('#board .meta,#shade .pill,#shade .note').forEach(el=>{const t=el.textContent||'';const n=clean(t);if(n!==t)el.textContent=n;});}
function rawGroups(d){const m=new Map();d.querySelectorAll('#board .pcard').forEach(c=>{const n=orderNo(c);if(!n)return;if(!m.has(n))m.set(n,[]);m.get(n).push(c)});return m}
function classifyOrders(d){const ambiguous=new Set();rawGroups(d).forEach((cards,n)=>{cards.forEach(c=>{c.classList.remove('v069-addonhide','v069-review-hide')});if(n===SPECIAL)return;const add=cards.filter(c=>isAddonName(fullProduct(c)));const main=cards.filter(c=>!isAddonName(fullProduct(c)));if(add.length&&main.length){add.forEach(c=>c.classList.add('v069-addonhide'));return;}if(add.length&&!main.length){ambiguous.add(n);return;}const names=[...new Set(cards.map(c=>fullProduct(c).trim()).filter(Boolean))];if(names.length>1&&names.some(name=>REVIEW_HINTS.some(k=>name.toLowerCase().includes(k))))ambiguous.add(n);});return ambiguous}
function special10812(d){const cards=(rawGroups(d).get(SPECIAL)||[]);if(!cards.length)return;cards.forEach(c=>c.classList.remove('v069-addonhide','v069-review-hide','v069-hide'));const upgrade=cards.filter(c=>/tasmanian oak timber benchtop upgrade/i.test(fullProduct(c)));const main=cards.find(c=>!/tasmanian oak timber benchtop upgrade/i.test(fullProduct(c)));const chosen=(upgrade.length>=4?upgrade.slice(0,4):cards.slice(0,4));cards.forEach(c=>c.classList.toggle('v069-hide',!chosen.includes(c)));const mainName=main?fullProduct(main):'Collapsible Plywood Mobile Bar "Classic" + Varnished Tabletop';chosen.forEach((c,i)=>{c.dataset.special='1';c.dataset.orderNo=SPECIAL;const code=c.querySelector('.ordercode');if(code&&code.textContent!==`#10812-${i+1}`)code.textContent=`#10812-${i+1}`;const p=c.querySelector('.product');if(p&&p.textContent!==shortProduct(mainName))p.textContent=shortProduct(mainName);const meta=c.querySelector('.meta');if(meta&&!/Tasmanian Oak Benchtop Upgrade/i.test(meta.textContent||''))meta.textContent=((meta.textContent||'').trim()?meta.textContent+' · ':'')+'Tasmanian Oak Benchtop Upgrade';});}
function applyReviews(d,amb){d.querySelectorAll('#orders tbody tr').forEach(tr=>{const m=(tr.cells?.[0]?.textContent||'').match(/#?(\d+)/);const n=m?m[1]:'';const need=amb.has(n);tr.classList.toggle('v069-review',need);let b=tr.querySelector('.v069-review-badge');if(need&&!b){b=d.createElement('span');b.className='v069-review-badge';b.textContent='Needs review';tr.cells[0].appendChild(b)}if(!need&&b)b.remove();if(need&&tr.cells?.[7]&&tr.cells[7].textContent!=='Needs review')tr.cells[7].textContent='Needs review';});d.querySelectorAll('#board .pcard').forEach(c=>{const n=orderNo(c);c.classList.toggle('v069-review-hide',amb.has(n));});}
function logicalCards(d){return [...d.querySelectorAll('#board .pcard')].filter(c=>!c.classList.contains('v069-hide')&&!c.classList.contains('v069-addonhide')&&!c.classList.contains('v069-review-hide'));}
function renumber(d){const g=new Map();logicalCards(d).forEach(c=>{const n=orderNo(c);if(!g.has(n))g.set(n,[]);g.get(n).push(c)});g.forEach((arr,n)=>{if(n===SPECIAL)return;arr.sort((a,b)=>(a.dataset.unit||'').localeCompare(b.dataset.unit||''));arr.forEach((c,i)=>{const code=c.querySelector('.ordercode');const t=arr.length===1?`#${n}`:`#${n}-${i+1}`;if(code&&code.textContent!==t)code.textContent=t})});}
function shortenBoardNames(d){logicalCards(d).forEach(c=>{const p=c.querySelector('.product');if(!p)return;const t=shortProduct(fullProduct(c));if(p.textContent!==t)p.textContent=t;});}
function orderDateMap(d){const m=new Map();d.querySelectorAll('#orders tbody tr').forEach(tr=>{const no=(tr.cells?.[0]?.textContent||'').match(/#?(\d+)/)?.[1];const s=(tr.cells?.[1]?.textContent||'').trim();const ts=Date.parse(s);if(no)m.set(no,Number.isFinite(ts)?ts:0)});return m}
function sortColumns(d){const dm=orderDateMap(d);d.querySelectorAll('#board .col').forEach(col=>{const cards=[...col.querySelectorAll('.pcard')];const target=[...cards].sort((a,b)=>{const da=dm.get(orderNo(a))||0,db=dm.get(orderNo(b))||0;if(da!==db)return da-db;return Number(orderNo(a)||0)-Number(orderNo(b)||0)});const same=cards.every((c,i)=>c===target[i]);if(!same)target.forEach(c=>col.appendChild(c));});}
function applyProductFilter(d){const f=d.querySelector('#productTypeFilter');if(!f)return;const board=d.querySelector('#board');const boardVisible=board&&!board.classList.contains('hidden');f.style.display=boardVisible?'':'none';const wanted=f.value;logicalCards(d).forEach(c=>{const type=isCartName(fullProduct(c))?'cart':'other';c.dataset.productType=type;c.style.display=(wanted==='all'||wanted===type)?'':'none'});updateColumnCounts(d)}
function updateColumnCounts(d){d.querySelectorAll('#board .col').forEach(col=>{const n=[...col.querySelectorAll('.pcard')].filter(c=>!c.classList.contains('v069-hide')&&!c.classList.contains('v069-addonhide')&&!c.classList.contains('v069-review-hide')&&c.style.display!=='none').length;const b=col.querySelector('.ch span:last-child');if(b&&b.textContent!==String(n))b.textContent=String(n)});}
function drawerStatus(d){const shade=d.querySelector('#shade');const dh=d.querySelector('.dh');if(!shade?.classList.contains('on')||!dh)return;dh.querySelector('.v069-headstatus')?.remove();d.querySelectorAll('#shade .unitrow').forEach(r=>r.classList.add('v069-hide'));if(!openedFromBoard||!selectedBoardCard)return;const original=selectedBoardCard.querySelector('select');if(!original)return;const wrap=d.createElement('div');wrap.className='v069-headstatus';const lab=d.createElement('label');lab.textContent='Change status';const sel=original.cloneNode(true);sel.value=original.value;sel.addEventListener('change',()=>{original.value=sel.value;original.dispatchEvent(new Event('change',{bubbles:true}))});wrap.append(lab,sel);dh.insertBefore(wrap,dh.querySelector('.close'));}
function tidyDrawer(d){const shade=d.querySelector('#shade');if(!shade?.classList.contains('on'))return;const db=d.querySelector('#db');if(!db)return;const items=[...db.querySelectorAll('.item')];if(!items.length)return;items.forEach(i=>{i.classList.remove('v069-hide');const title=(i.querySelector('b')?.textContent||'').trim();if(/^delivery$/i.test(title))i.classList.add('v069-hide')});const visible=items.filter(i=>!i.classList.contains('v069-hide'));const main=visible.filter(i=>!isAddonName(i.querySelector('b')?.textContent||''));const adds=visible.filter(i=>isAddonName(i.querySelector('b')?.textContent||''));if(main.length&&adds.length){let h=db.querySelector('.v069-addons-title');if(!h){h=d.createElement('div');h.className='v069-addons-title';h.textContent='Add-ons';const sec=main[0].parentElement;sec?.appendChild(h)}adds.forEach(i=>h.parentElement?.appendChild(i));}if(openedFromBoard&&main.length){const qty=[...main[0].querySelectorAll('.pill')].find(p=>/^qty\s*:\s*\d+/i.test(p.textContent||''));if(qty&&qty.textContent!=='qty: 1')qty.textContent='qty: 1';if(orderNo(selectedBoardCard)===SPECIAL&&adds.length){adds.forEach(a=>{const aq=[...a.querySelectorAll('.pill')].find(p=>/^qty\s*:\s*\d+/i.test(p.textContent||''));if(aq)aq.textContent='qty: 1';});}}}
function syncOrdersSummary(d,amb){const cards=logicalCards(d);const by=new Map();cards.forEach(c=>{const n=orderNo(c);if(!by.has(n))by.set(n,[]);by.get(n).push(c)});d.querySelectorAll('#orders tbody tr').forEach(tr=>{const n=(tr.cells?.[0]?.textContent||'').match(/#?(\d+)/)?.[1];if(!n||amb.has(n))return;const arr=by.get(n)||[];if(tr.cells?.[6]&&tr.cells[6].textContent!==String(arr.length))tr.cells[6].textContent=String(arr.length);const counts={};arr.forEach(c=>{const st=c.closest('.col')?.querySelector('.ch span:first-child')?.textContent||'New';counts[st]=(counts[st]||0)+1});const text=Object.entries(counts).map(([s,c])=>`${c} ${s}`).join(' · ')||'—';if(tr.cells?.[7]&&tr.cells[7].textContent!==text)tr.cells[7].textContent=text;});}
function version(d){const b=d.querySelector('.homepanel .value b');if(b&&b.textContent!=='v0.6.9 Live')b.textContent='v0.6.9 Live'}
function applyAll(d){if(applying)return;applying=true;try{inject(d);snapshotCards(d);cleanSvg(d);const amb=classifyOrders(d);special10812(d);applyReviews(d,amb);renumber(d);shortenBoardNames(d);sortColumns(d);applyProductFilter(d);syncOrdersSummary(d,amb);drawerStatus(d);tidyDrawer(d);version(d)}finally{applying=false}}
function schedule(d){clearTimeout(timer);timer=setTimeout(()=>applyAll(d),25)}
function boot(){const d=appDoc();if(!d){setTimeout(boot,300);return}applyAll(d);if(installed)return;installed=true;const obs=new MutationObserver(()=>{if(!applying)schedule(d)});obs.observe(d.body,{childList:true,subtree:true});setInterval(()=>applyAll(d),1500)}
outer.addEventListener('load',()=>setTimeout(boot,300));
</script></body></html>
