<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Corner Orders v0.7.9</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1f5}#appframe{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden}</style>
</head>
<body>
<iframe id="appframe" src="../v078/" title="White Corner Orders v0.7.9"></iframe>
<script>
const outer=document.getElementById('appframe');
function enhance(){
  try{
    const middle=outer.contentDocument;
    const inner=middle.getElementById('appframe');
    if(!inner||!inner.contentDocument)return false;
    const d=inner.contentDocument;
    if(!d.getElementById('v079style')){
      const s=d.createElement('style');s.id='v079style';s.textContent=`
        #shippingData .shipPanel{border:1px solid #e7e7e7;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.03);font-family:Arial,sans-serif}
        #shippingData .shipHead{padding:18px 20px;background:#fff;border-bottom:1px solid #ececec}
        #shippingData .shipHead b{font-size:20px;font-weight:600;letter-spacing:-.2px}
        #shippingData .shipHead .mut{color:#7a7a7a;font-size:12px}
        #shippingData .shipProducts{grid-template-columns:350px 1fr;background:#fff}
        #shippingData .shipList{counter-reset:shippingProduct;background:#fff;border-right:1px solid #ececec}
        #shippingData .shipList button{position:relative;counter-increment:shippingProduct;padding:18px 18px 18px 54px;background:#fff;border-bottom:1px solid #eeeeee;transition:background .15s ease}
        #shippingData .shipList button:hover{background:#f7f8fa}
        #shippingData .shipList button.on{background:#f2f6ff;box-shadow:inset 3px 0 0 #116dff}
        #shippingData .shipList button:before{content:counter(shippingProduct);position:absolute;left:18px;top:18px;width:24px;height:24px;border:1px solid #d9dde5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#4d5668;background:#fff}
        #shippingData .shipList .pn{font-weight:600;font-size:14px;line-height:1.35;color:#17233a}
        #shippingData .shipList .pm{font-size:11px;color:#7d8797;margin-top:5px}
        #shippingData .shipDetail{padding:24px}
        #shippingData .shipDetail h2{font-size:22px!important;font-weight:600!important;letter-spacing:-.25px;color:#17233a}
        #shippingData .shipSection h3{font-size:16px;font-weight:600;color:#17233a;margin-bottom:12px}
        #shippingData .shipTable{border:1px solid #eceff3;border-radius:8px;overflow:hidden;border-collapse:separate;border-spacing:0}
        #shippingData .shipTable th{background:#fafbfc;color:#737d8f;font-size:10px;font-weight:600;letter-spacing:.3px;padding:11px 10px;border-bottom:1px solid #eceff3}
        #shippingData .shipTable td{padding:11px 10px;border-bottom:1px solid #f0f1f3;background:#fff}
        #shippingData .shipTable tr:last-child td{border-bottom:0}
        #shippingData .shipInput{height:36px;border:1px solid #d9dde5;border-radius:8px;padding:7px 10px;background:#fff;box-shadow:none;transition:border-color .15s,box-shadow .15s}
        #shippingData .shipInput:focus{border-color:#116dff;box-shadow:0 0 0 2px rgba(17,109,255,.10)}
        #shippingData .shipSave{height:36px;border-radius:18px;padding:0 15px;background:#116dff;font-size:12px;font-weight:600}
        #shippingData .shipSave:hover{background:#0b5ed7}
        #shippingData .shipSecondary{height:34px;border-radius:17px;padding:0 14px;background:#fff;font-size:12px;font-weight:600}
        #shippingData .shipRule{background:#fff;border:1px solid #eceff3;border-radius:8px;padding:12px 14px;box-shadow:none}
        #shippingData .shipWarn,#shippingData .shipOk{border-radius:12px;padding:4px 9px;font-size:10px}
        @media(max-width:1000px){#shippingData .shipProducts{grid-template-columns:1fr}#shippingData .shipList{border-right:0}}
      `;d.head.appendChild(s);
    }
    const versionBox=[...d.querySelectorAll('.homebox')].find(x=>x.textContent.includes('Version'))?.querySelector('b');
    if(versionBox)versionBox.textContent='v0.7.9 Live';
    d.title='White Corner Orders v0.7.9';
    return true;
  }catch(e){console.error(e);return false}
}
outer.addEventListener('load',()=>{
  const middle=outer.contentDocument;
  const inner=middle.getElementById('appframe');
  const finish=()=>{enhance();outer.style.visibility='visible'};
  if(inner){inner.addEventListener('load',finish,{once:true});setTimeout(finish,300)}else setTimeout(finish,300);
});
</script>
</body>
</html>
