<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Corner Orders v0.6</title>
<style>
:root{--bg:#eef1f5;--nav:#171b24;--line:#dfe5ec;--txt:#1d2940;--mut:#758198;--blue:#116dff;--white:#fff}
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--txt)}button,input,select{font:inherit}.hidden{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:18px 0;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:800;padding:0 20px 22px}.brand small{display:block;color:#9da7b8;font-size:11px;font-weight:400;margin-top:4px}.nav{border:0;background:none;color:#dce2ec;text-align:left;padding:12px 20px;cursor:pointer;font-weight:600}.nav:hover,.nav.on{background:#3c414c;color:#fff}.foot{margin-top:auto;padding:13px 20px;border-top:1px solid #2b303a;color:#8f98aa;font-size:11px}.account{padding:10px 20px 0;color:#aeb6c3;font-size:11px;overflow:hidden;text-overflow:ellipsis}.logout{margin:8px 20px 0;border:1px solid #454b57;background:transparent;color:#dce2ec;border-radius:7px;padding:7px 9px;cursor:pointer}
.top{height:52px;background:#f8f9fb;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px}.title{font-size:17px}.content{padding:14px 24px 20px}.stats{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 18px;display:flex;gap:34px;margin-bottom:12px}.stats b{font-size:16px;margin-left:5px}.syncnote{margin-left:auto;color:var(--mut);font-size:11px}
.tools{background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:10px 14px;display:flex;gap:10px;align-items:center}.tools .grow{flex:1}input,select{border:1px solid #cfd8e6;border-radius:20px;padding:8px 12px;background:#fff;outline:none}input:focus,select:focus{border-color:var(--blue)}#search{width:255px}#clear{border:1px solid #cfd8e6;background:#fff;color:var(--blue);border-radius:20px;padding:8px 13px;cursor:pointer}
.table{background:#fff;border:1px solid var(--line);border-radius:0 0 12px 12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th{background:#f7f9fb;text-align:left;font-size:12px;font-weight:600;padding:13px 14px;border-bottom:1px solid var(--line)}td{padding:15px 14px;border-bottom:1px solid #e8ecf1}tbody tr:hover td{background:#f8fbff}tbody tr{cursor:pointer}.mut{font-size:12px;color:var(--mut)}.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:600}.paid{background:#c9efdb;color:#17643d}.unpaid{background:#ffdede;color:#8b2e2e}.ship{background:#edeaff;color:#514a9e}.pick{background:#e5f0ff;color:#2d62a8}.statussum{font-size:13px;font-weight:400;color:var(--txt);white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:10px;overflow-x:auto;margin-top:18px}.col{background:#f4f6f9;border:1px solid #e0e5eb;border-radius:12px;padding:8px;min-height:500px}.ch{display:flex;justify-content:space-between;font-weight:700;padding:3px 4px 9px}.ch span:last-child{background:#fff;border:1px solid var(--line);border-radius:12px;padding:2px 7px;font-size:11px}.pcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:pointer}.pcard:hover{border-color:#a8c4ed}.ordercode{font-weight:700}.customer{margin-top:5px;font-size:14px;font-weight:700}.product{margin-top:6px;font-size:12px;font-weight:600;line-height:1.3}.pcard select{width:100%;border-radius:7px;margin-top:7px;padding:6px 9px}.meta{font-size:11px;color:var(--mut);margin-top:2px}
.shade{display:none;position:fixed;inset:0;background:#0f172a55;z-index:9}.shade.on{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(720px,95vw);background:#fff;overflow:auto;box-shadow:-6px 0 25px #0002}.dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}.close{border:0;background:#eef1f5;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}.db{padding:20px 22px}.sec{margin-bottom:22px}.st{font-size:11px;text-transform:uppercase;color:#7a8599;font-weight:700;margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.box,.item{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfd}.item{background:#fff;margin-bottom:8px}.pill{display:inline-block;background:#f1f4f7;border-radius:5px;padding:4px 6px;font-size:11px;margin:5px 5px 0 0}.unitrow{display:flex;gap:8px;align-items:center;margin-top:8px}.unitrow span{font-size:11px;color:var(--mut);min-width:70px}.unitrow select{flex:1;border-radius:7px;padding:6px 8px}.note{white-space:pre-wrap;font-size:12px;color:#4a5669;margin-top:8px}
.loading{padding:45px;text-align:center;color:var(--mut)}.error{background:#fff1f1;color:#8c2f2f;border:1px solid #f0caca;padding:12px 14px;border-radius:8px;margin-bottom:12px}
.loginwrap{position:fixed;inset:0;background:#eef1f5;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.login{width:min(390px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 10px 35px #17203314}.login h1{font-size:22px;margin:0 0 5px}.login p{color:var(--mut);margin:0 0 22px}.login label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}.login input{width:100%;border-radius:7px;padding:10px 11px}.login button{width:100%;border:0;background:var(--blue);color:#fff;border-radius:8px;padding:10px 12px;font-weight:700;margin-top:16px;cursor:pointer}.loginmsg{font-size:12px;color:#9b3333;margin-top:10px;min-height:16px}
@media(max-width:900px){.app{grid-template-columns:70px 1fr}.brand{font-size:0}.brand:after{content:"WC";font-size:16px}.brand small{display:none}.nav{font-size:0}.nav:before{content:"◫";font-size:18px}.account,.logout,.foot{display:none}.content{padding:12px}.top{padding:0 14px}.stats{gap:15px;overflow:auto}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="loginwrap" class="loginwrap hidden"><form id="loginform" class="login"><h1>White Corner Orders</h1><p>Sign in to view live Wix orders.</p><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><div id="loginmsg" class="loginmsg"></div></form></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">White Corner<small>Operations</small></div><button class="nav on" data-v="orders">Orders</button><button class="nav" data-v="board">Production Board</button><div class="foot">White Corner Orders · v0.6 Live</div><div id="account" class="account"></div><button id="logout" class="logout">Sign out</button></aside><main><div class="top"><div class="title" id="pt">Orders</div></div><div class="content"><div id="err"></div><div class="stats" id="stats"><span>Orders <b id="oc">0</b></span><span>In production <b id="ic">0</b></span><span>Ready <b id="rc">0</b></span><span class="syncnote" id="syncnote"></span></div><div class="tools"><select id="sf"><option value="">All statuses</option></select><select id="ff"><option value="">All fulfilment</option><option>Shipping</option><option>Pickup</option></select><div class="grow"></div><button id="clear">Clear filters</button><input id="search" placeholder="Search..."></div><div id="orders" class="table"><div class="loading">Loading live orders…</div></div><div id="board" class="board hidden"></div></div></main></div>
<div class="shade" id="shade"><div class="drawer"><div class="dh"><div><b id="dn"></b><div id="dc"></div><div class="mut" id="dco"></div></div><button class="close" id="x">×</button></div><div class="db" id="db"></div></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://zgvnrpspwluapaxnycrg.supabase.co';
const SUPABASE_KEY='sb_publishable_DwutkRc9dxioIdUcdPn4gA_RfDb1-n_';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const S=['New','CNC','Assembly','Painting','Packing','Ready'];
const ADDON=['umbrella hole','delivery','customisation','customization','back panel with'];
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
let O=[];
function isProd(item){const n=String(item.product_name||'').toLowerCase();return !ADDON.some(a=>n.includes(a))}
function fmtDate(v){if(!v)return '—';return new Intl.DateTimeFormat('en-AU',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(v))}
function fmtMoney(v,c='AUD'){if(v===null||v===undefined||v==='')return '—';try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:c||'AUD'}).format(Number(v))}catch{return String(v)}}
function pay(o){const p=String(o.payment_status||'—');return `<span class="badge ${p.toUpperCase()==='PAID'?'paid':'unpaid'}">${esc(p.replaceAll('_',' '))}</span>`}
function ful(o){const f=o.delivery_type||'Shipping';return `<span class="badge ${f==='Pickup'?'pick':'ship'}">${esc(f)}</span>`}
function items(o){return (o.wc_order_items||[])}
function units(item){return (item.wc_production_units||[]).sort((a,b)=>a.unit_index-b.unit_index)}
function prodUnits(o){return items(o).filter(isProd).flatMap(i=>units(i).map(u=>({u,i})))}
function sum(o){const c={};S.forEach(s=>c[s]=0);prodUnits(o).forEach(x=>c[x.u.production_status||'New']++);return S.filter(s=>c[s]).map(s=>`${c[s]} ${s}`).join(' · ')||'—'}
function optionText(i){const out=[];const add=(obj)=>{if(!obj||typeof obj!=='object')return;Object.entries(obj).forEach(([k,v])=>{if(v===null||v===undefined||v==='')return;let val=typeof v==='object'?(v.value||v.name||v.description||JSON.stringify(v)):v;out.push(`${k}: ${val}`)})};add(i.wix_options);add(i.custom_text_fields);if(i.size)out.push(`size: ${i.size}`);if(i.color)out.push(`color: ${i.color}`);return [...new Set(out)].slice(0,8)}
function filtered(){const q=$('#search').value.toLowerCase(),sf=$('#sf').value,ff=$('#ff').value;return O.filter(o=>(!q||JSON.stringify(o).toLowerCase().includes(q))&&(!ff||o.delivery_type===ff)&&(!sf||prodUnits(o).some(x=>x.u.production_status===sf)))}
async function load(){showErr('');$('#orders').innerHTML='<div class="loading">Loading live orders…</div>';const {data,error}=await sb.from('wc_orders').select('*,wc_order_items(*,wc_production_units(*))').eq('is_hidden',false).order('wix_created_at',{ascending:false});if(error){showErr(error.message);$('#orders').innerHTML='';return}O=data||[];render();const last=O.map(o=>o.wix_synced_at).filter(Boolean).sort().at(-1);$('#syncnote').textContent=last?`Wix synced ${new Date(last).toLocaleString('en-AU')}`:''}
function showErr(t){$('#err').innerHTML=t?`<div class="error">${esc(t)}</div>`:''}
function render(){const F=filtered();$('#orders').innerHTML=`<table><thead><tr><th>Order</th><th>Date created</th><th>Customer</th><th>Payment</th><th>Fulfilment</th><th>Total</th><th>Items</th><th>Status</th></tr></thead><tbody>${F.map(o=>`<tr data-order="${o.id}"><td><b>#${esc(o.order_number)}</b></td><td>${fmtDate(o.wix_created_at)}</td><td>${esc(o.customer_name||'—')}<div class="mut">${esc(o.company||'')}</div></td><td>${pay(o)}</td><td>${ful(o)}</td><td>${fmtMoney(o.total,o.currency)}</td><td style="color:#116dff">${items(o).filter(isProd).reduce((n,i)=>n+Math.max(1,Number(i.quantity||1)),0)}</td><td class="statussum">${esc(sum(o))}</td></tr>`).join('')}</tbody></table>`;$('#orders').querySelectorAll('tbody tr').forEach(r=>r.onclick=()=>openOrder(r.dataset.order));let E=[];F.forEach(o=>items(o).filter(isProd).forEach(i=>units(i).forEach(u=>E.push({o,i,u}))));$('#board').innerHTML=S.map(st=>{const C=E.filter(x=>(x.u.production_status||'New')===st);return `<div class="col"><div class="ch"><span>${st}</span><span>${C.length}</span></div>${C.map(x=>`<div class="pcard" data-order="${x.o.id}" data-unit="${x.u.id}"><div class="ordercode">#${esc(x.o.order_number)}-${x.u.unit_index}</div><div class="customer">${esc(x.o.customer_name||'—')}</div><div class="mut">${esc(x.o.company||'')}</div><div class="product">${esc(x.i.product_name||'Unnamed product')}</div><div class="meta">${esc(optionText(x.i).slice(0,2).join(' · '))}</div><div style="margin-top:6px">${pay(x.o)} ${ful(x.o)}</div><select data-unit="${x.u.id}">${S.map(s=>`<option ${s===(x.u.production_status||'New')?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</div>`}).join('');$('#board').querySelectorAll('.pcard').forEach(c=>c.onclick=e=>{if(e.target.tagName!=='SELECT')openOrder(c.dataset.order,c.dataset.unit)});$('#board').querySelectorAll('select[data-unit]').forEach(s=>s.onchange=()=>setStatus(s.dataset.unit,s.value));$('#oc').textContent=O.length;const all=O.flatMap(prodUnits);$('#ic').textContent=all.filter(x=>x.u.production_status!=='Ready').length;$('#rc').textContent=all.filter(x=>x.u.production_status==='Ready').length}
async function setStatus(unitId,status){const unit=O.flatMap(o=>items(o).flatMap(i=>units(i))).find(u=>u.id===unitId);const old=unit?.production_status;if(unit)unit.production_status=status;render();const {error}=await sb.from('wc_production_units').update({production_status:status}).eq('id',unitId);if(error){if(unit)unit.production_status=old;render();showErr('Could not save status: '+error.message)}else showErr('')}
function openOrder(orderId,focusUnit=null){const o=O.find(x=>x.id===orderId);if(!o)return;$('#dn').textContent='#'+(o.order_number||'');$('#dc').textContent=o.customer_name||'';$('#dco').textContent=o.company||'';const address=o.delivery_address&&typeof o.delivery_address==='object'?[o.delivery_address.addressLine,o.delivery_address.city,o.delivery_address.subdivision,o.delivery_address.postalCode].filter(Boolean).join(', '):'';$('#db').innerHTML=`<div class="sec"><div class="st">Overview</div><div class="grid"><div class="box"><b>Payment</b><br>${pay(o)}</div><div class="box"><b>Fulfilment</b><br>${ful(o)}</div><div class="box"><b>Total</b><br>${fmtMoney(o.total,o.currency)}</div><div class="box"><b>Date</b><br>${fmtDate(o.wix_created_at)}</div><div class="box"><b>Status</b><br>${esc(sum(o))}</div><div class="box"><b>Items</b><br>${items(o).filter(isProd).reduce((n,i)=>n+Number(i.quantity||1),0)}</div></div>${address?`<div class="note"><b>Delivery:</b> ${esc(address)}</div>`:''}${o.buyer_note?`<div class="note"><b>Buyer note:</b> ${esc(o.buyer_note)}</div>`:''}</div><div class="sec"><div class="st">Items</div>${items(o).map(i=>`<div class="item"><b>${esc(i.product_name||'Unnamed item')}</b>${isProd(i)?'':'<span class="pill" style="float:right">Add-on</span>'}<div><span class="pill">qty: ${i.quantity||1}</span>${optionText(i).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>${isProd(i)?units(i).map(u=>`<div class="unitrow" style="${focusUnit===u.id?'outline:2px solid #116dff;border-radius:7px;padding:4px':''}"><span>Unit ${u.unit_index}</span><select data-drawer-unit="${u.id}">${S.map(s=>`<option ${s===(u.production_status||'New')?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):''}</div>`).join('')}</div>`;$('#db').querySelectorAll('select[data-drawer-unit]').forEach(s=>s.onchange=async()=>{await setStatus(s.dataset.drawerUnit,s.value);openOrder(orderId,s.dataset.drawerUnit)});$('#shade').classList.add('on')}
S.forEach(s=>$('#sf').insertAdjacentHTML('beforeend',`<option>${s}</option>`));['search','sf','ff'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#clear').onclick=()=>{$('#search').value='';$('#sf').value='';$('#ff').value='';render()};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));b.classList.add('on');const v=b.dataset.v;$('#orders').classList.toggle('hidden',v!=='orders');$('#board').classList.toggle('hidden',v!=='board');$('#stats').classList.toggle('hidden',v!=='orders');$('#pt').textContent=v==='orders'?'Orders':'Production Board'});$('#x').onclick=()=>$('#shade').classList.remove('on');$('#shade').onclick=e=>{if(e.target===$('#shade'))$('#shade').classList.remove('on')};
$('#loginform').onsubmit=async e=>{e.preventDefault();$('#loginmsg').textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginmsg').textContent=error?error.message:''};$('#logout').onclick=()=>sb.auth.signOut();
async function applySession(session){if(session){$('#loginwrap').classList.add('hidden');$('#app').classList.remove('hidden');$('#account').textContent=session.user.email||'';await load()}else{$('#app').classList.add('hidden');$('#loginwrap').classList.remove('hidden');O=[]}}
const {data:{session}}=await sb.auth.getSession();await applySession(session);sb.auth.onAuthStateChange((_event,s)=>{applySession(s)});
</script>
</body></html>
