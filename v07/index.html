<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Corner Orders v0.7.0</title>
<style>
:root{--bg:#eef1f5;--nav:#171b24;--line:#dfe5ec;--txt:#1d2940;--mut:#758198;--blue:#116dff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px Arial,sans-serif;background:var(--bg);color:var(--txt)}button,input,select{font:inherit}.hidden{display:none!important}
.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--nav);color:#fff;padding:18px 0;display:flex;flex-direction:column;z-index:8}.brand{font-size:20px;font-weight:800;padding:0 20px 22px}.brand small{display:block;color:#9da7b8;font-size:11px;font-weight:400;margin-top:4px}.nav{border:0;background:none;color:#dce2ec;text-align:left;padding:12px 20px;cursor:pointer;font-weight:600}.nav:hover,.nav.on{background:#3c414c;color:#fff}.main{margin-left:230px;min-height:100vh}.top{height:52px;background:#f8f9fb;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:5}.title{font-size:17px}.content{padding:14px 24px 20px}.stats{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 18px;display:flex;gap:34px;margin-bottom:12px}.stats b{font-size:16px;margin-left:5px}.syncnote{margin-left:auto;color:var(--mut);font-size:11px}
.tools{background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:10px 14px;display:flex;gap:10px;align-items:center}.tools .grow{flex:1}input,select{border:1px solid #cfd8e6;border-radius:20px;padding:8px 12px;background:#fff;outline:none}input:focus,select:focus{border-color:var(--blue)}#search{width:255px}#clear{border:1px solid #cfd8e6;background:#fff;color:var(--blue);border-radius:20px;padding:8px 13px;cursor:pointer}.table{background:#fff;border:1px solid var(--line);border-radius:0 0 12px 12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th{background:#f7f9fb;text-align:left;font-size:12px;font-weight:600;padding:13px 14px;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:2}td{padding:15px 14px;border-bottom:1px solid #e8ecf1}tbody tr:hover td{background:#f8fbff}tbody tr{cursor:pointer}.mut{font-size:12px;color:var(--mut)}.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:600}.paid{background:#c9efdb;color:#17643d}.unpaid{background:#ffdede;color:#8b2e2e}.ship{background:#edeaff;color:#514a9e}.pick{background:#e5f0ff;color:#2d62a8}.statussum{font-size:13px;font-weight:400;white-space:nowrap}.review td{background:#fff1f1!important}.review td:first-child{box-shadow:inset 4px 0 0 #d14343}.reviewtag{display:inline-block;margin-left:7px;padding:3px 7px;border-radius:4px;background:#ffdede;color:#8b2e2e;font-size:10px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:10px;overflow-x:auto;margin-top:18px}.col{background:#f4f6f9;border:1px solid #e0e5eb;border-radius:12px;padding:8px;min-height:500px}.ch{display:flex;justify-content:space-between;font-weight:700;padding:3px 4px 9px}.ch span:last-child{background:#fff;border:1px solid var(--line);border-radius:12px;padding:2px 7px;font-size:11px}.pcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:pointer}.pcard:hover{border-color:#a8c4ed}.ordercode{font-weight:700}.customer{margin-top:5px;font-size:14px;font-weight:700}.product{margin-top:6px;font-size:12px;font-weight:600;line-height:1.3}.meta{font-size:11px;color:var(--mut);margin-top:2px}
.homepanel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;max-width:720px}.homepanel h2{margin:0 0 18px;font-size:20px}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.homebox{border:1px solid var(--line);border-radius:9px;padding:14px;background:#fbfcfd}.label{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:6px}.home-signout{margin-top:16px;border:1px solid #cfd8e6;background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}
.shade{display:none;position:fixed;inset:0;background:#0f172a55;z-index:20}.shade.on{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(900px,96vw);background:#fff;overflow:auto;box-shadow:-6px 0 25px #0002}.dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;position:sticky;top:0;background:#fff;z-index:2}.dhmain{min-width:220px}.headstatus{display:flex;align-items:center;gap:10px;margin-left:auto;margin-right:14px}.headstatus label{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;white-space:nowrap}.headstatus select{min-width:185px;height:44px;border-radius:23px;padding:8px 36px 8px 16px;font-size:14px;font-weight:700}.close{border:0;background:#eef1f5;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}.db{padding:20px 22px}.sec{margin-bottom:22px}.st{font-size:11px;text-transform:uppercase;color:#7a8599;font-weight:700;margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.box,.item{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfd}.item{background:#fff;margin-bottom:8px}.pill{display:inline-block;background:#f1f4f7;border-radius:5px;padding:4px 6px;font-size:11px;margin:5px 5px 0 0}.addonpill{float:right}.addons-title{font-size:11px;text-transform:uppercase;color:#7a8599;font-weight:700;margin:18px 0 9px;padding-top:14px;border-top:1px solid var(--line)}.note{white-space:pre-wrap;font-size:12px;color:#4a5669;margin-top:8px}
.loading{padding:45px;text-align:center;color:var(--mut)}.error{background:#fff1f1;color:#8c2f2f;border:1px solid #f0caca;padding:12px 14px;border-radius:8px;margin-bottom:12px}.loginwrap{position:fixed;inset:0;background:#eef1f5;display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}.login{width:min(390px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}.login h1{font-size:22px;margin:0 0 5px}.login p{color:var(--mut);margin:0 0 22px}.login label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}.login input{width:100%;border-radius:7px;padding:10px 11px}.login button{width:100%;border:0;background:var(--blue);color:#fff;border-radius:8px;padding:10px 12px;font-weight:700;margin-top:16px;cursor:pointer}.loginmsg{font-size:12px;color:#9b3333;margin-top:10px;min-height:16px}
@media(max-width:900px){.side{width:70px}.main{margin-left:70px}.brand{font-size:0}.brand:after{content:'WC';font-size:16px}.brand small{display:none}.nav{font-size:0}.nav:before{content:'◫';font-size:18px}.content{padding:12px}.top{padding:0 14px}.stats{gap:15px;overflow:auto}.grid,.homegrid{grid-template-columns:1fr}.headstatus label{display:none}}
</style>
</head>
<body>
<div id="loginwrap" class="loginwrap hidden"><form id="loginform" class="login"><h1>White Corner Orders</h1><p>Sign in to view live Wix orders.</p><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Sign in</button><div id="loginmsg" class="loginmsg"></div></form></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">White Corner<small>Operations</small></div><button class="nav on" data-v="home">Home</button><button class="nav" data-v="orders">Orders</button><button class="nav" data-v="board">Production Board</button></aside><main class="main"><div class="top"><div class="title" id="pt">Home</div></div><div class="content"><div id="err"></div><div id="home"><div class="homepanel"><h2>White Corner Orders</h2><div class="homegrid"><div class="homebox"><div class="label">Version</div><div><b>v0.7.0 Live</b></div></div><div class="homebox"><div class="label">Account status</div><div>Signed in</div></div><div class="homebox" style="grid-column:1/-1"><div class="label">Signed in as</div><div id="homeEmail">—</div></div></div><button class="home-signout" id="homeSignout">Sign out</button></div></div><div class="stats hidden" id="stats"><span>Orders <b id="oc">0</b></span><span>In production <b id="ic">0</b></span><span>Ready <b id="rc">0</b></span><span class="syncnote" id="syncnote"></span></div><div class="tools hidden" id="tools"><select id="typef"><option value="">All product types</option><option value="cart">Carts</option><option value="other">Others</option></select><select id="sf"><option value="">All statuses</option></select><select id="ff"><option value="">All fulfilment</option><option>Shipping</option><option>Pickup</option></select><div class="grow"></div><button id="clear">Clear filters</button><input id="search" placeholder="Search..."></div><div id="orders" class="table hidden"><div class="loading">Loading live orders…</div></div><div id="board" class="board hidden"></div></div></main></div>
<div class="shade" id="shade"><div class="drawer"><div class="dh"><div class="dhmain"><b id="dn"></b><div id="dc"></div><div class="mut" id="dco"></div></div><div id="headstatus"></div><button class="close" id="x">×</button></div><div class="db" id="db"></div></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://zgvnrpspwluapaxnycrg.supabase.co','sb_publishable_DwutkRc9dxioIdUcdPn4gA_RfDb1-n_',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const S=['New','CNC','Assembly','Painting','Packing','Ready'];
const ADDON_TERMS=['delivery','additional tabletop','custom cutout','custom cutouts','side shelves','integrated ice storage shelf','umbrella hole','support panel','customisation','customization','back panel with','benchtop upgrade'];
const REVIEW_HINTS=['upgrade','additional','cutout','cut-out','accessory','shelf','shelves','support panel','back panel'];
const CART_TERMS=['cart','mobile bar','serving table','event bar'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
let O=[],currentView='home';
function items(o){return o.wc_order_items||[]} function units(i){return (i.wc_production_units||[]).sort((a,b)=>a.unit_index-b.unit_index)}
function isAddonName(n){n=String(n||'').toLowerCase();return ADDON_TERMS.some(x=>n.includes(x))}
function isCartName(n){n=String(n||'').toLowerCase();return CART_TERMS.some(x=>n.includes(x))}
function shortName(n){return String(n||'').split(/\s[-–—]\s/)[0].trim()}
function classify(o){if(String(o.order_number)==='10812'){const up=items(o).find(i=>/tasmanian oak timber benchtop upgrade/i.test(i.product_name||''));const main=items(o).find(i=>!/tasmanian oak timber benchtop upgrade/i.test(i.product_name||'')&&!/^delivery$/i.test(i.product_name||''));const us=up?units(up):[];if(main&&us.length>=4)return {review:false,main:[main],addons:[up].filter(Boolean),logical:us.slice(0,4).map((u,k)=>({o,i:main,u,displayIndex:k+1,special:true}))};}
 const nonDelivery=items(o).filter(i=>!/^delivery$/i.test(i.product_name||''));const addons=nonDelivery.filter(i=>isAddonName(i.product_name));const main=nonDelivery.filter(i=>!isAddonName(i.product_name));if(!main.length&&addons.length)return {review:true,main:[],addons,logical:[]};const names=[...new Set(main.map(i=>i.product_name||''))];const unsure=names.length>1&&names.some(n=>REVIEW_HINTS.some(k=>n.toLowerCase().includes(k)));if(unsure)return {review:true,main,addons,logical:[]};const logical=main.flatMap(i=>units(i).map(u=>({o,i,u})));return {review:false,main,addons,logical};}
function logical(o){return classify(o).logical}
function statusSummary(o){const c={};S.forEach(s=>c[s]=0);logical(o).forEach(x=>c[x.u.production_status||'New']++);return S.filter(s=>c[s]).map(s=>`${c[s]} ${s}`).join(' · ')||'—'}
function fmtDate(v){if(!v)return '—';return new Intl.DateTimeFormat('en-AU',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(v))}
function fmtMoney(v,c='AUD'){try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:c||'AUD'}).format(Number(v))}catch{return String(v??'—')}}
function pay(o){const p=String(o.payment_status||'—');return `<span class="badge ${p.toUpperCase()==='PAID'?'paid':'unpaid'}">${esc(p.replaceAll('_',' '))}</span>`}
function ful(o){const f=o.delivery_type||'Shipping';return `<span class="badge ${f==='Pickup'?'pick':'ship'}">${esc(f)}</span>`}
function optionText(i){const out=[];const add=obj=>{if(!obj||typeof obj!=='object')return;Object.entries(obj).forEach(([k,v])=>{if(v===null||v===undefined||v==='')return;let val=typeof v==='object'?(v.value||v.name||v.description||''):v;if(val!=='')out.push(`${k}: ${val}`)})};add(i.wix_options);add(i.custom_text_fields);if(i.size)out.push(`Size: ${i.size}`);if(i.color)out.push(`Colour: ${i.color}`);let arr=[...new Set(out)];if(arr.some(x=>/logo or personalization:\s*no/i.test(x)))arr=arr.filter(x=>!/ready-to-use svg|please email us|file type/i.test(x));return arr.slice(0,8)}
function filteredOrders(){const q=$('#search').value.toLowerCase(),sf=$('#sf').value,ff=$('#ff').value;return O.filter(o=>(!q||JSON.stringify(o).toLowerCase().includes(q))&&(!ff||o.delivery_type===ff)&&(!sf||logical(o).some(x=>(x.u.production_status||'New')===sf)))}
function boardEntries(){let E=[];filteredOrders().forEach(o=>{const c=classify(o);if(!c.review)E.push(...c.logical)});const tf=$('#typef').value;if(tf)E=E.filter(x=>(isCartName(x.i.product_name)?'cart':'other')===tf);return E.sort((a,b)=>new Date(a.o.wix_created_at)-new Date(b.o.wix_created_at)||Number(a.o.order_number)-Number(b.o.order_number))}
function render(){const F=filteredOrders();$('#orders').innerHTML=`<table><thead><tr><th>Order</th><th>Date created</th><th>Customer</th><th>Payment</th><th>Fulfilment</th><th>Total</th><th>Items</th><th>Status</th></tr></thead><tbody>${F.map(o=>{const c=classify(o);return `<tr class="${c.review?'review':''}" data-order="${o.id}"><td><b>#${esc(o.order_number)}</b>${c.review?'<span class="reviewtag">Needs review</span>':''}</td><td>${fmtDate(o.wix_created_at)}</td><td>${esc(o.customer_name||'—')}<div class="mut">${esc(o.company||'')}</div></td><td>${pay(o)}</td><td>${ful(o)}</td><td>${fmtMoney(o.total,o.currency)}</td><td style="color:#116dff">${c.review?'—':c.logical.length}</td><td class="statussum">${c.review?'Needs review':esc(statusSummary(o))}</td></tr>`}).join('')}</tbody></table>`;$('#orders').querySelectorAll('tbody tr').forEach(r=>r.onclick=()=>openOrder(r.dataset.order,null));const E=boardEntries();$('#board').innerHTML=S.map(st=>{const C=E.filter(x=>(x.u.production_status||'New')===st);return `<div class="col"><div class="ch"><span>${st}</span><span>${C.length}</span></div>${C.map(x=>{const total=logical(x.o).length;const idx=x.special?x.displayIndex:(total>1?logical(x.o).findIndex(y=>y.u.id===x.u.id)+1:null);const code=idx?`#${x.o.order_number}-${idx}`:`#${x.o.order_number}`;return `<div class="pcard" data-order="${x.o.id}" data-unit="${x.u.id}"><div class="ordercode">${code}</div><div class="customer">${esc(x.o.customer_name||'—')}</div><div class="mut">${esc(x.o.company||'')}</div><div class="product">${esc(shortName(x.i.product_name||'Unnamed product'))}</div><div class="meta">${esc(optionText(x.i).slice(0,2).join(' · '))}${x.special?' · Tasmanian Oak Benchtop Upgrade':''}</div><div style="margin-top:6px">${pay(x.o)} ${ful(x.o)}</div></div>`}).join('')}</div>`}).join('');$('#board').querySelectorAll('.pcard').forEach(c=>c.onclick=()=>openOrder(c.dataset.order,c.dataset.unit));$('#oc').textContent=O.length;const all=O.flatMap(o=>logical(o));$('#ic').textContent=all.filter(x=>(x.u.production_status||'New')!=='Ready').length;$('#rc').textContent=all.filter(x=>(x.u.production_status||'New')==='Ready').length}
async function setStatus(unitId,status){for(const o of O)for(const i of items(o)){const u=units(i).find(x=>x.id===unitId);if(u){const old=u.production_status;u.production_status=status;render();const {error}=await sb.from('wc_production_units').update({production_status:status}).eq('id',unitId);if(error){u.production_status=old;render();showErr('Could not save status: '+error.message)}return}}}
function itemCard(i,addon=false,qtyOverride=null){return `<div class="item"><b>${esc(i.product_name||'Unnamed item')}</b>${addon?'<span class="pill addonpill">Add-on</span>':''}<div><span class="pill">qty: ${qtyOverride??i.quantity??1}</span>${optionText(i).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div>`}
function openOrder(orderId,focusUnit){const o=O.find(x=>x.id===orderId);if(!o)return;const c=classify(o);$('#dn').textContent='#'+o.order_number;$('#dc').textContent=o.customer_name||'';$('#dco').textContent=o.company||'';const address=o.delivery_address&&typeof o.delivery_address==='object'?[o.delivery_address.addressLine,o.delivery_address.city,o.delivery_address.subdivision,o.delivery_address.postalCode].filter(Boolean).join(', '):'';let status='Needs review',count='—';if(!c.review){status=statusSummary(o);count=c.logical.length}const focused=focusUnit?c.logical.find(x=>x.u.id===focusUnit):null;$('#headstatus').innerHTML=focused?`<div class="headstatus"><label>Change status</label><select id="drawerStatus">${S.map(s=>`<option ${s===(focused.u.production_status||'New')?'selected':''}>${s}</option>`).join('')}</select></div>`:'';const mains=focusUnit&&focused?[focused.i]:c.main;const mainHtml=mains.map(i=>itemCard(i,false,focusUnit?1:null)).join('');const addHtml=c.addons.filter(Boolean).map(i=>itemCard(i,true,focusUnit&&String(o.order_number)==='10812'?1:null)).join('');$('#db').innerHTML=`<div class="sec"><div class="st">Overview</div><div class="grid"><div class="box"><b>Payment</b><br>${pay(o)}</div><div class="box"><b>Fulfilment</b><br>${ful(o)}</div><div class="box"><b>Total</b><br>${fmtMoney(o.total,o.currency)}</div><div class="box"><b>Date</b><br>${fmtDate(o.wix_created_at)}</div><div class="box"><b>Status</b><br>${esc(status)}</div><div class="box"><b>Items</b><br>${esc(count)}</div></div>${address?`<div class="note"><b>Delivery:</b> ${esc(address)}</div>`:''}${o.buyer_note?`<div class="note"><b>Buyer note:</b> ${esc(o.buyer_note)}</div>`:''}</div><div class="sec"><div class="st">Items</div>${mainHtml}${addHtml?`<div class="addons-title">Add-ons</div>${addHtml}`:''}</div>`;if(focused)$('#drawerStatus').onchange=async e=>{await setStatus(focused.u.id,e.target.value);openOrder(orderId,focusUnit)};$('#shade').classList.add('on')}
function showErr(t){$('#err').innerHTML=t?`<div class="error">${esc(t)}</div>`:''}
async function load(){showErr('');const {data,error}=await sb.from('wc_orders').select('*,wc_order_items(*,wc_production_units(*))').eq('is_hidden',false).order('wix_created_at',{ascending:false});if(error){showErr(error.message);return}O=data||[];render();const last=O.map(o=>o.wix_synced_at).filter(Boolean).sort().at(-1);$('#syncnote').textContent=last?`Wix synced ${new Date(last).toLocaleString('en-AU')}`:''}
function view(v){currentView=v;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.v===v));$('#home').classList.toggle('hidden',v!=='home');$('#stats').classList.toggle('hidden',v!=='orders');$('#tools').classList.toggle('hidden',v==='home');$('#orders').classList.toggle('hidden',v!=='orders');$('#board').classList.toggle('hidden',v!=='board');$('#pt').textContent=v==='home'?'Home':v==='orders'?'Orders':'Production Board';$('#typef').style.display=v==='board'?'':'none'}
S.forEach(s=>$('#sf').insertAdjacentHTML('beforeend',`<option>${s}</option>`));['search','sf','ff','typef'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#clear').onclick=()=>{$('#search').value='';$('#sf').value='';$('#ff').value='';$('#typef').value='';render()};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>view(b.dataset.v));$('#x').onclick=()=>$('#shade').classList.remove('on');$('#shade').onclick=e=>{if(e.target===$('#shade'))$('#shade').classList.remove('on')};$('#homeSignout').onclick=()=>sb.auth.signOut();$('#loginform').onsubmit=async e=>{e.preventDefault();$('#loginmsg').textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginmsg').textContent=error?error.message:''};
async function applySession(session){if(session){$('#loginwrap').classList.add('hidden');$('#app').classList.remove('hidden');$('#homeEmail').textContent=session.user.email||'';await load();view('home')}else{$('#app').classList.add('hidden');$('#loginwrap').classList.remove('hidden');O=[]}}
const {data:{session}}=await sb.auth.getSession();await applySession(session);sb.auth.onAuthStateChange((_e,s)=>applySession(s));
</script>
</body></html>
