<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Corner Orders Prototype v0.3</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#dfe3e8;--text:#17191c;--muted:#6d737c;--done:#27ef21;--active:#fff20a;--hold:#ffb3b3;}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:30}
.brand{font-weight:800;font-size:21px} .sub{font-size:12px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:6px} .tab{border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:700;color:#666;cursor:pointer} .tab.active{background:#111827;color:white}
.toolbar{padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap} input,select,button{font:inherit} input,select{border:1px solid #ccd1d7;border-radius:9px;padding:9px 10px;background:#fff} input{min-width:260px} button{border:1px solid #ccd1d7;background:white;border-radius:9px;padding:9px 11px;cursor:pointer;font-weight:650}
.main{padding:0 20px 24px} .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse} th{text-align:left;background:#fafbfc;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:10px;border-bottom:1px solid var(--line)} td{padding:11px;border-bottom:1px solid #edf0f2;vertical-align:middle}
tr.clickable{cursor:pointer} tr.clickable:hover{background:#fafbfc} .num{font-weight:800} .muted{color:var(--muted);font-size:12px} .money{font-weight:800}
.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;background:#eef1f4} .paid{background:#e8f7ec} .pickup{background:#e9f3ff} .ship{background:#f1efff}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto} .col{background:#eceff3;border-radius:12px;padding:10px;min-height:520px} .colhead{display:flex;justify-content:space-between;font-weight:800;font-size:13px;padding:3px 4px 9px}
.ocard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;cursor:pointer} .ocard:hover{border-color:#b8c0ca}
.hidden{display:none!important}
.drawerbg{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:50;display:none} .drawerbg.open{display:block} .drawer{position:absolute;right:0;top:0;bottom:0;width:min(760px,96vw);background:white;overflow:auto}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;position:sticky;top:0;background:white;z-index:2} .close{border:0;background:#f0f2f4;border-radius:9px;width:34px;height:34px;font-size:18px}
.dbody{padding:18px 20px} .section{margin-bottom:20px} .sectitle{font-size:12px;text-transform:uppercase;font-weight:800;color:#747a82;margin-bottom:8px} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .box{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fafbfc} .box b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px} .pill{display:inline-block;background:#f0f2f4;border-radius:7px;padding:4px 6px;font-size:11px;margin:4px 5px 0 0}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px} .step{padding:8px 5px;border-radius:8px;text-align:center;background:#f0f2f4;font-size:11px;font-weight:800;cursor:pointer} .step.done{background:#e8f7ec} .step.current{background:#111827;color:white}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top">
  <div><div class="brand">White Corner Orders</div><div class="sub">Prototype v0.3 · mock data · item-level production</div></div>
  <div class="tabs">
    <button class="tab active" data-view="orders">Orders</button>
    <button class="tab" data-view="board">Production Board</button>
  </div>
</div>
<div class="toolbar">
  <input id="search" placeholder="Search order, customer, company, product">
  <select id="statusFilter"><option value="">All production statuses</option></select>
  <select id="deliveryFilter"><option value="">All fulfilment</option><option>Shipping</option><option>Pickup</option></select>
  <button id="clear">Clear filters</button>
</div>
<div class="main">
  <div id="ordersView" class="card">
    <table><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Payment</th><th>Production</th><th>Fulfilment</th><th>Total</th></tr></thead><tbody id="ordersBody"></tbody></table>
  </div>
  <div id="boardView" class="hidden"><div class="board" id="board"></div></div>
</div>

<div class="drawerbg" id="drawerbg"><div class="drawer"><div class="dhead"><div><div class="num" id="dnum"></div><div id="dname"></div><div class="muted" id="dcompany"></div></div><button class="close" id="close">×</button></div><div class="dbody" id="dbody"></div></div></div>

<script>
const DEFAULT_ORDERS=[{"id": "o10829", "number": "10829", "date": "29 Aug 2026", "name": "Kate Murphy", "company": "Silver Cedar", "email": "customer1@example.com", "payment": "PAID", "fulfilment": "Shipping", "total": "AU$545.00", "address": "27 Sample St, Crace ACT 2911", "buyerNote": "", "items": [{"product": "Portable Market Mini Table with shelves", "size": "150×60×85", "color": "white", "tabletop": "", "additional": "", "sideShelf": "yes", "shelf": "", "iceShelf": "yes", "hole": "33", "logo": "", "comment": "12 × 1/6 GN cutouts and 1 × 1/2", "status": "New"}]}, {"id": "o10828", "number": "10828", "date": "29 Aug 2026", "name": "Sonia Wallace", "company": "Sweet Tooth Events", "email": "customer2@example.com", "payment": "PAID", "fulfilment": "Pickup", "total": "AU$975.00", "address": "Burleigh Heads QLD 4220", "buyerNote": "Family will collect this order.", "items": [{"product": "Essential Cart - Plywood Mobile", "size": "150×60×85", "color": "white", "tabletop": "", "additional": "", "sideShelf": "", "shelf": "", "iceShelf": "yes", "hole": "38", "logo": "", "comment": "pick up", "status": "CNC"}, {"product": "Umbrella hole for the Mobile Cart", "size": "", "color": "", "tabletop": "", "additional": "", "sideShelf": "", "shelf": "", "iceShelf": "", "hole": "38", "logo": "", "comment": "", "status": null}]}, {"id": "o10827", "number": "10827", "date": "28 Aug 2026", "name": "Samantha Harris", "company": "Creative Co", "email": "customer3@example.com", "payment": "PAID", "fulfilment": "Shipping", "total": "AU$505.00", "address": "50 Sample Dr, Maroochy River QLD 4561", "buyerNote": "", "items": [{"product": "Plywood Hollow Event Backdrop with Rectangular Top", "size": "150×60×85", "color": "white", "tabletop": "plain", "additional": "", "sideShelf": "", "shelf": "", "iceShelf": "", "hole": "", "logo": "", "comment": "", "status": "Assembly"}]}, {"id": "o10825", "number": "10825", "date": "27 Aug 2026", "name": "Sarah Walton", "company": "Alepat Taylor", "email": "customer4@example.com", "payment": "PAID", "fulfilment": "Shipping", "total": "AU$3,205.00", "address": "992 Sample Rd, Albert Park SA 5014", "buyerNote": "Please confirm custom cutout layout before production.", "items": [{"product": "MDF Mobile Bar Cart with Decorative Wheels", "size": "120×90×60", "color": "pink", "tabletop": "", "additional": "", "sideShelf": "", "shelf": "yes", "iceShelf": "", "hole": "", "logo": "", "comment": "", "status": "Painting"}, {"product": "Umbrella hole for the Mobile Cart", "size": "", "color": "", "tabletop": "", "additional": "", "sideShelf": "", "shelf": "", "iceShelf": "", "hole": "38", "logo": "", "comment": "", "status": null}, {"product": "Back panel with a pair of closable doors", "size": "", "color": "white", "tabletop": "", "additional": "custom", "sideShelf": "", "shelf": "", "iceShelf": "", "hole": "", "logo": "", "comment": "White finish", "status": null}, {"product": "Customisation of the tabletop and shelf height", "size": "", "color": "", "tabletop": "custom cutout", "additional": "custom", "sideShelf": "", "shelf": "yes", "iceShelf": "", "hole": "", "logo": "", "comment": "Custom cutout and adjusted support shelf", "status": null}]}, {"id": "o10824", "number": "10824", "date": "26 Aug 2026", "name": "Modena Trading", "company": "", "email": "customer5@example.com", "payment": "PAID", "fulfilment": "Shipping", "total": "AU$2,085.00", "address": "Unit 6, Sample St, Alexandria NSW 2015", "buyerNote": "", "items": [{"product": "MDF Mobile Bar Cart with Decorative Wheels", "size": "130×60×90", "color": "white", "tabletop": "", "additional": "", "sideShelf": "", "shelf": "yes", "iceShelf": "", "hole": "", "logo": "", "comment": "", "status": "Packing"}, {"product": "Delivery", "size": "", "color": "", "tabletop": "", "additional": "", "sideShelf": "", "shelf": "", "iceShelf": "", "hole": "", "logo": "", "comment": "", "status": null}]}, {"id": "o10812", "number": "10812", "date": "25 Aug 2026", "name": "Gareth Keenan", "company": "", "email": "customer6@example.com", "payment": "PAID", "fulfilment": "Shipping", "total": "AU$4,100.00", "address": "Sample address", "buyerNote": "", "items": [{"product": "Plywood Mobile Bar “Classic”", "size": "140×60×100", "color": "white", "tabletop": "tasmanian oak", "additional": "", "sideShelf": "", "shelf": "yes", "iceShelf": "", "hole": "", "logo": "", "comment": "", "status": "New"}, {"product": "Plywood Mobile Bar “Classic”", "size": "140×60×100", "color": "white", "tabletop": "tasmanian oak", "additional": "", "sideShelf": "", "shelf": "yes", "iceShelf": "", "hole": "", "logo": "", "comment": "", "status": "CNC"}, {"product": "Plywood Mobile Bar “Classic”", "size": "140×60×100", "color": "white", "tabletop": "tasmanian oak", "additional": "", "sideShelf": "", "shelf": "yes", "iceShelf": "", "hole": "", "logo": "", "comment": "", "status": "Assembly"}, {"product": "Plywood Mobile Bar “Classic”", "size": "140×60×100", "color": "white", "tabletop": "tasmanian oak", "additional": "", "sideShelf": "", "shelf": "yes", "iceShelf": "", "hole": "", "logo": "", "comment": "", "status": "Painting"}]}];
const STATUSES=["New","CNC","Assembly","Painting","Packing","Ready"];
const KEY="wc-orders-unified-v03";
let orders=JSON.parse(localStorage.getItem(KEY)||"null")||DEFAULT_ORDERS;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const ADDON_PATTERNS=["umbrella hole","delivery","customisation","customization","back panel with"];

function save(){localStorage.setItem(KEY,JSON.stringify(orders))}
function isProductionItem(i){
  const p=(i.product||"").toLowerCase();
  return !ADDON_PATTERNS.some(x=>p.includes(x));
}
function productionItems(o){
  return o.items.map((item,rawIndex)=>({item,rawIndex})).filter(x=>isProductionItem(x.item));
}
function orderMatches(o){
  const q=$("#search").value.toLowerCase().trim();
  const sf=$("#statusFilter").value;
  const df=$("#deliveryFilter").value;
  const text=[o.number,o.name,o.company,o.email,o.buyerNote,...o.items.flatMap(i=>Object.values(i).filter(v=>v!=null))].join(" ").toLowerCase();
  const p=productionItems(o);
  return (!q||text.includes(q)) && (!df||o.fulfilment===df) && (!sf||p.some(x=>x.item.status===sf));
}
function filteredOrders(){return orders.filter(orderMatches)}
function boardEntries(){
  const sf=$("#statusFilter").value;
  const out=[];
  filteredOrders().forEach(o=>{
    let seq=0;
    o.items.forEach((item,rawIndex)=>{
      if(!isProductionItem(item)) return;
      seq++;
      if(sf && item.status!==sf) return;
      out.push({o,item,rawIndex,seq,code:`${o.number}-${seq}`});
    });
  });
  return out;
}
function badgePay(o){return `<span class="badge paid">${esc(o.payment)}</span>`}
function badgeFul(o){return `<span class="badge ${o.fulfilment==="Pickup"?"pickup":"ship"}">${esc(o.fulfilment)}</span>`}
function setItemStatus(orderId,rawIndex,status){
  const o=orders.find(x=>x.id===orderId);
  if(!o||!o.items[rawIndex]) return;
  o.items[rawIndex].status=status;
  save(); render();
}
function productionSummary(o){
  const p=productionItems(o);
  if(!p.length) return "—";
  const counts={};
  STATUSES.forEach(s=>counts[s]=0);
  p.forEach(x=>counts[x.item.status||"New"]=(counts[x.item.status||"New"]||0)+1);
  return STATUSES.filter(s=>counts[s]).map(s=>`${counts[s]} ${s}`).join(" · ");
}
function renderOrders(){
  $("#ordersBody").innerHTML=filteredOrders().map(o=>`<tr class="clickable" onclick="openOrder('${o.id}')">
    <td><div class="num">#${esc(o.number)}</div></td>
    <td><b>${esc(o.name)}</b><div class="muted">${esc(o.company)}</div></td>
    <td>${esc(o.date)}</td>
    <td>${badgePay(o)}</td>
    <td><div style="font-size:12px;font-weight:700">${esc(productionSummary(o))}</div></td>
    <td>${badgeFul(o)}</td>
    <td class="money">${esc(o.total)}</td>
  </tr>`).join("");
}
function specLine(i){
  return [i.size,i.color,i.tabletop].filter(Boolean).join(" · ");
}
function renderBoard(){
  const entries=boardEntries();
  $("#board").innerHTML=STATUSES.map(s=>{
    const cards=entries.filter(x=>(x.item.status||"New")===s);
    return `<div class="col">
      <div class="colhead"><span>${s}</span><span>${cards.length}</span></div>
      ${cards.map(x=>`<div class="ocard" onclick="openOrder('${x.o.id}',${x.rawIndex})">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <b>#${esc(x.code)}</b>
          <span class="muted">${esc(x.o.date)}</span>
        </div>
        <div style="font-weight:700;margin-top:5px">${esc(x.o.name)}</div>
        <div class="muted">${esc(x.o.company)}</div>
        <div style="margin-top:8px;font-size:12px;line-height:1.35"><b>${esc(x.item.product)}</b></div>
        ${specLine(x.item)?`<div class="muted" style="margin-top:4px">${esc(specLine(x.item))}</div>`:""}
        <div style="margin-top:9px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${badgePay(x.o)} ${badgeFul(x.o)}</div>
        <select style="width:100%;margin-top:9px" onclick="event.stopPropagation()" onchange="setItemStatus('${x.o.id}',${x.rawIndex},this.value)">
          ${STATUSES.map(st=>`<option ${(x.item.status||"New")===st?"selected":""}>${st}</option>`).join("")}
        </select>
      </div>`).join("")}
    </div>`;
  }).join("");
}
function itemCode(o,rawIndex){
  let seq=0;
  for(let i=0;i<=rawIndex;i++) if(isProductionItem(o.items[i])) seq++;
  return `${o.number}-${seq}`;
}
function openOrder(id,focusRawIndex=null){
  const o=orders.find(x=>x.id===id);
  $("#dnum").textContent="#"+o.number;
  $("#dname").textContent=o.name;
  $("#dcompany").textContent=o.company||"";
  const p=productionItems(o);
  $("#dbody").innerHTML=`
    <div class="section"><div class="sectitle">Overview</div><div class="grid">
      <div class="box"><b>Payment</b>${badgePay(o)}</div>
      <div class="box"><b>Production</b>${esc(productionSummary(o))}</div>
      <div class="box"><b>Fulfilment</b>${badgeFul(o)}</div>
      <div class="box"><b>Total</b>${esc(o.total)}</div>
      <div class="box"><b>Date</b>${esc(o.date)}</div>
      <div class="box"><b>Email</b>${esc(o.email)}</div>
    </div></div>
    <div class="section"><div class="sectitle">Items</div>
      ${o.items.map((i,rawIndex)=>{
        const prod=isProductionItem(i);
        const focused=focusRawIndex===rawIndex;
        return `<div class="item" style="${focused?"box-shadow:inset 0 0 0 2px #111827;":""}">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
            <b>${prod?`#${esc(itemCode(o,rawIndex))} · `:""}${esc(i.product)}</b>
            ${prod?`<span class="badge">${esc(i.status||"New")}</span>`:`<span class="pill">Add-on</span>`}
          </div>
          <div>${["size","color","tabletop","additional","sideShelf","shelf","iceShelf","hole","logo"].filter(k=>i[k]).map(k=>`<span class="pill">${k}: ${esc(i[k])}</span>`).join("")}</div>
          ${i.comment?`<div class="muted" style="margin-top:7px">${esc(i.comment)}</div>`:""}
          ${prod?`<div style="margin-top:10px"><select style="width:100%" onchange="setItemStatus('${o.id}',${rawIndex},this.value);openOrder('${o.id}',${rawIndex})">
            ${STATUSES.map(st=>`<option ${(i.status||"New")===st?"selected":""}>${st}</option>`).join("")}
          </select></div>`:""}
        </div>`;
      }).join("")}
    </div>
    <div class="section"><div class="sectitle">Customer & fulfilment</div><div class="grid">
      <div class="box"><b>Name</b>${esc(o.name)}</div>
      <div class="box"><b>Company</b>${esc(o.company||"—")}</div>
      <div class="box"><b>Email</b>${esc(o.email)}</div>
      <div class="box"><b>Address</b>${esc(o.address)}</div>
      <div class="box"><b>Method</b>${esc(o.fulfilment)}</div>
      <div class="box"><b>Buyer note</b>${esc(o.buyerNote||"—")}</div>
    </div></div>`;
  $("#drawerbg").classList.add("open");
}
function render(){renderOrders();renderBoard()}
STATUSES.forEach(s=>$("#statusFilter").insertAdjacentHTML("beforeend",`<option>${s}</option>`));
["search","statusFilter","deliveryFilter"].forEach(id=>$("#"+id).addEventListener(id==="search"?"input":"change",render));
$("#clear").onclick=()=>{$("#search").value="";$("#statusFilter").value="";$("#deliveryFilter").value="";render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  const v=b.dataset.view;
  $("#ordersView").classList.toggle("hidden",v!=="orders");
  $("#boardView").classList.toggle("hidden",v!=="board");
});
$("#close").onclick=()=>$("#drawerbg").classList.remove("open");
$("#drawerbg").onclick=e=>{if(e.target.id==="drawerbg")$("#drawerbg").classList.remove("open")};
render();
</script>
</body></html>
