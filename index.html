<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White Corner Orders</title></head><body style="margin:0"><iframe id="app" src="./v04/" title="White Corner Orders" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe><script>document.getElementById('app').addEventListener('load',function(){const d=this.contentDocument||this.contentWindow.document;const s=d.createElement('style');s.textContent='.board{grid-template-columns:repeat(6,minmax(220px,1fr));gap:10px}.col{padding:8px}.pcard{padding:9px 10px;margin-bottom:7px;border-radius:9px}.pcard>div:nth-of-type(1){margin-top:5px!important;font-size:14px;font-weight:700!important}.pcard>div:nth-of-type(3){margin-top:6px!important}.pcard>div:nth-of-type(3)>b{font-size:12px;font-weight:600;line-height:1.3}.pcard>div:nth-of-type(4){font-size:11px}.pcard>div:nth-of-type(5){margin-top:6px!important}.pcard select{margin-top:7px;padding:6px 9px}.prod{font-size:13px!important;font-weight:400!important;color:var(--txt)!important;letter-spacing:0!important;white-space:nowrap}';d.head.appendChild(s);const add=d.querySelector('.primary');if(add)add.remove();d.querySelectorAll('th').forEach(th=>{if(th.textContent.trim()==='Production')th.textContent='Status'});d.querySelectorAll('.box>b').forEach(b=>{if(b.textContent.trim()==='Production')b.textContent='Status'});const top=d.querySelector('.top');if(top)top.style.justifyContent='flex-start'})</script></body></html>
