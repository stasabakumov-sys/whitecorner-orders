<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White Corner Orders</title></head><body style="margin:0"><iframe id="app" src="./v06/" title="White Corner Orders" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe><script>document.getElementById('app').addEventListener('load',function(){const d=this.contentDocument||this.contentWindow.document;const side=d.querySelector('.side'),firstNav=d.querySelector('.nav'),content=d.querySelector('.content'),pt=d.querySelector('#pt'),stats=d.querySelector('#stats'),tools=d.querySelector('.tools'),orders=d.querySelector('#orders'),board=d.querySelector('#board'),foot=d.querySelector('.foot'),account=d.querySelector('#account'),logout=d.querySelector('#logout');if(!side||!firstNav||!content)return;const s=d.createElement('style');s.textContent='.homepanel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:620px}.homepanel h2{margin:0 0 18px;font-size:18px}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.homebox{border:1px solid var(--line);border-radius:9px;padding:14px;background:#fbfcfd}.homelabel{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700;margin-bottom:6px}.homevalue{font-size:14px}.homesignout{margin-top:18px;border:1px solid #cfd8e6;background:#fff;color:var(--blue);border-radius:8px;padding:8px 13px;cursor:pointer}.side>.foot,.side>.account,.side>.logout{display:none!important}@media(max-width:900px){.homegrid{grid-template-columns:1fr}}';d.head.appendChild(s);const homeBtn=d.createElement('button');homeBtn.className='nav';homeBtn.textContent='Home';side.insertBefore(homeBtn,firstNav);const home=d.createElement('div');home.id='homepanel';home.className='homepanel hidden';content.insertBefore(home,content.firstChild);function email(){return account&&account.textContent.trim()?account.textContent.trim():'Signed in'}function drawHome(){home.innerHTML='<h2>White Corner Orders</h2><div class="homegrid"><div class="homebox"><div class="homelabel">Version</div><div class="homevalue">v0.6 Live</div></div><div class="homebox"><div class="homelabel">Account</div><div class="homevalue"><b>Signed in</b><br><span style="font-size:12px;color:var(--mut)">'+email()+'</span></div></div></div><button class="homesignout" id="homesignout">Sign out</button>';const b=d.querySelector('#homesignout');if(b)b.onclick=()=>logout&&logout.click()}function showHome(){d.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));homeBtn.classList.add('on');if(pt)pt.textContent='Home';drawHome();home.classList.remove('hidden');if(stats)stats.style.display='none';if(tools)tools.style.display='none';if(orders)orders.style.display='none';if(board)board.style.display='none'}homeBtn.onclick=showHome;d.querySelectorAll('.nav').forEach(b=>{if(b!==homeBtn)b.addEventListener('click',()=>{home.classList.add('hidden');if(tools)tools.style.display='';if(orders)orders.style.display='';if(board)board.style.display='';if(stats)stats.style.display=''})});})</script></body></html>
