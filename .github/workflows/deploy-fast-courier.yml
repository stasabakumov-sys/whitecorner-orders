name: Deploy Fast Courier quote integration

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/fast-courier-api/**'
      - 'supabase/migrations/20260903_add_fast_courier_quotes.sql'
      - '.github/workflows/deploy-fast-courier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify Fast Courier secret
        run: |
          supabase secrets list --project-ref zgvnrpspwluapaxnycrg \
            | grep -q 'FAST_COURIER_API_KEY'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply quote storage schema
        run: |
          jq -Rs '{query: .}' supabase/migrations/20260903_add_fast_courier_quotes.sql > /tmp/query.json
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data @/tmp/query.json \
            "https://api.supabase.com/v1/projects/zgvnrpspwluapaxnycrg/database/query"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy quote-only function
        run: supabase functions deploy fast-courier-api --project-ref zgvnrpspwluapaxnycrg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
