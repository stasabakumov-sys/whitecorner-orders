name: Deploy Fast Courier quote integration

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/fast-courier-api/**'
      - 'supabase/migrations/20260903000100_add_fast_courier_quotes.sql'
      - '.github/workflows/deploy-fast-courier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Fast Courier Edge source
        shell: bash
        run: |
          if grep -Fq '\\n    const apiKey' supabase/functions/fast-courier-api/index.ts; then
            echo 'Literal newline escaped the apiKey declaration.'
            exit 1
          fi
          grep -Fq "const apiKey = Deno.env.get('FAST_COURIER_API_KEY');" supabase/functions/fast-courier-api/index.ts
          grep -Fq "'Secret-Key': apiKey" supabase/functions/fast-courier-api/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy quote-only function
        run: supabase functions deploy fast-courier-api --project-ref zgvnrpspwluapaxnycrg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
