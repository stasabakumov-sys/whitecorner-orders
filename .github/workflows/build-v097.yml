name: Build v0.9.7 standalone
on:
  push:
    paths:
      - '.github/workflows/build-v097.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.9.7 from v0.9.6
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('v096/index.html').read_text()
          src=src.replace('White Corner Orders v0.9.6','White Corner Orders v0.9.7')
          src=src.replace('v0.9.6 Standalone','v0.9.7 Standalone')
          old="""function itemCard(i,o,addon=false){const im=media(i),qty=Number(i.quantity||1),unit=Number(i.unit_price||0),url=productUrl(i);return`<div class=\"orderitem\"><div>${im?`<img class=\"itemimg\" src=\"${esc(im)}\">`:'<div class=\"itemimg\"></div>'}</div><div><b>${esc(i.product_name||'Unnamed item')}</b>${addon?'<span class=\"pill\">Add-on</span>':''}<div><span class=\"pill\">qty: ${qty}</span>${opts(i).map(x=>`<span class=\"pill\">${esc(x)}</span>`).join('')}</div>${url?`<a href=\"${esc(url)}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:7px;color:#116dff;text-decoration:none;font-size:12px;font-weight:700\">View product ↗</a>`:''}</div><div style=\"text-align:right\"><div>${money(unit,o.currency)} each</div><div class=\"mut\">qty ${qty}</div><b>${money(unit*qty,o.currency)}</b></div></div>`}"""
          new="""function itemCard(i,o,addon=false,displayQty=null){const im=media(i),qty=displayQty==null?Number(i.quantity||1):Number(displayQty),unit=Number(i.unit_price||0),url=productUrl(i);return`<div class=\"orderitem\"><div>${im?`<img class=\"itemimg\" src=\"${esc(im)}\">`:'<div class=\"itemimg\"></div>'}</div><div><b>${esc(i.product_name||'Unnamed item')}</b>${addon?'<span class=\"pill\">Add-on</span>':''}<div><span class=\"pill\">qty: ${qty}</span>${opts(i).map(x=>`<span class=\"pill\">${esc(x)}</span>`).join('')}</div>${url?`<a href=\"${esc(url)}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:7px;color:#116dff;text-decoration:none;font-size:12px;font-weight:700\">View product ↗</a>`:''}</div><div style=\"text-align:right\"><div>${money(unit,o.currency)} each</div><div class=\"mut\">qty ${qty}</div><b>${money(unit*qty,o.currency)}</b></div></div>`}function boardUnitView(o,c,focus){const arr=c.logical,globalIndex=Math.max(0,arr.findIndex(x=>x.u.id===focus.u.id)),sameMain=arr.filter(x=>x.i.id===focus.i.id),localIndex=Math.max(0,sameMain.findIndex(x=>x.u.id===focus.u.id)),code=arr.length>1?`#${o.order_number}-${globalIndex+1}`:`#${o.order_number}`,mainQty=Math.max(1,Number(focus.i.quantity||sameMain.length||1));const addons=c.addons.filter(Boolean).map(a=>{const aq=Math.max(1,Number(a.quantity||1));let qty=0;if(aq===mainQty)qty=1;else if(mainQty===1)qty=aq;else if(aq>0&&aq%mainQty===0)qty=aq/mainQty;return{item:a,qty}}).filter(x=>x.qty>0);const unitTotal=Number(focus.i.unit_price||0)+addons.reduce((s,x)=>s+Number(x.item.unit_price||0)*x.qty,0);return{code,globalIndex,localIndex,mainQty,addons,unitTotal}}"""
          if old not in src:
              raise SystemExit('itemCard anchor not found')
          src=src.replace(old,new)
          old2="""function openOrder(id,unitId){const o=O.find(x=>x.id===id);if(!o)return;const c=classify(o),focus=unitId?c.logical.find(x=>x.u.id===unitId):null;$('#dn').textContent='#'+o.order_number;$('#dc').textContent=o.customer_name||'';$('#dco').textContent=o.company||'';$('#headstatus').innerHTML=focus?`<div class=\"headstatus\"><span class=\"mut\">Change status</span><select id=\"drawerStatus\">${S.map(s=>`<option ${s===(focus.u.production_status||'New')?'selected':''}>${s}</option>`).join('')}</select></div>`:'';const addr=o.delivery_address&&typeof o.delivery_address==='object'?[o.delivery_address.addressLine,o.delivery_address.city,o.delivery_address.subdivision,o.delivery_address.postalCode].filter(Boolean).join(', '):'';const ai=A.find(a=>a.order_id===o.id&&a.validation_status!=='Ignored');const overview=`<div class=\"sec\"><div class=\"st\">Overview</div><div class=\"grid3\"><div class=\"box\"><b>Payment</b><br>${pay(o)}</div><div class=\"box\"><b>Fulfilment</b><br>${ful(o)}</div><div class=\"box\"><b>Total</b><br>${money(o.total,o.currency)}</div><div class=\"box\"><b>Date</b><br>${fmtDate(o.wix_created_at)}</div><div class=\"box\"><b>Status</b><br>${c.review?'Needs review':esc(status(o))}</div><div class=\"box\"><b>Items</b><br>${c.review?'—':c.logical.length}</div></div>${addr?`<div class=\"mut\" style=\"margin-top:10px\"><b>Delivery:</b> ${esc(addr)}</div>`:''}${ai?`<div class=\"error\" style=\"margin-top:10px\"><b>Address issue:</b> ${esc(ai.issue_summary||'Check delivery address')}${ai.suggested_address?`<br><span class=\"mut\">Suggested: ${esc(ai.suggested_address)}</span>`:''}</div>`:''}${o.buyer_note?`<div class=\"mut\" style=\"margin-top:10px\"><b>Buyer note:</b> ${esc(o.buyer_note)}</div>`:''}</div>`;if(focus){const add=c.addons.filter(Boolean).map(i=>itemCard(i,o,true)).join('');$('#db').innerHTML=overview+`<div class=\"sec\"><div class=\"st\">Items</div>${itemCard(focus.i,o,false)}${add?`<div class=\"st\" style=\"margin-top:16px\">Add-ons</div>${add}`:''}</div>`}else{$('#db').innerHTML=overview+`<div class=\"sec\"><div class=\"st\">Order composition</div>${items(o).filter(i=>!/^delivery$/i.test(i.product_name||'')).map(i=>itemCard(i,o,isAddon(i.product_name))).join('')}${totals(o)}</div>`}$('#db').insertAdjacentHTML('beforeend',renderActivity(o.id));bindActivity(o.id);if(focus)$('#drawerStatus').onchange=e=>setStatus(focus.u.id,e.target.value);$('#shade').classList.add('on')}"""
          new2="""function openOrder(id,unitId){const o=O.find(x=>x.id===id);if(!o)return;const c=classify(o),focus=unitId?c.logical.find(x=>x.u.id===unitId):null,uv=focus?boardUnitView(o,c,focus):null;$('#dn').textContent=uv?uv.code:'#'+o.order_number;$('#dc').textContent=o.customer_name||'';$('#dco').textContent=o.company||'';$('#headstatus').innerHTML=focus?`<div class=\"headstatus\"><span class=\"mut\">Change status</span><select id=\"drawerStatus\">${S.map(s=>`<option ${s===(focus.u.production_status||'New')?'selected':''}>${s}</option>`).join('')}</select></div>`:'';const addr=o.delivery_address&&typeof o.delivery_address==='object'?[o.delivery_address.addressLine,o.delivery_address.city,o.delivery_address.subdivision,o.delivery_address.postalCode].filter(Boolean).join(', '):'';const ai=A.find(a=>a.order_id===o.id&&a.validation_status!=='Ignored');const overview=`<div class=\"sec\"><div class=\"st\">Overview</div><div class=\"grid3\"><div class=\"box\"><b>Payment</b><br>${pay(o)}</div><div class=\"box\"><b>Fulfilment</b><br>${ful(o)}</div><div class=\"box\"><b>Total</b><br>${money(uv?uv.unitTotal:o.total,o.currency)}</div><div class=\"box\"><b>Date</b><br>${fmtDate(o.wix_created_at)}</div><div class=\"box\"><b>Status</b><br>${focus?esc(focus.u.production_status||'New'):(c.review?'Needs review':esc(status(o)))}</div><div class=\"box\"><b>Items</b><br>${focus?1:(c.review?'—':c.logical.length)}</div></div>${addr?`<div class=\"mut\" style=\"margin-top:10px\"><b>Delivery:</b> ${esc(addr)}</div>`:''}${ai?`<div class=\"error\" style=\"margin-top:10px\"><b>Address issue:</b> ${esc(ai.issue_summary||'Check delivery address')}${ai.suggested_address?`<br><span class=\"mut\">Suggested: ${esc(ai.suggested_address)}</span>`:''}</div>`:''}${o.buyer_note?`<div class=\"mut\" style=\"margin-top:10px\"><b>Buyer note:</b> ${esc(o.buyer_note)}</div>`:''}</div>`;if(focus){const add=uv.addons.map(x=>itemCard(x.item,o,true,x.qty)).join('');$('#db').innerHTML=overview+`<div class=\"sec\"><div class=\"st\">Items</div>${itemCard(focus.i,o,false,1)}${add?`<div class=\"st\" style=\"margin-top:16px\">Add-ons</div>${add}`:''}</div>`}else{$('#db').innerHTML=overview+`<div class=\"sec\"><div class=\"st\">Order composition</div>${items(o).filter(i=>!/^delivery$/i.test(i.product_name||'')).map(i=>itemCard(i,o,isAddon(i.product_name))).join('')}${totals(o)}</div>`}$('#db').insertAdjacentHTML('beforeend',renderActivity(o.id));bindActivity(o.id);if(focus)$('#drawerStatus').onchange=e=>setStatus(focus.u.id,e.target.value);$('#shade').classList.add('on')}"""
          if old2 not in src:
              raise SystemExit('openOrder anchor not found')
          src=src.replace(old2,new2)
          Path('v097').mkdir(exist_ok=True)
          Path('v097/index.html').write_text(src)
          PY
      - name: Commit release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v097/index.html
          git commit -m "Release v0.9.7 unit-level board drawer"
          git push
