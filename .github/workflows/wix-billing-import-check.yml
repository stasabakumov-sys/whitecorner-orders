name: Check Wix billing import
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/wix-billing-import/**'
      - 'supabase/migrations/20260930000500_billing_document_import.sql'
      - 'angular-app/src/app/features/billing/**'
      - '.github/workflows/wix-billing-import-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: angular-app/package-lock.json
      - run: npm ci
        working-directory: angular-app
      - run: node --test supabase/functions/wix-billing-import/billing.test.cjs
      - run: node supabase/functions/wix-billing-import/check.cjs
      - name: Install isolated SQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/billing-db-test" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
      - name: Test migration in a disposable database
        run: BILLING_PGLITE_PATH="$RUNNER_TEMP/billing-db-test/node_modules/@electric-sql/pglite" node --test supabase/functions/wix-billing-import/migration.test.cjs
      - run: npm test -- --watch=false
        working-directory: angular-app
      - run: npm run build
        working-directory: angular-app
      # Deliberately no production migration, deployment or live document import.
