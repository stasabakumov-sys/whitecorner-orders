name: Build Angular2 preview
on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'angular-app/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/delivery-cost-review/**'
      - 'supabase/migrations/*_delivery_cost_review.sql'
      - 'supabase/migrations/*_delivery_production_gate.sql'
      - 'supabase/migrations/*_partner_pans_report.sql'
      - 'supabase/migrations/*_packaging_variant_editor.sql'
      - '.github/scripts/packaging-variant*'
      - '.github/scripts/partner-pans*'
      - '.github/scripts/material-costing*'
      - 'supabase/migrations/*_material_costing.sql'
      - '.github/scripts/delivery-review*'
      - '.github/workflows/build-angular2-preview.yml'
  pull_request:
    paths:
      - 'angular-app/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/delivery-cost-review/**'
      - 'supabase/migrations/*_delivery_cost_review.sql'
      - 'supabase/migrations/*_delivery_production_gate.sql'
      - 'supabase/migrations/*_partner_pans_report.sql'
      - 'supabase/migrations/*_packaging_variant_editor.sql'
      - '.github/scripts/packaging-variant*'
      - '.github/scripts/partner-pans*'
      - '.github/scripts/material-costing*'
      - 'supabase/migrations/*_material_costing.sql'
      - '.github/scripts/delivery-review*'
      - '.github/workflows/build-angular2-preview.yml'
permissions:
  contents: write
concurrency:
  group: angular2-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci
          npm run test:ci
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Test delivery estimate worker with mocks
        run: node --test .github/scripts/delivery-review-worker.test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Type-check delivery review and Wix import
        run: deno check --no-lock supabase/functions/delivery-cost-review/index.ts supabase/functions/wix-orders-sync/index.ts supabase/functions/fast-courier-api/index.ts
      - name: Rehearse delivery migration in isolated PostgreSQL
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/delivery-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/delivery-review-migration.test.mjs "$RUNNER_TEMP/delivery-db/node_modules/@electric-sql/pglite/dist/index.js"
          node .github/scripts/delivery-production-migration.test.mjs "$RUNNER_TEMP/delivery-db/node_modules/@electric-sql/pglite/dist/index.js"
          node .github/scripts/material-costing.test.mjs "$RUNNER_TEMP/delivery-db/node_modules/@electric-sql/pglite/dist/index.js"
          node .github/scripts/partner-pans-migration.test.mjs "$RUNNER_TEMP/delivery-db/node_modules/@electric-sql/pglite/dist/index.js"
          node .github/scripts/packaging-variant-migration.test.mjs "$RUNNER_TEMP/delivery-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Publish clean preview path
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          # Select the Angular application root only. The build also contains
          # browser/finance/index.html; choosing that nested file publishes the
          # standalone Finance page over the entire /angular2/ application.
          OUT=$(find angular-app/dist -type f -path '*/browser/index.html' -printf '%h\n' | head -1)
          test -n "$OUT"
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular2
          git commit -m "Publish Angular2 preview [skip ci]" || exit 0
          git fetch origin main
          git rebase origin/main
          git push
# email-iteration5-build-trigger-20260902
