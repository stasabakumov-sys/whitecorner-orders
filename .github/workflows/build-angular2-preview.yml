name: Build Angular2 preview
on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'angular-app/**'
      - '.github/workflows/build-angular2-preview.yml'
  pull_request:
    paths:
      - 'angular-app/**'
      - '.github/workflows/build-angular2-preview.yml'
permissions:
  contents: write
concurrency:
  group: angular2-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish clean preview path
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          # Select the Angular application root only. The build also contains
          # browser/finance/index.html; choosing that nested file publishes the
          # standalone Finance page over the entire /angular2/ application.
          OUT=$(find angular-app/dist -type f -path '*/browser/index.html' -printf '%h\n' | head -1)
          test -n "$OUT"
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular2
          git commit -m "Publish Angular2 preview [skip ci]" || exit 0
          git fetch origin main
          git rebase origin/main
          git push
