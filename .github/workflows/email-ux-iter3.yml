name: Email UX iteration 3
on:
  push:
    paths:
      - '.github/workflows/email-ux-iter3.yml'
permissions:
  contents: write
jobs:
  improve-reader-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove reader request latency and async selection races
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('angular-app/src/app/core/services/email.service.ts')
          s = service.read_text()

          signal_anchor = "  readonly error = signal('');\n"
          signal_replacement = """  readonly error = signal('');
  private readonly messageLoads = new Map<string, Promise<{ body: string; subject: string; from: string; to: string; date: string; unread?: boolean; starred?: boolean }>>();
"""
          if 'private readonly messageLoads' not in s:
              if signal_anchor not in s:
                  raise SystemExit('email service signal anchor missing')
              s = s.replace(signal_anchor, signal_replacement, 1)

          old_get = """  async getMessage(mailbox: GmailMailboxKey, messageId: string): Promise<{ body: string; subject: string; from: string; to: string; date: string; unread?: boolean; starred?: boolean }> {
    const { data, error } = await this.supabase.client.functions.invoke('gmail-api', { body: { action: 'get', mailbox, messageId } });
    if (error) throw error;
    if (data?.unread) {
      await this.modify(mailbox, messageId, 'markRead');
      return { ...data, unread: false };
    }
    return data;
  }
"""
          new_get = """  getMessage(mailbox: GmailMailboxKey, messageId: string): Promise<{ body: string; subject: string; from: string; to: string; date: string; unread?: boolean; starred?: boolean }> {
    const key = `${mailbox}:${messageId}`;
    const pending = this.messageLoads.get(key);
    if (pending) return pending;
    const request = this.loadMessage(mailbox, messageId).finally(() => this.messageLoads.delete(key));
    this.messageLoads.set(key, request);
    return request;
  }

  private async loadMessage(mailbox: GmailMailboxKey, messageId: string): Promise<{ body: string; subject: string; from: string; to: string; date: string; unread?: boolean; starred?: boolean }> {
    const { data, error } = await this.supabase.client.functions.invoke('gmail-api', { body: { action: 'get', mailbox, messageId } });
    if (error) throw error;
    if (data?.unread) {
      // Opening a message should never wait for a second Gmail round-trip.
      // Mark-as-read is safe to complete in the background; a later refresh reconciles any failure.
      void this.modify(mailbox, messageId, 'markRead').catch(e => console.warn('Gmail markRead failed', e));
      return { ...data, unread: false };
    }
    return data;
  }
"""
          if old_get not in s:
              raise SystemExit('getMessage anchor missing or already changed unexpectedly')
          s = s.replace(old_get, new_get, 1)
          service.write_text(s)

          component = Path('angular-app/src/app/features/email/email.component.ts')
          c = component.read_text()
          old_reader = "this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?current:row));this.selected.set(current);"
          new_reader = "this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?current:row));if(this.selected()?.id===mail.id&&this.selected()?.mailbox===mail.mailbox)this.selected.set(current);"
          if old_reader not in c:
              raise SystemExit('reader selection anchor missing')
          c = c.replace(old_reader, new_reader, 1)

          old_ai = "this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?updated:row));this.selected.set(updated);"
          new_ai = "this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?updated:row));if(this.selected()?.id===mail.id&&this.selected()?.mailbox===mail.mailbox)this.selected.set(updated);"
          if old_ai not in c:
              raise SystemExit('AI selection anchor missing')
          c = c.replace(old_ai, new_ai, 1)
          component.write_text(c)
          PY
      - name: Verify performance invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('angular-app/src/app/core/services/email.service.ts').read_text()
          c=Path('angular-app/src/app/features/email/email.component.ts').read_text()
          assert "await this.modify(mailbox, messageId, 'markRead')" not in s
          assert 'private readonly messageLoads' in s
          assert "void this.modify(mailbox, messageId, 'markRead')" in s
          assert c.count("this.selected()?.id===mail.id&&this.selected()?.mailbox===mail.mailbox") >= 2
          print('Email reader performance checks passed')
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish tested build
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          test -n "$OUT"
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/core/services/email.service.ts angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Speed up Email reader and prevent async selection races"
          git push
