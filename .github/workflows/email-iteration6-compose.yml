name: Email iteration 6 - working compose
on:
  push:
    paths:
      - '.github/workflows/email-iteration6-compose.yml'
permissions:
  contents: write
jobs:
  improve-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Implement real Compose workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('Expected source pattern not found: '+old[:120])
              s=s.replace(old,new,1)

          rep('<p-button label="Compose" icon="pi pi-pencil" styleClass="compose" [disabled]="true"/>',
              '<p-button label="Compose" icon="pi pi-pencil" styleClass="compose" (onClick)="startCompose()"/>')

          anchor='''      @if(selected();as mail){\n        <section class="mail-reader">'''
          compose='''      @if(composeOpen()){\n        <section class="compose-window" aria-label="New message">\n          <div class="compose-head"><b>New message</b><button title="Close" (click)="cancelCompose()">×</button></div>\n          <div class="compose-field"><span>From</span><select [value]="composeMailbox()" (change)="composeMailbox.set($any($event.target).value)"><option value="info">info@whitecorner.com.au</option><option value="support">support@whitecorner.com.au</option></select></div>\n          <div class="compose-field"><span>To</span><input pInputText type="email" autocomplete="off" [value]="composeTo()" (input)="composeTo.set($any($event.target).value)" placeholder="recipient@example.com"/></div>\n          <div class="compose-field subject"><span>Subject</span><input pInputText [value]="composeSubject()" (input)="composeSubject.set($any($event.target).value)" placeholder="Subject"/></div>\n          <textarea [value]="composeText()" (input)="composeText.set($any($event.target).value)" placeholder="Write a message…" [disabled]="composeSending()"></textarea>\n          <div class="compose-actions">\n            @if(composeStatus()){<span [class.send-error]="composeStatus().startsWith('Error')">{{composeStatus()}}</span>}@else{<span>Sent through Gmail</span>}\n            <button class="discard-compose" title="Discard" (click)="cancelCompose()" [disabled]="composeSending()"><i class="pi pi-trash"></i></button>\n            <p-button label="Send" icon="pi pi-send" (onClick)="sendCompose()" [disabled]="composeSending() || !canSendCompose()"/>\n          </div>\n        </section>\n      }\n\n      @if(selected();as mail){\n        <section class="mail-reader">'''
          rep(anchor,compose)

          css_anchor='''  .ai-summary{margin-top:12px;padding:12px 14px;border:1px solid #dce5f2;border-radius:10px;background:#f8fbff}'''
          compose_css='''  .compose-window{position:fixed;z-index:1250;right:24px;bottom:18px;width:min(620px,calc(100vw - 250px));height:min(620px,76vh);display:flex;flex-direction:column;background:#fff;border:1px solid #d0d5dd;border-radius:12px 12px 8px 8px;overflow:hidden;box-shadow:0 14px 42px rgba(16,24,40,.2)}.compose-head{height:42px;flex:0 0 42px;padding:0 13px;display:flex;align-items:center;background:#f2f6fc;color:#344054}.compose-head b{font-size:12px}.compose-head button{margin-left:auto;border:0;background:transparent;color:#667085;font-size:20px;cursor:pointer}.compose-field{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #edf0f3;padding:0 13px}.compose-field span{width:42px;font-size:10px;color:#667085}.compose-field input,.compose-field select{flex:1;min-width:0;height:30px;border:0;background:#fff;box-shadow:none;font:inherit;font-size:11px;color:#344054;outline:none}.compose-field select{cursor:pointer}.compose-field.subject input{font-weight:500}.compose-window>textarea{flex:1;min-height:150px;width:100%;resize:none;border:0;outline:none;padding:15px;font:inherit;font-size:12px;line-height:1.55;box-sizing:border-box}.compose-actions{height:54px;flex:0 0 54px;border-top:1px solid #edf0f3;padding:8px 11px;display:flex;align-items:center;gap:8px}.compose-actions>span{font-size:9px;color:#98a2b3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.compose-actions p-button{margin-left:auto}.discard-compose{width:34px;height:34px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:#667085;cursor:pointer}.discard-compose:hover:not(:disabled){background:#f2f4f7}.discard-compose:disabled{opacity:.45}@media(max-width:880px){.compose-window{left:12px;right:12px;bottom:12px;width:auto;height:min(620px,82vh)}}\n'''+css_anchor
          rep(css_anchor,compose_css)

          signals='''  readonly sendStatus=signal('');\n  readonly messageAction=signal('');'''
          new_signals='''  readonly sendStatus=signal('');\n  readonly composeOpen=signal(false);\n  readonly composeMailbox=signal<'info'|'support'>('info');\n  readonly composeTo=signal('');\n  readonly composeSubject=signal('');\n  readonly composeText=signal('');\n  readonly composeSending=signal(false);\n  readonly composeStatus=signal('');\n  readonly messageAction=signal('');'''
          rep(signals,new_signals)

          method_anchor='''  startReply(mail:MailRow){\n    this.replyMode.set('reply');this.forwardTo.set('');this.sendStatus.set('');this.replyText.set(mail.draft_reply||'');\n  }'''
          methods='''  startCompose(){\n    const box=this.activeMailbox();\n    this.composeMailbox.set(box==='support'?'support':'info');\n    this.composeTo.set('');this.composeSubject.set('');this.composeText.set('');this.composeStatus.set('');this.composeOpen.set(true);\n  }\n  cancelCompose(){\n    if(this.composeSending())return;\n    this.composeOpen.set(false);this.composeTo.set('');this.composeSubject.set('');this.composeText.set('');this.composeStatus.set('');\n  }\n  canSendCompose(){return this.composeTo().trim().includes('@')&&!!this.composeSubject().trim()&&!!this.composeText().trim();}\n  async sendCompose(){\n    if(!this.canSendCompose()||this.composeSending())return;\n    const mailbox=this.composeMailbox();\n    this.composeSending.set(true);this.composeStatus.set('Sending…');\n    try{\n      await this.email.send(mailbox,this.composeTo().trim(),this.composeSubject().trim(),this.composeText());\n      this.composeStatus.set('Sent');\n      this.loadedViews.delete(this.viewKey(mailbox,'Sent'));\n      void this.fetchView(mailbox,'Sent').catch(e=>console.warn('Sent refresh failed',e));\n      setTimeout(()=>{this.composeOpen.set(false);this.composeTo.set('');this.composeSubject.set('');this.composeText.set('');this.composeStatus.set('');},700);\n    }catch(e){this.composeStatus.set(`Error: ${String((e as Error)?.message||e)}`);}\n    finally{this.composeSending.set(false);}\n  }\n  startReply(mail:MailRow){\n    this.replyMode.set('reply');this.forwardTo.set('');this.sendStatus.set('');this.replyText.set(mail.draft_reply||'');\n  }'''
          rep(method_anchor,methods)

          send_anchor='''      await this.email.send(mail.mailbox,to,subject,this.replyText());\n      this.sendStatus.set('Sent');'''
          send_new='''      await this.email.send(mail.mailbox,to,subject,this.replyText());\n      this.loadedViews.delete(this.viewKey(mail.mailbox,'Sent'));\n      void this.fetchView(mail.mailbox,'Sent').catch(e=>console.warn('Sent refresh failed',e));\n      this.sendStatus.set('Sent');'''
          rep(send_anchor,send_new)

          p.write_text(s)
          PY
      - name: Static compose checks
        run: |
          grep -F '(onClick)="startCompose()"' angular-app/src/app/features/email/email.component.ts
          grep -F 'async sendCompose()' angular-app/src/app/features/email/email.component.ts
          grep -F "loadedViews.delete(this.viewKey(mailbox,'Sent'))" angular-app/src/app/features/email/email.component.ts
          ! grep -F 'label="Compose" icon="pi pi-pencil" styleClass="compose" [disabled]="true"' angular-app/src/app/features/email/email.component.ts
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Commit tested source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/email-iteration6-compose.yml
          git add angular-app/src/app/features/email/email.component.ts
          git commit -m "Add real Gmail compose workflow"
          git push
