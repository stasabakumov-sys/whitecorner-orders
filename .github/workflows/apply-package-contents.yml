name: Apply package contents schema

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*_add_package_contents.sql'
      - '.github/workflows/apply-package-contents.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/apply-package-contents.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workflow parser
        working-directory: .github/scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test production change guard
        run: node --test .github/scripts/production-changes.test.mjs
      - name: Detect operational changes
        id: classify
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/production-changes.mjs package "$BEFORE" "$AFTER"
  migrate:
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply idempotent package contents migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: zgvnrpspwluapaxnycrg
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          jq -n --rawfile query supabase/migrations/20260903000200_add_package_contents.sql \
            '{query: $query, read_only: false}' > request.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @request.json
