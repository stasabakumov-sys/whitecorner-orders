name: Contacts and paint usage production release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect production or apply the two reviewed migrations
        type: choice
        options: [verify, apply]
        default: verify
permissions:
  contents: read
concurrency:
  group: contacts-paint-production-release
  cancel-in-progress: false
jobs:
  verify-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse both migrations in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/contacts-paint-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/contacts-paint-migration.test.mjs "$RUNNER_TEMP/contacts-paint-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Verify production prerequisites
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/contacts-paint-release.mjs --verify
      - name: Apply and verify migrations
        if: inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/contacts-paint-release.mjs --apply
