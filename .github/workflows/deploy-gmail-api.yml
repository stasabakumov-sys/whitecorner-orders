name: Deploy Gmail API function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gmail-api/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-gmail-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gmail-api
        run: supabase functions deploy gmail-api --project-ref zgvnrpspwluapaxnycrg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
