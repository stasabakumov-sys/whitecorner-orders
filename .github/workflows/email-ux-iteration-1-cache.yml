name: Email UX iteration 1 cache
on:
  push:
    paths:
      - '.github/workflows/email-ux-iteration-1-cache.yml'
permissions:
  contents: write
jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Email cache and loading behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          old='''  private readerHistoryPushed=false;\n  readonly mailboxInboxCounts=signal<{info:number;support:number}>({info:0,support:0});\n\n  constructor(private readonly email:EmailService,private readonly emailAi:EmailAiService,private readonly orders:OrdersService){void this.refreshMailboxCounts();void this.loadMail();}\n'''
          new='''  private readerHistoryPushed=false;\n  readonly mailboxInboxCounts=signal<{info:number;support:number}>({info:0,support:0});\n  private readonly loadedViews=new Set<string>();\n  private readonly viewLoads=new Map<string,Promise<void>>();\n\n  constructor(private readonly email:EmailService,private readonly emailAi:EmailAiService,private readonly orders:OrdersService){void this.initializeMail();}\n'''
          if old not in s: raise SystemExit('state/constructor anchor missing')
          s=s.replace(old,new,1)

          start=s.index('  setMailbox(box:MailboxId)')
          end=s.index('  private toMailRow(row:GmailMessageRow):MailRow{', start)
          replacement='''  private viewKey(mailbox:'info'|'support',view:'Inbox'|'Sent'){return`${mailbox}:${view}`;}\n  setMailbox(box:MailboxId){if(this.activeMailbox()===box)return;this.activeMailbox.set(box);this.selected.set(null);void this.loadMail();}\n  setView(view:MailView){if(this.activeView()===view)return;this.activeView.set(view);this.selected.set(null);void this.loadMail();}\n  ensureSelection(){queueMicrotask(()=>{const visible=this.visibleRows();if(!visible.some(row=>row.id===this.selected()?.id))this.selected.set(visible[0]??null);});}\n  private async initializeMail(){\n    this.mailLoading.set(true);this.mailError.set('');\n    try{\n      await Promise.all([this.fetchView('info','Inbox'),this.fetchView('support','Inbox')]);\n      this.updateInboxCounts();\n      this.countsReady.set(true);this.mailReady.set(true);\n      void Promise.allSettled([this.fetchView('info','Sent'),this.fetchView('support','Sent')]);\n    }catch(e){this.mailError.set(String((e as Error)?.message||e));this.mailReady.set(true);}\n    finally{this.mailLoading.set(false);}\n  }\n  private fetchView(mailbox:'info'|'support',view:'Inbox'|'Sent'):Promise<void>{\n    const key=this.viewKey(mailbox,view);\n    if(this.loadedViews.has(key))return Promise.resolve();\n    const pending=this.viewLoads.get(key);if(pending)return pending;\n    const request=this.email.list(mailbox,view).then(messages=>{this.absorbBatch(mailbox,view,messages);this.loadedViews.add(key);if(view==='Inbox')this.updateInboxCounts();}).finally(()=>this.viewLoads.delete(key));\n    this.viewLoads.set(key,request);return request;\n  }\n  private absorbBatch(mailbox:'info'|'support',view:'Inbox'|'Sent',messages:GmailMessageRow[]){\n    const current=this.rows();const existing=new Map(current.map(row=>[`${row.mailbox}:${row.id}`,row]));\n    const incoming=messages.map(message=>{const base=this.toMailRow(message);const old=existing.get(`${mailbox}:${message.id}`);return old?{...base,body:old.body,ai_state:old.ai_state,linked_order:old.linked_order,intent:old.intent,needs_reply:old.needs_reply,confidence:old.confidence,draft_reply:old.draft_reply,ai_summary:old.ai_summary,review_reason:old.review_reason}:base;});\n    const status=view==='Sent'?'Sent':'Inbox';\n    const kept=current.filter(row=>!(row.mailbox===mailbox&&row.status===status));\n    this.rows.set([...kept,...incoming].sort((a,b)=>this.dateValue(b.received_at)-this.dateValue(a.received_at)));\n  }\n  private updateInboxCounts(){const rows=this.rows();this.mailboxInboxCounts.set({info:rows.filter(row=>row.mailbox==='info'&&row.status==='Inbox').length,support:rows.filter(row=>row.mailbox==='support'&&row.status==='Inbox').length});}\n  private async loadMail(){\n    const view=this.activeView();\n    if(view==='Needs reply'){this.mailReady.set(true);return;}\n    const box=this.activeMailbox();const keys:('info'|'support')[]=box==='all'?['info','support']:[box];\n    const missing=keys.some(key=>!this.loadedViews.has(this.viewKey(key,view)));\n    if(!missing)return;\n    this.mailLoading.set(true);this.mailError.set('');\n    try{await Promise.all(keys.map(key=>this.fetchView(key,view)));this.mailReady.set(true);if(view==='Inbox')this.countsReady.set(true);}\n    catch(e){this.mailError.set(String((e as Error)?.message||e));}\n    finally{this.mailLoading.set(false);}\n  }\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish Angular2 preview
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          test -n "$OUT"
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Cache Email folders and remove switching flicker" || exit 0
          git push
