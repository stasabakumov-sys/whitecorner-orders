name: Shared Painting production release
on:
  push:
    branches: [codex/shared-painting-all-products]
    paths:
      - 'angular-app/**'
      - '.github/scripts/shared-painting-release.mjs'
      - '.github/scripts/backdrop-shared-costs-migration.test.mjs'
      - '.github/workflows/shared-painting-release.yml'
      - 'supabase/migrations/20260917000200_shared_painting_all_products.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-painting-production-release
  cancel-in-progress: false
jobs:
  verify-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test and build Angular
        working-directory: angular-app
        run: npm ci && npm test -- --watch=false && npm run build
      - name: Verify migration and release wrapper
        run: |
          npm install --prefix "$RUNNER_TEMP/shared-painting-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/backdrop-shared-costs-migration.test.mjs "$RUNNER_TEMP/shared-painting-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Apply owner-approved shared Painting migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/shared-painting-release.mjs --apply
