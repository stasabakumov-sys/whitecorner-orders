name: Backdrop shared costs production release
on:
  push:
    branches: [codex/backdrop-finish-logic]
    paths:
      - '.github/scripts/backdrop-shared-costs-release.mjs'
      - '.github/scripts/backdrop-shared-costs-migration.test.mjs'
      - '.github/workflows/backdrop-shared-costs-release.yml'
      - 'supabase/migrations/20260916000300_backdrop_shared_costs.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backdrop-shared-costs-production-release
  cancel-in-progress: false
jobs:
  verify-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migration in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/backdrop-costs-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/backdrop-shared-costs-migration.test.mjs "$RUNNER_TEMP/backdrop-costs-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Apply owner-approved Backdrop shared costs migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/backdrop-shared-costs-release.mjs --apply
