name: Release reviews storefront backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse review migrations
        run: |
          npm install --prefix "$RUNNER_TEMP/fera-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/fera-reviews-migration.test.mjs "$RUNNER_TEMP/fera-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Check public author privacy rules
        run: node --test supabase/functions/hub-reviews-public/public-fields.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Type-check public reviews function
        run: deno check --no-lock supabase/functions/hub-reviews-public/index.ts
      - name: Apply publication migration with security postflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/fera-publication-release.mjs
      - name: Apply explicit product override migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/fera-product-override-release.mjs
      - name: Apply review cover migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/fera-cover-release.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy read-only reviews function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy hub-reviews-public --project-ref zgvnrpspwluapaxnycrg --no-verify-jwt
