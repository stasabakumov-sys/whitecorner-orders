name: Deploy Wix orders sync

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/wix-orders-sync/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-wix-orders-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy wix-orders-sync
        run: supabase functions deploy wix-orders-sync --project-ref zgvnrpspwluapaxnycrg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
