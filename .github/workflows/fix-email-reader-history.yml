name: Fix Email reader history and layout
on:
  push:
    paths:
      - '.github/workflows/fix-email-reader-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Email reader history and layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()

          s=s.replace("import { Component, computed, signal } from '@angular/core';", "import { Component, HostListener, computed, signal } from '@angular/core';")
          s=s.replace('              <div class="reader-mailbox">{{mailboxAddress(mail.mailbox)}} · {{mail.received_at}}</div>\n','')

          # Add history state flag.
          s=s.replace("  readonly sendStatus=signal('');", "  readonly sendStatus=signal('');\n  private readerHistoryPushed=false;")

          old="""  closeMail(){this.cancelReply();this.selected.set(null);}\n  async openMail(mail:MailRow){\n    this.cancelReply();\n    this.selected.set(mail);\n    if(mail.body)return;\n    try{const full=await this.email.getMessage(mail.mailbox,mail.id);const updated={...mail,body:full.body||mail.preview,received_at:full.date||mail.received_at,time:this.formatMailTime(full.date||mail.received_at)};this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?updated:row));this.selected.set(updated);}\n    catch(e){this.mailError.set(String((e as Error)?.message||e));}\n  }\n"""
          new="""  closeMail(){\n    if(this.readerHistoryPushed){history.back();return;}\n    this.cancelReply();this.selected.set(null);\n  }\n  async openMail(mail:MailRow){\n    if(!this.selected()){\n      history.pushState({wcMailReader:true,id:mail.id,mailbox:mail.mailbox},'',window.location.href);\n      this.readerHistoryPushed=true;\n    }\n    await this.showMail(mail);\n  }\n  private async showMail(mail:MailRow){\n    this.cancelReply();this.selected.set(mail);\n    if(mail.body)return;\n    try{const full=await this.email.getMessage(mail.mailbox,mail.id);const updated={...mail,body:full.body||mail.preview,received_at:full.date||mail.received_at,time:this.formatMailTime(full.date||mail.received_at)};this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?updated:row));this.selected.set(updated);}\n    catch(e){this.mailError.set(String((e as Error)?.message||e));}\n  }\n  @HostListener('window:popstate',['$event'])\n  onBrowserHistory(event:PopStateEvent){\n    const state=event.state as {wcMailReader?:boolean;id?:string;mailbox?:'info'|'support'}|null;\n    if(state?.wcMailReader&&state.id&&state.mailbox){\n      const mail=this.rows().find(row=>row.id===state.id&&row.mailbox===state.mailbox);\n      if(mail){this.readerHistoryPushed=true;void this.showMail(mail);return;}\n    }\n    this.readerHistoryPushed=false;this.cancelReply();this.selected.set(null);\n  }\n"""
          if old not in s: raise SystemExit('reader methods anchor missing')
          s=s.replace(old,new)

          # Compact reader visually: subject/sender/body/actions grouped like Gmail.
          s=s.replace('.reader-content{max-width:980px;margin:0 auto;padding:30px 42px 60px}', '.reader-content{max-width:1120px;margin:0 auto;padding:24px 38px 48px}')
          s=s.replace('.reader-subject h2{font-size:26px;font-weight:500;color:#202124;margin:0}', '.reader-subject h2{font-size:23px;font-weight:500;color:#202124;margin:0}')
          s=s.replace('.reader-mailbox{font-size:11px;color:#98a2b3;margin-top:7px}', '.reader-mailbox{display:none}')
          s=s.replace('.reader-sender{display:flex;align-items:center;gap:12px;margin-top:30px}', '.reader-sender{display:flex;align-items:center;gap:12px;margin-top:22px}')
          s=s.replace('.reader-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65;color:#202124;margin-top:30px;min-height:180px}', '.reader-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65;color:#202124;margin-top:24px;min-height:48px;max-width:920px}')
          s=s.replace('.reader-ai{margin-top:34px;', '.reader-ai{margin-top:26px;')
          s=s.replace('.gmail-actions{display:flex;gap:9px;margin-top:24px;', '.gmail-actions{display:flex;gap:9px;margin-top:20px;')
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Fix Email reader browser history and spacing" || exit 0
          git push
