name: Cart scoped estimates and order size release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect production or apply the Cart scope and historical size migration
        type: choice
        options: [verify, apply]
        default: verify
  pull_request:
    paths:
      - 'supabase/migrations/20261006000800_cart_scoped_estimates_order_size.sql'
      - '.github/scripts/cart-scoped-estimates-order-size.test.mjs'
      - '.github/scripts/cart-scoped-estimates-order-size-release.mjs'
      - '.github/workflows/cart-scoped-estimates-order-size-release.yml'
permissions:
  contents: read
concurrency:
  group: cart-scoped-estimates-order-size-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse migration in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/estimated-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/cart-scoped-estimates-order-size.test.mjs "$RUNNER_TEMP/estimated-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Inspect production prerequisites
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/cart-scoped-estimates-order-size-release.mjs --verify
      - name: Apply and verify Cart scope and order size
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/cart-scoped-estimates-order-size-release.mjs --apply
