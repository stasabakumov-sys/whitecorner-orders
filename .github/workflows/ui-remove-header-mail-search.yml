name: Remove global header and move mail search
on:
  push:
    paths:
      - '.github/workflows/ui-remove-header-mail-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch shell and Email search
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('angular-app/src/app/app.component.ts')
          s=p.read_text()
          s=s.replace('        <header>White Corner Hub <small>Angular 22 preview</small></header>\n','')
          s=s.replace("main{margin-left:205px;height:100vh;overflow:hidden;background:#f4f6f8}header{height:40px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;padding:0 14px;font-size:15px;font-weight:600;position:sticky;top:0;z-index:30}header small{margin-left:auto;color:#98a2b3;font-size:10px}.content{height:calc(100vh - 40px);overflow:auto;padding:12px 16px 24px}","main{margin-left:205px;height:100vh;overflow:hidden;background:#f4f6f8}.content{height:100vh;overflow:auto;padding:12px 16px 24px}")
          p.write_text(s)

          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          old='''<div class="top-actions"><p-button label="Mail" icon="pi pi-envelope" [outlined]="section()!==\'Mail\'" (onClick)="section.set(\'Mail\')"/><p-button label="AI Agent" icon="pi pi-sparkles" [outlined]="section()!==\'AI Agent\'" (onClick)="section.set(\'AI Agent\')"/></div>'''
          new='''<div class="top-actions"><p-button label="Mail" icon="pi pi-envelope" [outlined]="section()!==\'Mail\'" (onClick)="section.set(\'Mail\')"/>@if(section()===\'Mail\'){<div class="top-search"><i class="pi pi-search"></i><input pInputText placeholder="Search mail" [value]="query()" (input)="query.set($any($event.target).value);ensureSelection()"/></div>}<p-button label="AI Agent" icon="pi pi-sparkles" [outlined]="section()!==\'AI Agent\'" (onClick)="section.set(\'AI Agent\')"/></div>'''
          if old not in s: raise SystemExit('top actions anchor not found')
          s=s.replace(old,new)
          s=s.replace('''<div class="list-toolbar"><div class="list-title"><b>{{activeView()}}</b><span>{{activeMailboxLabel()}} · {{visibleRows().length}} messages</span></div><div class="search"><i class="pi pi-search"></i><input pInputText placeholder="Search mail" [value]="query()" (input)="query.set($any($event.target).value);ensureSelection()"/></div></div>''','''<div class="list-toolbar"><div class="list-title"><b>{{activeView()}}</b><span>{{activeMailboxLabel()}} · {{visibleRows().length}} messages</span></div></div>''')
          s=s.replace(".top-actions{margin-left:auto;display:flex;gap:4px}.top-actions ::ng-deep .p-button{padding:.35rem .65rem;font-size:11px}",".top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}.top-actions ::ng-deep .p-button{padding:.35rem .65rem;font-size:11px}.top-search{position:relative;width:min(360px,32vw)}.top-search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:11px;color:#98a2b3;pointer-events:none}.top-search input{width:100%;height:32px;padding-left:31px;border-radius:18px;font-size:11px;background:#f7f8fa}")
          s=s.replace('.mail-reader{position:fixed;z-index:1200;top:40px;left:205px;','.mail-reader{position:fixed;z-index:1200;top:0;left:205px;')
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/app.component.ts angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Remove global header and move mail search" || exit 0
          git push
