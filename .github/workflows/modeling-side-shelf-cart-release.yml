name: Modeling side shelf cart release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect production or register the private MDF charcuterie cart
        type: choice
        options: [verify, apply]
        default: verify
permissions:
  contents: read
concurrency:
  group: modeling-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect prerequisites and apply reviewed side shelf cart migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/modeling-side-shelf-cart-release.mjs --${{ inputs.mode }}
