name: Manual Fast Courier fulfilment release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify, apply the reviewed migration, or complete order 10821 in Hub
        type: choice
        options: [verify, apply, complete-10821]
        default: verify
permissions:
  contents: read
concurrency:
  group: manual-fast-courier-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse migration and local completion
        run: |
          npm install --prefix "$RUNNER_TEMP/manual-fast-courier-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/manual-fast-courier-migration.test.mjs "$RUNNER_TEMP/manual-fast-courier-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Inspect or apply reviewed Hub change
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/manual-fast-courier-release.mjs --${{ inputs.mode }}
