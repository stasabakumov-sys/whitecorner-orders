name: Fix Email definite scroll height
on:
  push:
    paths:
      - '.github/workflows/fix-email-scroll-definite-height.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix Email scroll containers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          s=s.replace('.mail-app{flex:1;min-height:0;height:auto;display:grid;grid-template-columns:176px minmax(0,1fr);', '.mail-app{flex:1;min-height:0;height:100%;max-height:100%;display:grid;grid-template-columns:176px minmax(0,1fr);grid-template-rows:minmax(0,1fr);')
          s=s.replace('.message-list{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;', '.message-list{min-width:0;min-height:0;height:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden;')
          s=s.replace('.mail-list-scroll{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;', '.mail-list-scroll{overflow-y:auto!important;overflow-x:hidden;min-height:0;height:0;flex:1 1 auto;')
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Fix Email message list scrolling" || exit 0
          git push
