name: Packing completion confirmation release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/20260930000300_packing_completion_confirmation.sql'
      - '.github/scripts/packing.test.mjs'
      - '.github/scripts/packing-completion-confirmation-release.mjs'
      - '.github/workflows/packing-completion-confirmation-release.yml'
permissions:
  contents: read
concurrency:
  group: packing-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse completion confirmation in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/packing-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/packing.test.mjs "$RUNNER_TEMP/packing-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Apply and verify completion confirmation migration
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/packing-completion-confirmation-release.mjs
