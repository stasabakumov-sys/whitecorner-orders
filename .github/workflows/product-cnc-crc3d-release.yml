name: CNC CRC3D production release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify current CNC file format, or apply the migration
        type: choice
        options: [verify, apply]
        default: verify
permissions:
  contents: read
concurrency:
  group: cnc-crc3d-release
  cancel-in-progress: false
jobs:
  verify-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rehearse CNC migrations in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/cnc-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/product-cnc-sheets-migration.test.mjs "$RUNNER_TEMP/cnc-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Read-only production schema check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/product-cnc-crc3d-release.mjs --verify
      - name: Apply owner-approved CRC3D migration
        if: inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/product-cnc-crc3d-release.mjs --apply
