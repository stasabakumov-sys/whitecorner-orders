name: Enable Email AI v1
on:
  push:
    paths:
      - '.github/workflows/enable-email-ai-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire Email AI into reader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          s=s.replace("import { EmailService, GmailMessageRow } from '../../core/services/email.service';", "import { EmailService, GmailMessageRow } from '../../core/services/email.service';\nimport { EmailAiService } from '../../core/services/email-ai.service';\nimport { OrdersService } from '../../core/services/orders.service';")
          s=s.replace("draft_reply?:string|null;}", "draft_reply?:string|null;ai_summary?:string|null;review_reason?:string|null;}")
          s=s.replace("              <div class=\"reader-ai\">", "              <div class=\"reader-ai\">")
          anchor='''              </div>\n              @if(replyMode()==='none'){'''
          replacement='''              </div>\n              @if(mail.ai_summary){<div class="ai-summary"><div><i class="pi pi-sparkles"></i><b>AI Summary</b></div><p>{{mail.ai_summary}}</p>@if(mail.review_reason){<span><i class="pi pi-exclamation-triangle"></i>{{mail.review_reason}}</span>}</div>}\n              @if(replyMode()==='none'){'''
          if anchor not in s: raise SystemExit('AI summary anchor missing')
          s=s.replace(anchor,replacement,1)
          s=s.replace("  constructor(private readonly email:EmailService){void this.refreshMailboxCounts();void this.loadMail();}", "  constructor(private readonly email:EmailService,private readonly emailAi:EmailAiService,private readonly orders:OrdersService){void this.refreshMailboxCounts();void this.loadMail();}")
          old="""  private async showMail(mail:MailRow){\n    this.cancelReply();this.selected.set(mail);\n    if(mail.body)return;\n    try{const full=await this.email.getMessage(mail.mailbox,mail.id);const updated={...mail,body:full.body||mail.preview,received_at:full.date||mail.received_at,time:this.formatMailTime(full.date||mail.received_at),unread:full.unread??false,starred:full.starred??mail.starred};this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?updated:row));this.selected.set(updated);}\n    catch(e){this.mailError.set(String((e as Error)?.message||e));}\n  }\n"""
          new="""  private async showMail(mail:MailRow){\n    this.cancelReply();this.selected.set(mail);\n    let current=mail;\n    try{\n      if(!mail.body){const full=await this.email.getMessage(mail.mailbox,mail.id);current={...mail,body:full.body||mail.preview,received_at:full.date||mail.received_at,time:this.formatMailTime(full.date||mail.received_at),unread:full.unread??false,starred:full.starred??mail.starred};this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?current:row));this.selected.set(current);}\n      if(current.status==='Inbox'&&current.ai_state==='Not analysed')void this.analyseMail(current);\n    }catch(e){this.mailError.set(String((e as Error)?.message||e));}\n  }\n  private async analyseMail(mail:MailRow){\n    try{\n      const candidates=this.orderCandidates(mail);\n      const result=await this.emailAi.analyse({mailbox:mail.mailbox,correspondent:mail.correspondent,email:mail.email,subject:mail.subject,body:mail.body||mail.preview},candidates);\n      const state:AiState=result.review_required?'Review':(result.needs_reply?'Draft ready':'Auto handled');\n      const updated:MailRow={...mail,ai_state:state,intent:result.intent as MailIntent,linked_order:result.linked_order,confidence:result.confidence,needs_reply:result.needs_reply,draft_reply:result.draft_reply,ai_summary:result.summary,review_reason:result.review_reason||null};\n      this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?updated:row));this.selected.set(updated);\n    }catch(e){console.warn('Email AI analysis failed',e);}\n  }\n  private orderCandidates(mail:MailRow){\n    const email=mail.email.toLowerCase();const name=mail.correspondent.toLowerCase();const subject=(mail.subject+' '+mail.body+' '+mail.preview).toLowerCase();\n    return this.orders.orders().map(order=>{let score=0;if((order.buyer_email||'').toLowerCase()===email)score+=100;if(name&&((order.customer_name||'').toLowerCase().includes(name)||name.includes((order.customer_name||'').toLowerCase())))score+=20;if(subject.includes(String(order.order_number).toLowerCase()))score+=200;return{score,order};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8).map(({order})=>({order_number:order.order_number,customer_name:order.customer_name,buyer_email:order.buyer_email,payment_status:order.payment_status,fulfillment_status:order.fulfillment_status,delivery_type:order.delivery_type,delivery_title:order.delivery_title,buyer_note:order.buyer_note,total:order.total,items:(order.wc_order_items||[]).map(item=>({product_name:item.product_name,quantity:item.quantity,options:item.wix_options,production:(item.wc_production_units||[]).map(unit=>unit.production_status)}))}));\n  }\n"""
          if old not in s: raise SystemExit('showMail anchor missing')
          s=s.replace(old,new)
          s=s.replace("    this.replyMode.set('reply');this.forwardTo.set('');this.sendStatus.set('');this.replyText.set('');", "    this.replyMode.set('reply');this.forwardTo.set('');this.sendStatus.set('');this.replyText.set(mail.draft_reply||'');")
          marker='.gmail-actions{display:flex;gap:9px;margin-top:20px;'
          css='.ai-summary{margin-top:12px;padding:12px 14px;border:1px solid #dce5f2;border-radius:10px;background:#f8fbff}.ai-summary>div{display:flex;align-items:center;gap:7px;color:#344054}.ai-summary>div i{color:#175cd3}.ai-summary b{font-size:11px}.ai-summary p{margin:7px 0 0;font-size:11px;line-height:1.45;color:#475467}.ai-summary span{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10px;color:#b54708}'
          if marker not in s: raise SystemExit('css anchor missing')
          s=s.replace(marker,css+marker)
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Enable AI email analysis and draft replies" || exit 0
          git push
