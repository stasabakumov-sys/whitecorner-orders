name: Cart product cost production release

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: cart-product-cost-production-release
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply owner-approved Cart product cost migration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: zgvnrpspwluapaxnycrg
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          check_sql="select to_regprocedure('public.wc_save_cart_material_profile(uuid,text,text,jsonb,boolean,timestamp with time zone)') is not null as installed"
          jq -n --arg query "$check_sql" '{query: $query, read_only: true}' > check.json
          check_response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @check.json)
          if jq -e '.[0].installed == true' <<< "$check_response" > /dev/null; then
            echo 'Cart product cost migration is already installed.'
          else
            jq -n --rawfile query supabase/migrations/20260916000500_cart_product_material_profiles.sql \
              '{query: $query, read_only: false}' > migration.json
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary @migration.json
          fi
          postflight=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @check.json)
          jq -e '.[0].installed == true' <<< "$postflight" > /dev/null
