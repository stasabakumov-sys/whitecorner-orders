name: Historical Backdrop order size release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify or apply the confirmed 190cm x 100cm size to order 10846
        type: choice
        options: [verify, apply]
        default: verify
  pull_request:
    paths:
      - '.github/scripts/historical-backdrop-size*'
      - '.github/workflows/historical-backdrop-size-release.yml'
permissions:
  contents: read
concurrency:
  group: historical-backdrop-size-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse exact update and guards
        run: |
          npm install --prefix "$RUNNER_TEMP/order-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/historical-backdrop-size.test.mjs "$RUNNER_TEMP/order-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Inspect production target
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/historical-backdrop-size-release.mjs --verify
      - name: Apply and verify order size
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/historical-backdrop-size-release.mjs --apply
