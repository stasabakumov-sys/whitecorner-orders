name: Finalize Email fullscreen reader
on:
  push:
    paths:
      - '.github/workflows/patch-email-fullscreen.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix fullscreen reader layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          s=s.replace('      }\n      </div>\n    } @else {','      }\n    } @else {',1)
          s=s.replace('grid-template-columns:176px minmax(420px,1fr) 320px;','grid-template-columns:176px minmax(0,1fr);')
          s=s.replace('.reading-placeholder{min-width:0;background:#fff;border-left:1px solid #e4e7ec}', '.reading-placeholder{display:none}')
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish source and preview
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Finalize fullscreen Gmail-style email reader" || exit 0
          git push
