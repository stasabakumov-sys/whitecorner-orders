name: Backdrop Paint option production release
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: backdrop-paint-option-production-release
  cancel-in-progress: false
jobs:
  verify-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migration in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/backdrop-paint-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/backdrop-shared-costs-migration.test.mjs "$RUNNER_TEMP/backdrop-paint-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Apply owner-approved Paint option migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/backdrop-paint-option-release.mjs --apply
