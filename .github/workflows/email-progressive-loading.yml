name: Email progressive loading iteration
on:
  push:
    paths:
      - '.github/workflows/email-progressive-loading.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Improve progressive mail loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()

          old='''          <div class="list-toolbar"><div class="list-title"><b>{{activeView()}}</b><span>@if(mailReady()){{{activeMailboxLabel()}} · {{visibleRows().length}} messages}@else{Loading mail…}</span></div></div>'''
          new='''          <div class="list-toolbar"><div class="list-title"><b>{{activeView()}}</b><span>@if(mailReady()){{{activeMailboxLabel()}} · {{visibleRows().length}} messages@if(mailLoading()){ · Loading more…}}@else{Loading mail…}</span></div></div>'''
          if old not in s: raise SystemExit('toolbar anchor missing')
          s=s.replace(old,new,1)

          old='''              @for(mail of visibleRows();track mail.id){<button class="mail-card" [class.selected]="selected()?.id===mail.id" [class.unread]="mail.unread" (click)="openMail(mail)"><div class="avatar">{{mail.initials}}</div><div class="mail-copy"><div class="mail-from"><b>{{mail.correspondent}}</b><span>{{mail.time}}</span></div><div class="mail-subject">{{mail.subject}}</div><div class="mail-preview">{{mail.preview}}</div><div class="mail-meta"><span class="account-chip">{{mailboxShort(mail.mailbox)}}</span>@if(mail.linked_order){<span class="order-chip">#{{mail.linked_order}}</span>}@if(mail.needs_reply){<span class="reply-chip">Needs reply</span>}</div></div></button>} @empty {<div class="empty-list"><i class="pi pi-inbox"></i><b>No messages in this view</b><span>Choose another mailbox or folder.</span></div>}'''
          new='''              @for(mail of visibleRows();track mail.id){<button class="mail-card" [class.selected]="selected()?.id===mail.id" [class.unread]="mail.unread" (click)="openMail(mail)"><div class="avatar">{{mail.initials}}</div><div class="mail-copy"><div class="mail-from"><b>{{mail.correspondent}}</b><span>{{mail.time}}</span></div><div class="mail-subject">{{mail.subject}}</div><div class="mail-preview">{{mail.preview}}</div><div class="mail-meta"><span class="account-chip">{{mailboxShort(mail.mailbox)}}</span>@if(mail.linked_order){<span class="order-chip">#{{mail.linked_order}}</span>}@if(mail.needs_reply){<span class="reply-chip">Needs reply</span>}</div></div></button>} @empty {@if(mailLoading()){<div class="mail-loading compact"><i class="pi pi-spin pi-spinner"></i><span>Loading messages…</span></div>}@else{<div class="empty-list"><i class="pi pi-inbox"></i><b>No messages in this view</b><span>Choose another mailbox or folder.</span></div>}}'''
          if old not in s: raise SystemExit('empty state anchor missing')
          s=s.replace(old,new,1)

          old="""    const request=this.email.list(mailbox,view).then(messages=>{this.absorbBatch(mailbox,view,messages);this.loadedViews.add(key);if(view==='Inbox')this.updateInboxCounts();}).finally(()=>this.viewLoads.delete(key));"""
          new="""    const request=this.email.list(mailbox,view).then(messages=>{this.absorbBatch(mailbox,view,messages);this.loadedViews.add(key);if(!this.mailReady())this.mailReady.set(true);if(view==='Inbox')this.updateInboxCounts();}).finally(()=>this.viewLoads.delete(key));"""
          if old not in s: raise SystemExit('fetchView anchor missing')
          s=s.replace(old,new,1)

          old='.mail-loading{height:100%;min-height:220px;display:flex;align-items:center;justify-content:center;gap:8px;color:#98a2b3;font-size:11px}.mail-loading i{font-size:14px}'
          new='.mail-loading{height:100%;min-height:220px;display:flex;align-items:center;justify-content:center;gap:8px;color:#98a2b3;font-size:11px}.mail-loading.compact{height:auto;min-height:120px}.mail-loading i{font-size:14px}'
          if old not in s: raise SystemExit('loading css anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish and commit source
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Stream Email inbox results as they arrive" || exit 0
          git push
