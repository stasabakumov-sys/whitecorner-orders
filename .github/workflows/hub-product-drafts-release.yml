name: Hub product drafts release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect production or apply only the product drafts migration
        type: choice
        options: [verify, apply]
        default: verify
permissions:
  contents: read
concurrency:
  group: hub-product-drafts-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production prerequisites
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/hub-product-drafts-release.mjs --verify
      - name: Apply and verify product draft migration
        if: inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/hub-product-drafts-release.mjs --apply
