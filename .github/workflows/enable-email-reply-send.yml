name: Enable Email reply send
on:
  push:
    paths:
      - '.github/workflows/enable-email-reply-send.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch reply and send UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()

          s=s.replace('''            <button class="reader-icon" title="Reply"><i class="pi pi-reply"></i></button>\n            <button class="reader-icon" title="More"><i class="pi pi-ellipsis-v"></i></button>''','''            <button class="reader-icon" title="Reply" (click)="startReply(mail)"><i class="pi pi-reply"></i></button>\n            <button class="reader-icon" title="Forward" (click)="startForward(mail)"><i class="pi pi-forward"></i></button>''')

          old='''              <div class="reader-reply">\n                <div class="reply-label"><i class="pi pi-reply"></i><b>Reply</b><span>from {{mailboxAddress(mail.mailbox)}}</span></div>\n                <textarea [value]="mail.draft_reply||''" placeholder="Reply…" disabled></textarea>\n                <div class="reply-actions"><span>Reply/send will be enabled after live mail verification.</span><p-button label="Send" icon="pi pi-send" [disabled]="true"/></div>\n              </div>'''
          new='''              @if(replyMode()==='none'){\n                <div class="gmail-actions">\n                  <button (click)="startReply(mail)"><i class="pi pi-reply"></i><span>Reply</span></button>\n                  <button class="disabled-action" disabled title="Requires Gmail modify / thread metadata"><i class="pi pi-reply"></i><span>Reply all</span></button>\n                  <button (click)="startForward(mail)"><i class="pi pi-forward"></i><span>Forward</span></button>\n                </div>\n              } @else {\n                <div class="reader-reply active">\n                  <div class="reply-label"><i [class]="replyMode()==='forward'?'pi pi-forward':'pi pi-reply'"></i><b>{{replyMode()==='forward'?'Forward':'Reply'}}</b><span>from {{mailboxAddress(mail.mailbox)}}</span><button class="close-compose" (click)="cancelReply()">×</button></div>\n                  @if(replyMode()==='forward'){<div class="forward-to"><span>To</span><input pInputText [value]="forwardTo()" (input)="forwardTo.set($any($event.target).value)" placeholder="recipient@example.com"/></div>}\n                  <textarea [value]="replyText()" (input)="replyText.set($any($event.target).value)" [placeholder]="replyMode()==='forward'?'Add a message…':'Write a reply…'" [disabled]="sending()"></textarea>\n                  <div class="reply-actions">\n                    @if(sendStatus()){<span [class.send-error]="sendStatus().startsWith('Error')">{{sendStatus()}}</span>} @else {<span>{{replyMode()==='forward'?'Forward this message':'Reply to '+mail.email}}</span>}\n                    <p-button label="Send" icon="pi pi-send" (onClick)="sendCurrent(mail)" [disabled]="sending() || !canSend(mail)"/>\n                  </div>\n                </div>\n              }'''
          if old not in s: raise SystemExit('reply block anchor missing')
          s=s.replace(old,new)

          marker='  .agent-page{background:#fff;'
          css='''  .gmail-actions{display:flex;gap:9px;margin-top:24px;flex-wrap:wrap}.gmail-actions button{display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:1px solid #c9cdd3;border-radius:19px;background:#fff;color:#3c4043;font:inherit;font-size:12px;cursor:pointer}.gmail-actions button:hover:not(:disabled){background:#f7f8fa}.gmail-actions .disabled-action{opacity:.45;cursor:not-allowed}.reader-reply.active{margin-top:22px}.reader-reply.active textarea{display:block;width:100%;min-height:150px;border:0;resize:vertical;padding:14px;font:inherit;font-size:12px;outline:none;box-sizing:border-box}.close-compose{margin-left:auto;border:0;background:transparent;font-size:18px;line-height:1;color:#667085;cursor:pointer}.forward-to{display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf0f3;padding:8px 12px}.forward-to span{font-size:10px;color:#667085}.forward-to input{flex:1;height:30px;font-size:11px;border:0;box-shadow:none}.send-error{color:#b42318!important}\n'''
          if marker not in s: raise SystemExit('css marker missing')
          s=s.replace(marker,css+marker)

          s=s.replace("  readonly mailError=signal('');", "  readonly mailError=signal('');\n  readonly replyMode=signal<'none'|'reply'|'forward'>('none');\n  readonly replyText=signal('');\n  readonly forwardTo=signal('');\n  readonly sending=signal(false);\n  readonly sendStatus=signal('');")
          s=s.replace("  closeMail(){this.selected.set(null);}", "  closeMail(){this.cancelReply();this.selected.set(null);}")
          s=s.replace("  async openMail(mail:MailRow){\n    this.selected.set(mail);", "  async openMail(mail:MailRow){\n    this.cancelReply();\n    this.selected.set(mail);")

          anchor='  private dateValue(value:string)'
          methods='''  startReply(mail:MailRow){\n    this.replyMode.set('reply');this.forwardTo.set('');this.sendStatus.set('');this.replyText.set('');\n  }\n  startForward(mail:MailRow){\n    this.replyMode.set('forward');this.forwardTo.set('');this.sendStatus.set('');\n    const body=mail.body||mail.preview||'';\n    this.replyText.set(`\\n\\n---------- Forwarded message ----------\\nFrom: ${mail.correspondent} <${mail.email}>\\nDate: ${mail.received_at}\\nSubject: ${mail.subject}\\n\\n${body}`);\n  }\n  cancelReply(){this.replyMode.set('none');this.replyText.set('');this.forwardTo.set('');this.sendStatus.set('');this.sending.set(false);}\n  canSend(mail:MailRow){const text=this.replyText().trim();if(!text)return false;return this.replyMode()==='forward'?this.forwardTo().trim().includes('@'):!!mail.email;}\n  async sendCurrent(mail:MailRow){\n    if(!this.canSend(mail)||this.sending())return;\n    this.sending.set(true);this.sendStatus.set('Sending…');\n    try{\n      const forward=this.replyMode()==='forward';\n      const to=forward?this.forwardTo().trim():mail.email;\n      const subject=forward?(mail.subject.toLowerCase().startsWith('fwd:')?mail.subject:`Fwd: ${mail.subject}`):(mail.subject.toLowerCase().startsWith('re:')?mail.subject:`Re: ${mail.subject}`);\n      await this.email.send(mail.mailbox,to,subject,this.replyText());\n      this.sendStatus.set('Sent');\n      this.replyText.set('');this.forwardTo.set('');\n      setTimeout(()=>{this.replyMode.set('none');this.sendStatus.set('');},900);\n    }catch(e){this.sendStatus.set(`Error: ${String((e as Error)?.message||e)}`);}\n    finally{this.sending.set(false);}\n  }\n'''
          if anchor not in s: raise SystemExit('method anchor missing')
          s=s.replace(anchor,methods+anchor)
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Enable Gmail reply forward and send" || exit 0
          git push
# retry after component style budget increase
