name: Sync Gmail read state UI
on:
  push:
    paths:
      - '.github/workflows/sync-read-state-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync read state in Email UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          old="try{const full=await this.email.getMessage(mail.mailbox,mail.id);const updated={...mail,body:full.body||mail.preview,received_at:full.date||mail.received_at,time:this.formatMailTime(full.date||mail.received_at)};this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?updated:row));this.selected.set(updated);}"
          new="try{const full=await this.email.getMessage(mail.mailbox,mail.id);const updated={...mail,body:full.body||mail.preview,received_at:full.date||mail.received_at,time:this.formatMailTime(full.date||mail.received_at),unread:full.unread??false,starred:full.starred??mail.starred};this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?updated:row));this.selected.set(updated);}"
          if old not in s: raise SystemExit('showMail anchor missing')
          s=s.replace("unread?:boolean;ai_state?:AiState;","unread?:boolean;starred?:boolean;ai_state?:AiState;")
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Sync Gmail read state immediately in Email UI" || exit 0
          git push
