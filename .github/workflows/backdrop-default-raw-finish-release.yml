name: Backdrop default RAW finish release
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: backdrop-default-raw-finish-production-release
  cancel-in-progress: false
jobs:
  verify-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migration in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/backdrop-finish-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/shop-floor-cnc-auto-snapshot.test.mjs "$RUNNER_TEMP/backdrop-finish-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Apply owner-approved Backdrop finish migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/backdrop-default-raw-finish-release.mjs --apply
