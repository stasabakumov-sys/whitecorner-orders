name: Build v0.9.3 standalone
on:
  push:
    paths:
      - '.github/workflows/build-v093.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone v0.9.3
        shell: python
        run: |
          from pathlib import Path
          src = Path('v092/index.html').read_text()
          s = src.replace('White Corner Orders v0.9.2','White Corner Orders v0.9.3').replace('v0.9.2 Standalone','v0.9.3 Standalone')

          old_css = '.activityevent{position:relative;margin-left:10px;padding:4px 82px 14px 28px;min-height:36px}.activityevent:after{content:"";position:absolute;left:-1px;top:-8px;bottom:-4px;width:1px;background:#d7dce5;z-index:0}.activityevent:before{content:"";position:absolute;left:-4px;top:9px;width:7px;height:7px;border-radius:50%;background:#68758a;box-shadow:0 0 0 3px #fff;z-index:2}.activityevent.note:before{width:24px;height:24px;left:-13px;top:2px;background:#aab2c1;box-shadow:0 0 0 3px #fff}'
          new_css = '.activityevent{position:relative;margin-left:10px;padding:4px 82px 18px 28px;min-height:38px}.activityevent:before{content:"";position:absolute;left:-4px;top:8px;width:7px;height:7px;border-radius:50%;background:#68758a;z-index:2}.activityevent:after{content:"";position:absolute;left:-1px;top:15px;bottom:0;width:1px;background:#9aa5b5;z-index:0}.activityevent:last-child:after{display:none}.activityevent.note:before{width:24px;height:24px;left:-13px;top:1px;background:#aab2c1;border:2px solid #fff}.activityevent.note:after{top:25px}'
          if old_css not in s:
              raise SystemExit('timeline css anchor not found')
          s = s.replace(old_css,new_css,1)

          start = s.find('function wixActivityEvents(orderId){')
          end = s.find('function renderActivity(orderId){', start)
          if start < 0 or end < 0:
              raise SystemExit('wix activity parser anchor not found')
          parser = r'''function wixActivityEvents(orderId){const o=O.find(x=>x.id===orderId);if(!o)return[];const out=[];let raw=o.activities;try{if(typeof raw==='string')raw=JSON.parse(raw)}catch{}let arr=[];if(Array.isArray(raw))arr=raw;else if(Array.isArray(raw?.items))arr=raw.items;else if(Array.isArray(raw?.activities))arr=raw.activities;const typeMessage=(type,x)=>{const t=String(type||'').toUpperCase();if(t==='ORDER_PLACED'||t==='PLACED')return`${o.customer_name||'Customer'} placed an order`;if(t==='ORDER_PAID'||t==='PAID'||t==='PAYMENT_RECEIVED')return'Order marked as Paid';if(t==='ORDER_CANCELED'||t==='ORDER_CANCELLED')return'Order canceled';if(t==='ORDER_FULFILLED')return'Order fulfilled';if(t.includes('RECEIPT')&&t.includes('CREATED')){const n=x?.receiptNumber||x?.receipt?.number||x?.entityNumber||x?.number;return n?`Receipt #${n} created`:'Receipt created'}if(t.includes('RECEIPT')&&t.includes('SENT')){const n=x?.receiptNumber||x?.receipt?.number||x?.entityNumber||x?.number;return n?`Receipt #${n} sent to customer`:'Receipt sent to customer'}if((t.includes('INVOICE')||t.includes('RECEIPT'))&&t.includes('CREATED'))return'Invoice / receipt created';return''};for(const x of arr){if(!x||typeof x!=='object')continue;const created=x.created_at||x.createdAt||x.dateCreated||x.createdDate||x.timestamp||x.date||x.time;const type=x.type||x.activityType||x.eventType||x.kind||x.name;let msg=[x.message,x.description,x.title,x.text,x.summary,x.activity].find(v=>typeof v==='string'&&v.trim());if(!msg)msg=typeMessage(type,x);if(!created||!msg)continue;out.push({activity_type:'wix',created_at:created,message:String(msg).trim(),created_by:'Wix',wix_type:type||''})}const hasPlaced=out.some(a=>/placed an order/i.test(a.message)||String(a.wix_type||'').toUpperCase()==='ORDER_PLACED');if(!hasPlaced&&o.wix_created_at)out.push({activity_type:'wix',created_at:o.wix_created_at,message:`${o.customer_name||'Customer'} placed an order`,created_by:'Wix',wix_type:'ORDER_PLACED_FALLBACK'});const seen=new Set;return out.filter(a=>{const k=String(a.created_at)+'|'+a.message;if(seen.has(k))return false;seen.add(k);return true})}'''
          s = s[:start] + parser + s[end:]

          Path('v093').mkdir(exist_ok=True)
          Path('v093/index.html').write_text(s)
      - name: Commit v0.9.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v093/index.html
          git commit -m "Release v0.9.3 standalone" || exit 0
          git push
