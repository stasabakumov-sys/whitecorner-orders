name: Fix Email layout and scroll
on:
  push:
    paths:
      - '.github/workflows/fix-email-layout-scroll.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Email viewport and mailbox counts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # App shell: compact fixed top area on Email page
          p=Path('angular-app/src/app/app.component.ts')
          s=p.read_text()
          s=s.replace('<div class="content">', '<div class="content" [class.email-content]="router.url.startsWith(\'/email\')">')
          s=s.replace('<div class="gmail-title"><span class="gmail-dot" [class.ok]="email.connectedCount()===2"></span><div><b>Gmail connection</b><small>{{email.connectedCount()}} of 2 mailboxes connected</small></div></div>', '<div class="gmail-title"><span class="gmail-dot" [class.ok]="email.connectedCount()===2"></span><b>Gmail</b><small>{{email.connectedCount()}}/2</small></div>')
          s=s.replace('main{margin-left:205px;min-height:100vh;background:#f4f6f8}header{height:56px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;padding:0 22px;font-size:18px;font-weight:600}header small{margin-left:auto;color:#758198}.content{padding:18px 22px 38px}', 'main{margin-left:205px;height:100vh;overflow:hidden;background:#f4f6f8}header{height:40px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;padding:0 14px;font-size:15px;font-weight:600;position:sticky;top:0;z-index:30}header small{margin-left:auto;color:#98a2b3;font-size:10px}.content{height:calc(100vh - 40px);overflow:auto;padding:12px 16px 24px}.content.email-content{overflow:hidden;padding:6px 10px 8px;display:flex;flex-direction:column}.content.email-content app-email{display:block;flex:1;min-height:0}')
          s=s.replace('.gmail-connect-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #dfe3e8;border-radius:10px;padding:9px 10px;margin-bottom:10px}.gmail-title{display:flex;align-items:center;gap:8px;margin-right:auto}.gmail-title>div{display:flex;flex-direction:column}.gmail-title b{font-size:11px;color:#344054}.gmail-title small{font-size:9px;color:#98a2b3;margin-top:1px}', '.gmail-connect-bar{display:flex;align-items:center;gap:6px;flex:0 0 auto;background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:4px 6px;margin-bottom:5px;min-height:32px}.gmail-title{display:flex;align-items:center;gap:5px;margin-right:auto;white-space:nowrap}.gmail-title b{font-size:10px;color:#344054}.gmail-title small{font-size:9px;color:#98a2b3}')
          s=s.replace('.gmail-account{display:flex;align-items:center;gap:7px;border:1px solid #e4e7ec;border-radius:8px;padding:5px 7px;font-size:10px;', '.gmail-account{display:flex;align-items:center;gap:5px;border:1px solid #e4e7ec;border-radius:7px;padding:3px 6px;font-size:9px;')
          s=s.replace('.gmail-account strong{font-size:9px;', '.gmail-account strong{font-size:8px;')
          s=s.replace('padding:5px 8px!important;font-size:9px!important', 'padding:3px 6px!important;font-size:8px!important')
          p.write_text(s)

          # Email component: internal scrolling + persistent counts
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          s=s.replace("  .email-page{min-width:0}.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px}.page-head>div:first-child{min-width:0}.page-head h2{margin:0;font-size:23px;font-weight:600;color:#101828}.page-head p{margin:4px 0 0;font-size:12px;color:#758198}.top-actions{margin-left:auto;display:flex;gap:6px}", "  .email-page{min-width:0;height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}.page-head{display:flex;align-items:center;gap:10px;margin:0 0 5px;flex:0 0 32px}.page-head>div:first-child{min-width:0}.page-head h2{margin:0;font-size:18px;font-weight:600;color:#101828;line-height:1}.page-head p{display:none}.top-actions{margin-left:auto;display:flex;gap:4px}.top-actions ::ng-deep .p-button{padding:.35rem .65rem;font-size:11px}")
          s=s.replace("  .mail-app{height:calc(100vh - 168px);min-height:600px;display:grid;grid-template-columns:176px minmax(0,1fr);", "  .mail-app{flex:1;min-height:0;height:auto;display:grid;grid-template-columns:176px minmax(0,1fr);")
          s=s.replace('.message-list{min-width:0;display:flex;flex-direction:column;', '.message-list{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;')
          s=s.replace('.list-toolbar{min-height:62px;padding:9px 12px;', '.list-toolbar{height:52px;min-height:52px;padding:7px 10px;')
          s=s.replace('.mail-list-scroll{overflow:auto;min-height:0}', '.mail-list-scroll{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;overscroll-behavior:contain;scrollbar-gutter:stable}')
          s=s.replace('.mail-reader{position:fixed;z-index:1200;top:56px;left:205px;', '.mail-reader{position:fixed;z-index:1200;top:40px;left:205px;')
          s=s.replace("  readonly mailError=signal('');\n\n  constructor(private readonly email:EmailService){void this.loadMail();}", "  readonly mailError=signal('');\n  readonly mailboxInboxCounts=signal<{info:number;support:number}>({info:0,support:0});\n\n  constructor(private readonly email:EmailService){void this.refreshMailboxCounts();void this.loadMail();}")
          anchor="""  private async loadMail(){\n"""
          insert="""  private async refreshMailboxCounts(){\n    try{\n      const [info,support]=await Promise.all([this.email.list('info','Inbox'),this.email.list('support','Inbox')]);\n      this.mailboxInboxCounts.set({info:info.length,support:support.length});\n    }catch(e){this.mailError.set(String((e as Error)?.message||e));}\n  }\n"""
          if insert not in s:
              s=s.replace(anchor, insert+anchor)
          s=s.replace("      this.selected.set(null);\n      this.selected.set(null);", "      this.selected.set(null);")
          s=s.replace("  mailboxCount(box:MailboxId){return this.rows().filter(row=>(box==='all'||row.mailbox===box)&&row.status==='Inbox').length;}", "  mailboxCount(box:MailboxId){const c=this.mailboxInboxCounts();if(box==='info')return c.info;if(box==='support')return c.support;return c.info+c.support;}")
          # Update counts whenever Inbox is loaded, without zeroing the other mailbox
          s=s.replace("      this.rows.set(rows);\n      this.selected.set(null);", "      this.rows.set(rows);\n      if(view==='Inbox'){const c=this.mailboxInboxCounts();if(box==='info')this.mailboxInboxCounts.set({...c,info:rows.length});else if(box==='support')this.mailboxInboxCounts.set({...c,support:rows.length});else this.mailboxInboxCounts.set({info:rows.filter(r=>r.mailbox==='info').length,support:rows.filter(r=>r.mailbox==='support').length});}\n      this.selected.set(null);")
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish source and preview
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/app.component.ts angular-app/src/app/features/email/email.component.ts angular2
          git commit -m "Fix Email viewport scrolling and mailbox counts" || exit 0
          git push
