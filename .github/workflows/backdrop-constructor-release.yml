name: Backdrop Constructor release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect production or apply shared Backdrop Constructor
        type: choice
        options: [verify, apply]
        default: verify
  pull_request:
    paths:
      - 'supabase/migrations/20261007000400_backdrop_constructor_files.sql'
      - '.github/scripts/packing.test.mjs'
      - '.github/scripts/backdrop-constructor-release.mjs'
      - '.github/workflows/backdrop-constructor-release.yml'
permissions:
  contents: read
concurrency:
  group: packing-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse Packing migrations in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/packing-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node .github/scripts/packing.test.mjs "$RUNNER_TEMP/packing-db/node_modules/@electric-sql/pglite/dist/index.js"
          node --check .github/scripts/backdrop-constructor-release.mjs
      - name: Inspect production prerequisites
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/backdrop-constructor-release.mjs --verify
      - name: Apply and verify shared Backdrop Constructor
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/backdrop-constructor-release.mjs --apply
