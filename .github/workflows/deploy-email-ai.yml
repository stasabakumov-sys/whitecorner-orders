name: Deploy Email AI function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/email-ai/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-email-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify OpenAI secret
        run: |
          supabase secrets list --project-ref zgvnrpspwluapaxnycrg \
            | grep -q 'OPENAI_API_KEY'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy email-ai
        run: supabase functions deploy email-ai --project-ref zgvnrpspwluapaxnycrg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
