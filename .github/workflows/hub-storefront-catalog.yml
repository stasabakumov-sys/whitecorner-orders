name: Hub storefront catalogue
on:
  push:
    branches: [main, codex/storefront-catalog-integration]
    paths:
      - '.github/scripts/hub-storefront-*'
      - '.github/scripts/hub-security.test.mjs'
      - '.github/workflows/hub-storefront-catalog.yml'
      - 'supabase/functions/hub-catalog-sync/**'
      - 'supabase/functions/wix-orders-sync/catalog-import*'
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - '.github/scripts/hub-storefront-*'
      - '.github/scripts/hub-security.test.mjs'
      - '.github/workflows/hub-storefront-catalog.yml'
      - 'supabase/functions/hub-catalog-sync/**'
      - 'supabase/functions/wix-orders-sync/catalog-import*'
      - 'supabase/migrations/**'
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *' # 03:00 Australia/Brisbane
permissions:
  contents: read
concurrency:
  group: hub-storefront-catalog-production
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install local test dependencies
        run: |
          npm ci --prefix angular-app --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/catalog-db" --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Check importer and catalogue contract without production access
        run: |
          deno check --no-lock supabase/functions/hub-catalog-sync/index.ts
          node --test .github/scripts/hub-storefront-model.test.mjs .github/scripts/hub-storefront-freshness.test.mjs supabase/functions/wix-orders-sync/catalog-import.test.cjs supabase/functions/hub-catalog-sync/handler.test.cjs
          node .github/scripts/hub-storefront-schema.test.mjs "$RUNNER_TEMP/catalog-db/node_modules/@electric-sql/pglite/dist/index.js"
          node .github/scripts/hub-security.test.mjs "$RUNNER_TEMP/catalog-db/node_modules/@electric-sql/pglite/dist/index.js"
  audit:
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare saved data and published catalogue using aggregate SQL only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/hub-storefront-audit.mjs
      - name: Verify existing importer gateway setting without changing production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/hub-storefront-production.mjs --check
  production:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        if: github.event_name != 'schedule'
        with:
          version: latest
      - name: Apply fenced catalogue publication migration
        if: github.event_name != 'schedule'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/hub-storefront-production.mjs --apply
      - name: Deploy catalogue maintenance function preserving verified gateway setting
        if: github.event_name != 'schedule'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy hub-catalog-sync --project-ref zgvnrpspwluapaxnycrg --no-verify-jwt
      - name: Refresh Wix snapshots and publish verified public catalogue
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/hub-storefront-production.mjs --sync
