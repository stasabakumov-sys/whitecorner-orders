name: Install PrimeNG dependencies
on:
  push:
    paths:
      - '.github/workflows/install-primeng.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MIT PrimeNG 21 and Aura theme
        run: |
          cd angular-app
          npm install primeng@21.1.9 @primeuix/themes@2.0.3 @angular/animations@^22.1.0 --save --legacy-peer-deps
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add angular-app/package.json angular-app/package-lock.json
          git commit -m "Use MIT PrimeNG 21 UI dependencies" || exit 0
          git push
