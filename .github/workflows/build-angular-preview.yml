          import { computed, Injectable, signal } from '@angular/core';
          import type { Session } from '@supabase/supabase-js';
          import { SupabaseService } from './supabase.service';

          @Injectable({ providedIn: 'root' })
          export class AuthService {
            readonly session = signal<Session | null>(null);
            readonly ready = signal(false);
            readonly userEmail = computed(() => this.session()?.user.email ?? '');
            private initialized = false;

            constructor(private readonly supabase: SupabaseService) {}

            async initialize(): Promise<void> {
              if (this.initialized) return;
              this.initialized = true;
              const { data } = await this.supabase.client.auth.getSession();
              this.session.set(data.session);
              this.ready.set(true);
              this.supabase.client.auth.onAuthStateChange((_event, session) => {
                this.session.set(session);
                this.ready.set(true);
              });
            }

            async signIn(email: string, password: string): Promise<string | null> {
              const { error } = await this.supabase.client.auth.signInWithPassword({ email, password });
              return error?.message ?? null;
            }

            async signOut(): Promise<void> {
              await this.supabase.client.auth.signOut();
            }
          }
          EOF

          cat > src/app/core/services/orders.service.ts <<'EOF'
          import { Injectable, signal } from '@angular/core';
          import { environment } from '../../../environments/environment';
          import { OrderRow } from '../models/order.models';
          import { SupabaseService } from './supabase.service';

          @Injectable({ providedIn: 'root' })
          export class OrdersService {
            readonly orders = signal<OrderRow[]>([]);
            readonly loading = signal(false);
            readonly error = signal('');
            readonly lastSync = signal<string | null>(null);
            private readonly excluded = new Set(['10242']);

            constructor(private readonly supabase: SupabaseService) {}

            async load(): Promise<void> {
              this.loading.set(true);
              this.error.set('');
              const { data, error } = await this.supabase.client
                .from('wc_orders')
                .select('*,wc_order_items(*,wc_production_units(*))')
                .eq('is_hidden', false)
                .order('wix_created_at', { ascending: false });
              this.loading.set(false);
              if (error) {
                this.error.set(error.message);
                return;
              }
              const rows = ((data ?? []) as OrderRow[]).filter(
                (order) => !this.excluded.has(String(order.order_number)),
              );
              this.orders.set(rows);
              const syncs = rows.map((o) => o.wix_synced_at).filter(Boolean).sort() as string[];
              this.lastSync.set(syncs.at(-1) ?? null);
            }

            async syncWix(): Promise<void> {
              this.error.set('');
              const { data, error } = await this.supabase.client.functions.invoke(environment.wixSyncFunction);
              if (error) throw error;
              if (data?.error) throw new Error(data.error);
              await this.load();
            }
          }
          EOF

