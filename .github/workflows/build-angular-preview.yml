          .boot{position:fixed;inset:0;display:grid;place-items:center;background:#eef1f5;color:#758198}.side{position:fixed;inset:0 auto 0 0;width:240px;background:#17191f;color:#fff;padding:18px 10px;z-index:20}.brand{padding:2px 12px 22px;font-size:18px;font-weight:650}.brand small{display:block;margin-top:4px;color:#9097a5;font-size:11px;font-weight:400}.side a{position:relative;min-height:44px;color:#dfe4ec;text-decoration:none;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:12px;margin:2px 0}.side a:hover{background:#22262e}.side a.active{background:#2b3039;color:#fff;font-weight:600}.side a.active:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#5b8cff}.icon{width:20px;text-align:center}.signout{position:absolute;left:22px;right:22px;bottom:20px;border:1px solid #454b57;background:transparent;color:#dfe4ec;border-radius:8px;padding:8px;cursor:pointer}main{margin-left:240px;min-height:100vh;background:#f4f6f8}main>header{height:56px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;padding:0 24px;font-size:18px;font-weight:600;position:sticky;top:0;z-index:10}main>header span{margin-left:auto;color:#758198;font-size:11px;font-weight:500}.content{padding:18px 24px 38px}@media(max-width:820px){.side{width:76px}.side a span:not(.icon),.brand small{display:none}.brand{font-size:0}.brand:after{content:'WC';font-size:15px}.side a{justify-content:center}main{margin-left:76px}}
          EOF

          cat > src/main.ts <<'EOF'
          import { bootstrapApplication } from '@angular/platform-browser';
          import { appConfig } from './app/app.config';
          import { AppComponent } from './app/app.component';

          bootstrapApplication(AppComponent, appConfig).catch((err) => console.error(err));
          EOF

          cat > src/styles.css <<'EOF'
          *{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#172033;background:#f4f6f8}button,input,select{font:inherit}
          EOF

          cat > MIGRATION.md <<'EOF'
          # White Corner Orders — Angular migration

          Reference legacy release: **v0.9.7** (frozen; do not modify).

          Angular target: **v22**, standalone components + TypeScript + services.

          ## Migration status
          - [x] Angular workspace / GitHub Pages preview
          - [x] Authentication shell + left-side routing
          - [x] Supabase service
          - [x] Orders service + Wix Sync
          - [x] Orders list + first Angular order drawer
          - [ ] Production Board + unit-level model
          - [ ] Order Activity / audit timeline
          - [ ] Address Review
          - [ ] Shipping Data
          - [ ] Regression comparison against v0.9.7
          - [ ] Switch root only after user verification
          EOF

          npm install
          npm run build -- --base-href /whitecorner-orders/angular-preview/
          rm -rf ../angular-preview
          mkdir -p ../angular-preview
          browser_dir=$(find dist -type d -name browser | head -1)
          if [ -n "$browser_dir" ]; then cp -R "$browser_dir"/* ../angular-preview/; else cp -R dist/* ../angular-preview/; fi

      - name: Commit Angular source and preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app angular-preview
          git commit -m "Add Angular 22 migration baseline" || exit 0
          git push
