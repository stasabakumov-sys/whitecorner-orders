          import { CurrencyPipe, DatePipe, NgFor, NgIf } from '@angular/common';
          import { Component, EventEmitter, Input, Output } from '@angular/core';
          import { OrderItemRow, OrderRow } from '../../core/models/order.models';

          @Component({
            selector: 'app-order-drawer',
            standalone: true,
            imports: [CurrencyPipe, DatePipe, NgFor, NgIf],
            templateUrl: './order-drawer.component.html',
            styleUrl: './order-drawer.component.css',
          })
          export class OrderDrawerComponent {
            @Input({ required: true }) order!: OrderRow;
            @Output() closed = new EventEmitter<void>();

            items(): OrderItemRow[] {
              return (this.order.wc_order_items ?? []).filter(
                (item) => !/^delivery$/i.test(item.product_name ?? ''),
              );
            }

            itemTotal(item: OrderItemRow): number {
              return Number(item.unit_price ?? 0) * Number(item.quantity ?? 1);
            }

            optionLabels(item: OrderItemRow): string[] {
              const source = item.wix_options ?? {};
              return Object.entries(source)
                .map(([key, value]) => `${key}: ${this.optionValue(value)}`)
                .filter((x) => !x.endsWith(': '))
                .slice(0, 10);
            }

            private optionValue(value: unknown): string {
              if (value == null) return '';
              if (typeof value === 'object') {
                const obj = value as Record<string, unknown>;
                return String(obj['value'] ?? obj['name'] ?? obj['description'] ?? '');
              }
              return String(value);
            }
          }
          EOF

