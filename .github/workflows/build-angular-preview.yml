          cat > src/app/features/orders/orders.component.ts <<'EOF'
          import { CurrencyPipe, DatePipe } from '@angular/common';
          import { Component, computed, OnInit, signal } from '@angular/core';
          import { OrderRow } from '../../core/models/order.models';
          import { OrdersService } from '../../core/services/orders.service';
          import { OrderDrawerComponent } from '../../shared/order-drawer/order-drawer.component';

          @Component({
            selector: 'app-orders',
            standalone: true,
            imports: [CurrencyPipe, DatePipe, OrderDrawerComponent],
            templateUrl: './orders.component.html',
            styleUrl: './orders.component.css',
          })
          export class OrdersComponent implements OnInit {
            readonly search = signal('');
            readonly fulfilment = signal('');
            readonly selected = signal<OrderRow | null>(null);
            readonly syncing = signal(false);

            readonly filtered = computed(() => {
              const q = this.search().trim().toLowerCase();
              const fulfilment = this.fulfilment();
              return this.orders.orders().filter((order) => {
                if (fulfilment && order.delivery_type !== fulfilment) return false;
                if (!q) return true;
                return JSON.stringify(order).toLowerCase().includes(q);
              });
            });

            readonly productionCount = computed(() =>
              this.orders.orders().flatMap((o) => o.wc_order_items ?? []).flatMap((i) => i.wc_production_units ?? [])
                .filter((u) => (u.production_status || 'New') !== 'Ready').length,
            );

            readonly readyCount = computed(() =>
              this.orders.orders().flatMap((o) => o.wc_order_items ?? []).flatMap((i) => i.wc_production_units ?? [])
                .filter((u) => (u.production_status || 'New') === 'Ready').length,
            );

            constructor(readonly orders: OrdersService) {}

            ngOnInit(): void {
              if (!this.orders.orders().length) void this.orders.load();
            }

            async sync(): Promise<void> {
              this.syncing.set(true);
              try { await this.orders.syncWix(); }
              catch (error) { this.orders.error.set(`Wix sync failed: ${String((error as Error)?.message ?? error)}`); }
              finally { this.syncing.set(false); }
            }
          }
          EOF

