name: Build Angular preview
on:
  push:
    paths:
      - '.github/workflows/build-angular-preview.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create Angular 22 workspace
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f angular-app/package.json ]; then
            npx -y @angular/cli@22 new whitecorner-angular \
              --directory angular-app \
              --routing \
              --style css \
              --standalone \
              --skip-git \
              --skip-tests \
              --package-manager npm \
              --defaults
          fi
          cd angular-app
          npm install @supabase/supabase-js@^2
      - name: Write White Corner Angular baseline
        shell: bash
        run: |
          set -euo pipefail
          cd angular-app
          rm -rf src/app
          mkdir -p src/app/core/services src/app/core/models src/app/features/home src/app/features/orders src/app/features/production-board src/app/features/address-review src/app/features/shipping-data src/app/shared/login src/app/shared/order-drawer src/environments

          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: true,
            supabaseUrl: 'https://zgvnrpspwluapaxnycrg.supabase.co',
            supabasePublishableKey: 'sb_publishable_DwutkRc9dxioIdUcdPn4gA_RfDb1-n_',
            wixSyncFunction: 'wix-orders-sync',
          } as const;
          EOF

          cat > src/app/core/models/order.models.ts <<'EOF'
          export interface ProductionUnitRow { id:string; unit_index:number; production_status:string; production_comment?:string|null; priority?:number|null; }
          export interface OrderItemRow { id:string; wix_line_item_id:string; product_name?:string|null; quantity?:number|null; unit_price?:number|null; wix_options?:Record<string,unknown>|null; custom_text_fields?:Record<string,unknown>|null; image?:Record<string,unknown>|null; raw_item?:Record<string,unknown>|null; wc_production_units?:ProductionUnitRow[]; }
          export interface OrderRow { id:string; order_number:string; wix_created_at?:string|null; wix_synced_at?:string|null; payment_status?:string|null; fulfillment_status?:string|null; currency?:string|null; customer_name?:string|null; company?:string|null; delivery_type?:string|null; delivery_address?:Record<string,unknown>|null; buyer_note?:string|null; subtotal?:number|null; shipping?:number|null; tax?:number|null; discount?:number|null; total?:number|null; additional_fees?:number|null; wc_order_items?:OrderItemRow[]; }
          EOF

          cat > src/app/core/services/supabase.service.ts <<'EOF'
          import { Injectable } from '@angular/core';
          import { createClient, SupabaseClient } from '@supabase/supabase-js';
          import { environment } from '../../../environments/environment';
          @Injectable({providedIn:'root'}) export class SupabaseService { readonly client:SupabaseClient=createClient(environment.supabaseUrl,environment.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); }
          EOF

          cat > src/app/core/services/auth.service.ts <<'EOF'
          import { computed, Injectable, signal } from '@angular/core';
          import type { Session } from '@supabase/supabase-js';
          import { SupabaseService } from './supabase.service';
          @Injectable({providedIn:'root'}) export class AuthService { readonly session=signal<Session|null>(null); readonly ready=signal(false); readonly userEmail=computed(()=>this.session()?.user.email??''); private initialized=false; constructor(private supabase:SupabaseService){} async initialize(){if(this.initialized)return;this.initialized=true;const{data}=await this.supabase.client.auth.getSession();this.session.set(data.session);this.ready.set(true);this.supabase.client.auth.onAuthStateChange((_e,s)=>{this.session.set(s);this.ready.set(true)});} async signIn(email:string,password:string){const{error}=await this.supabase.client.auth.signInWithPassword({email,password});return error?.message??null;} async signOut(){await this.supabase.client.auth.signOut();} }
          EOF

          cat > src/app/core/services/orders.service.ts <<'EOF'
          import { Injectable, signal } from '@angular/core';
          import { environment } from '../../../environments/environment';
          import { OrderRow } from '../models/order.models';
          import { SupabaseService } from './supabase.service';
          @Injectable({providedIn:'root'}) export class OrdersService { readonly orders=signal<OrderRow[]>([]); readonly loading=signal(false); readonly error=signal(''); readonly lastSync=signal<string|null>(null); private excluded=new Set(['10242']); constructor(private supabase:SupabaseService){} async load(){this.loading.set(true);this.error.set('');const{data,error}=await this.supabase.client.from('wc_orders').select('*,wc_order_items(*,wc_production_units(*))').eq('is_hidden',false).order('wix_created_at',{ascending:false});this.loading.set(false);if(error){this.error.set(error.message);return;}const rows=((data??[]) as OrderRow[]).filter(o=>!this.excluded.has(String(o.order_number)));this.orders.set(rows);const syncs=rows.map(o=>o.wix_synced_at).filter(Boolean).sort() as string[];this.lastSync.set(syncs.at(-1)??null);} async syncWix(){this.error.set('');const{data,error}=await this.supabase.client.functions.invoke(environment.wixSyncFunction);if(error)throw error;if(data?.error)throw new Error(data.error);await this.load();} }
          EOF

          cat > src/app/shared/login/login.component.ts <<'EOF'
          import { Component, signal } from '@angular/core'; import { AuthService } from '../../core/services/auth.service';
          @Component({selector:'app-login',standalone:true,template:`<div class="wrap"><form (submit)="submit($event)"><h2>White Corner Orders</h2><p>Angular preview</p><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button [disabled]="busy()">Sign in</button><div>{{message()}}</div></form></div>`,styles:[`.wrap{position:fixed;inset:0;background:#eef1f5;display:grid;place-items:center}form{width:390px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:28px}input{width:100%;padding:10px;margin:5px 0;border:1px solid #d4d9e2;border-radius:8px}button{margin-top:8px;background:#116dff;color:#fff;border:0;border-radius:8px;padding:9px 14px}`]}) export class LoginComponent{message=signal('');busy=signal(false);constructor(private auth:AuthService){}async submit(e:SubmitEvent){e.preventDefault();const f=new FormData(e.target as HTMLFormElement);this.busy.set(true);const err=await this.auth.signIn(String(f.get('email')??'').trim(),String(f.get('password')??''));this.busy.set(false);this.message.set(err??'');}}
          EOF

          cat > src/app/features/home/home.component.ts <<'EOF'
          import { Component } from '@angular/core'; import { AuthService } from '../../core/services/auth.service';
          @Component({selector:'app-home',standalone:true,template:`<section class="panel"><h2>White Corner Orders</h2><p><b>Angular 22 migration baseline</b></p><p>Signed in as {{auth.userEmail()}}</p></section>`,styles:[`.panel{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:24px;max-width:760px}`]}) export class HomeComponent{constructor(readonly auth:AuthService){}}
          EOF

          cat > src/app/shared/order-drawer/order-drawer.component.ts <<'EOF'
          import { CurrencyPipe, DatePipe } from '@angular/common'; import { Component, EventEmitter, Input, Output } from '@angular/core'; import { OrderItemRow,OrderRow } from '../../core/models/order.models';
          @Component({selector:'app-order-drawer',standalone:true,imports:[CurrencyPipe,DatePipe],template:`<div class="shade" (click)="closed.emit()"><aside (click)="$event.stopPropagation()"><header><div><b>#{{order.order_number}}</b><div>{{order.customer_name}}</div></div><button (click)="closed.emit()">×</button></header><div class="body"><div class="overview"><div><b>Payment</b><span>{{order.payment_status||'—'}}</span></div><div><b>Fulfilment</b><span>{{order.delivery_type||'Shipping'}}</span></div><div><b>Total</b><span>{{order.total||0|currency:(order.currency||'AUD')}}</span></div><div><b>Date</b><span>{{order.wix_created_at|date:'dd MMM yyyy'}}</span></div></div><h4>ORDER COMPOSITION</h4>@for(item of items();track item.id){<div class="item"><div><b>{{item.product_name}}</b><div class="pill">qty: {{item.quantity||1}}</div></div><div class="money">{{item.unit_price||0|currency:(order.currency||'AUD')}} each<br><b>{{itemTotal(item)|currency:(order.currency||'AUD')}}</b></div></div>}</div></aside></div>`,styles:[`.shade{position:fixed;inset:0;background:#0f172a55;z-index:50}aside{position:absolute;right:0;top:0;bottom:0;width:min(940px,96vw);background:#fff;overflow:auto}header{display:flex;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #e4e7ec}header button{border:0;border-radius:50%;width:42px;height:42px}.body{padding:20px 22px}.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.overview>div,.item{border:1px solid #e4e7ec;border-radius:8px;padding:10px}.overview>div{display:flex;flex-direction:column;gap:5px}.item{display:grid;grid-template-columns:1fr auto;margin-bottom:9px}.pill{display:inline-block;background:#f1f4f7;padding:4px 6px;border-radius:5px;font-size:11px;margin-top:5px}.money{text-align:right}`]}) export class OrderDrawerComponent{@Input({required:true})order!:OrderRow;@Output()closed=new EventEmitter<void>();items(){return(this.order.wc_order_items??[]).filter(i=>!/^delivery$/i.test(i.product_name??''));}itemTotal(i:OrderItemRow){return Number(i.unit_price??0)*Number(i.quantity??1);}}
          EOF

          cat > src/app/features/orders/orders.component.ts <<'EOF'
          import { CurrencyPipe,DatePipe } from '@angular/common'; import { Component,computed,OnInit,signal } from '@angular/core'; import { OrderRow } from '../../core/models/order.models'; import { OrdersService } from '../../core/services/orders.service'; import { OrderDrawerComponent } from '../../shared/order-drawer/order-drawer.component';
          @Component({selector:'app-orders',standalone:true,imports:[CurrencyPipe,DatePipe,OrderDrawerComponent],template:`<div class="stats"><span>Orders <b>{{orders.orders().length}}</b></span>@if(orders.lastSync()){<small>Wix synced {{orders.lastSync()|date:'dd/MM/yyyy, h:mm:ss a'}}</small>}</div><div class="toolbar"><span class="grow"></span><button (click)="sync()" [disabled]="syncing()">{{syncing()?'Syncing…':'Sync Wix'}}</button><input placeholder="Search…" (input)="search.set($any($event.target).value)"></div>@if(orders.error()){<div class="error">{{orders.error()}}</div>}<div class="table"><table><thead><tr><th>Order</th><th>Date created</th><th>Customer</th><th>Payment</th><th>Fulfilment</th><th>Total</th></tr></thead><tbody>@for(order of filtered();track order.id){<tr (click)="selected.set(order)"><td><b>#{{order.order_number}}</b></td><td>{{order.wix_created_at|date:'dd MMM yyyy'}}</td><td>{{order.customer_name||'—'}}<small>{{order.company}}</small></td><td>{{order.payment_status||'—'}}</td><td>{{order.delivery_type||'Shipping'}}</td><td>{{order.total||0|currency:(order.currency||'AUD')}}</td></tr>}</tbody></table></div>@if(selected();as order){<app-order-drawer [order]="order" (closed)="selected.set(null)"/>}`,styles:[`.stats,.toolbar,.table{background:#fff;border:1px solid #e4e7ec;border-radius:12px}.stats,.toolbar{padding:10px 12px;display:flex;align-items:center;gap:20px;margin-bottom:10px}.stats small{margin-left:auto;color:#758198}.grow{flex:1}.toolbar button{background:#116dff;color:#fff;border:0;border-radius:8px;padding:8px 12px}.toolbar input{border:1px solid #d4d9e2;border-radius:8px;padding:8px 10px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{background:#fafbfc;text-align:left;font-size:11px;text-transform:uppercase;color:#758198;padding:12px 14px}td{padding:13px 14px;border-top:1px solid #edf0f3}tbody tr{cursor:pointer}tbody tr:hover{background:#f8fbff}td small{display:block;color:#758198}.error{background:#fff1f1;color:#8c2f2f;padding:12px;border-radius:8px;margin-bottom:10px}`]}) export class OrdersComponent implements OnInit{search=signal('');selected=signal<OrderRow|null>(null);syncing=signal(false);filtered=computed(()=>{const q=this.search().toLowerCase();return this.orders.orders().filter(o=>!q||JSON.stringify(o).toLowerCase().includes(q));});constructor(readonly orders:OrdersService){}ngOnInit(){if(!this.orders.orders().length)void this.orders.load();}async sync(){this.syncing.set(true);try{await this.orders.syncWix();}catch(e){this.orders.error.set('Wix sync failed: '+String((e as Error)?.message??e));}finally{this.syncing.set(false);}}}
          EOF

          for feature in production-board address-review shipping-data; do
            class_name=$(echo "$feature" | awk -F- '{for(i=1;i<=NF;i++) printf toupper(substr($i,1,1)) substr($i,2);}')
            title=$(echo "$feature" | sed 's/-/ /g')
            cat > "src/app/features/$feature/$feature.component.ts" <<EOF
          import { Component } from '@angular/core'; @Component({selector:'app-$feature',standalone:true,template:'<section class="p"><h2>${title}</h2><p>Migration in progress. v0.9.7 remains the reference.</p></section>',styles:['.p{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:24px}']}) export class ${class_name}Component{}
          EOF
          done

          cat > src/app/app.routes.ts <<'EOF'
          import { Routes } from '@angular/router'; import { HomeComponent } from './features/home/home.component'; import { OrdersComponent } from './features/orders/orders.component'; import { ProductionBoardComponent } from './features/production-board/production-board.component'; import { AddressReviewComponent } from './features/address-review/address-review.component'; import { ShippingDataComponent } from './features/shipping-data/shipping-data.component'; export const routes:Routes=[{path:'',pathMatch:'full',redirectTo:'home'},{path:'home',component:HomeComponent},{path:'orders',component:OrdersComponent},{path:'production',component:ProductionBoardComponent},{path:'address-review',component:AddressReviewComponent},{path:'shipping-data',component:ShippingDataComponent},{path:'**',redirectTo:'home'}];
          EOF

          cat > src/app/app.config.ts <<'EOF'
          import { ApplicationConfig,provideZoneChangeDetection } from '@angular/core'; import { provideRouter,withHashLocation } from '@angular/router'; import { routes } from './app.routes'; export const appConfig:ApplicationConfig={providers:[provideZoneChangeDetection({eventCoalescing:true}),provideRouter(routes,withHashLocation())]};
          EOF

          cat > src/app/app.component.ts <<'EOF'
          import { Component } from '@angular/core'; import { RouterLink,RouterLinkActive,RouterOutlet } from '@angular/router'; import { AuthService } from './core/services/auth.service'; import { LoginComponent } from './shared/login/login.component'; @Component({selector:'app-root',standalone:true,imports:[RouterOutlet,RouterLink,RouterLinkActive,LoginComponent],template:`@if(!auth.ready()){<div class="boot">Loading…</div>}@else if(!auth.session()){<app-login/>}@else{<aside><div class="brand">White Corner<small>Angular migration</small></div>@for(n of nav;track n[1]){<a [routerLink]="n[1]" routerLinkActive="active"><span>{{n[2]}}</span>{{n[0]}}</a>}<button (click)="auth.signOut()">Sign out</button></aside><main><header>White Corner Orders <small>Angular 22 preview</small></header><div class="content"><router-outlet/></div></main>}`,styles:[`.boot{position:fixed;inset:0;display:grid;place-items:center}aside{position:fixed;inset:0 auto 0 0;width:240px;background:#17191f;color:#fff;padding:18px 10px}.brand{padding:2px 12px 22px;font-size:18px}.brand small{display:block;color:#9097a5;font-size:11px}aside a{color:#dfe4ec;text-decoration:none;padding:10px 12px;border-radius:8px;display:flex;gap:12px;margin:2px 0}aside a.active{background:#2b3039;color:#fff}aside button{position:absolute;bottom:20px;left:22px;right:22px;background:transparent;color:#fff;border:1px solid #454b57;border-radius:8px;padding:8px}main{margin-left:240px;min-height:100vh;background:#f4f6f8}header{height:56px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;padding:0 24px;font-size:18px;font-weight:600}header small{margin-left:auto;color:#758198}.content{padding:18px 24px 38px}`]}) export class AppComponent{nav=[['Home','/home','⌂'],['Orders','/orders','▤'],['Production Board','/production','▦'],['Address Review','/address-review','◎'],['Shipping Data','/shipping-data','⇄']] as const;constructor(readonly auth:AuthService){void auth.initialize();}}
          EOF

          cat > src/main.ts <<'EOF'
          import { bootstrapApplication } from '@angular/platform-browser'; import { appConfig } from './app/app.config'; import { AppComponent } from './app/app.component'; bootstrapApplication(AppComponent,appConfig).catch(console.error);
          EOF
          cat > src/styles.css <<'EOF'
          *{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#172033;background:#f4f6f8}button,input,select{font:inherit}
          EOF
          cat > MIGRATION.md <<'EOF'
          # Angular migration
          Frozen reference: v0.9.7.
          - [x] Angular 22 workspace
          - [x] Auth shell + routes
          - [x] Supabase service
          - [x] Orders + Wix Sync + first drawer
          - [ ] Production Board
          - [ ] Order Activity
          - [ ] Address Review
          - [ ] Shipping Data
          - [ ] Regression check
          - [ ] Root switch only after verification
          EOF
          npm install
          npm run build -- --base-href /whitecorner-orders/angular-preview/
          rm -rf ../angular-preview && mkdir -p ../angular-preview
          browser_dir=$(find dist -type d -name browser | head -1)
          if [ -n "$browser_dir" ]; then cp -R "$browser_dir"/* ../angular-preview/; else cp -R dist/* ../angular-preview/; fi
      - name: Commit Angular source and preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app angular-preview
          git commit -m "Add Angular 22 migration baseline" || exit 0
          git push
