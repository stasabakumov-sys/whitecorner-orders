name: Fix Email full height
on:
  push:
    paths:
      - '.github/workflows/fix-email-full-height.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix routed Email host height
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          s=s.replace("  .email-page{min-width:0;height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}", ":host{display:block;height:100%;min-height:0;overflow:hidden}  .email-page{min-width:0;height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}")
          s=s.replace("  .mail-app{flex:1;min-height:0;height:100%;max-height:100%;display:grid;", "  .mail-app{flex:1 1 auto;min-height:0;height:auto;max-height:none;display:grid;")
          p.write_text(s)

          p=Path('angular-app/src/app/app.component.ts')
          s=p.read_text()
          s=s.replace(".content.email-content app-email{display:block;flex:1;min-height:0}", ":host ::ng-deep .content.email-content app-email{display:block;flex:1 1 auto;min-height:0;height:100%;overflow:hidden}")
          p.write_text(s)
          PY
      - name: Build Angular app
        run: |
          cd angular-app
          npm ci --legacy-peer-deps
          npm run build -- --base-href /whitecorner-orders/angular2/
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find angular-app/dist -type f -name index.html -path '*/browser/*' -printf '%h\n' | head -1)
          rm -rf angular2
          mkdir angular2
          cp -R "$OUT"/* angular2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-app/src/app/features/email/email.component.ts angular-app/src/app/app.component.ts angular2
          git commit -m "Make Email workspace fill viewport" || exit 0
          git push
