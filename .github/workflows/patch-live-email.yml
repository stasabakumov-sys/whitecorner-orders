name: Patch Email UI to live Gmail
on:
  push:
    paths:
      - '.github/workflows/patch-live-email.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Email component from demo rows to Gmail API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('angular-app/src/app/features/email/email.component.ts')
          s=p.read_text()
          s=s.replace("import { TagModule } from 'primeng/tag';", "import { TagModule } from 'primeng/tag';\nimport { EmailService, GmailMessageRow } from '../../core/services/email.service';")
          s=s.replace("(click)=\"selected.set(mail)\"", "(click)=\"openMail(mail)\"")
          s=s.replace('<div class="mail-status"><span></span><div><b>Mail not connected</b><small>UI prototype only</small></div></div>', '<div class="mail-status live"><span></span><div><b>Gmail connected</b><small>Live Inbox / Sent</small></div></div>')
          s=s.replace('<div class="reply-actions"><span>Mailbox connection comes next.</span><p-button label="Send" icon="pi pi-send" [disabled]="true"/></div>', '<div class="reply-actions"><span>Reply/send will be enabled after live mail verification.</span><p-button label="Send" icon="pi pi-send" [disabled]="true"/></div>')
          start=s.index('  readonly rows=signal<MailRow[]>([')
          end=s.index('  readonly decisionFlow=', start)
          replacement='''  readonly rows=signal<MailRow[]>([]);\n  readonly selected=signal<MailRow|null>(null);\n  readonly mailLoading=signal(false);\n  readonly mailError=signal('');\n\n  constructor(private readonly email:EmailService){void this.loadMail();}\n\n'''
          s=s[:start]+replacement+s[end:]
          old="""  setMailbox(box:MailboxId){this.activeMailbox.set(box);this.syncSelection(box,this.activeView());}\n  setView(view:MailView){this.activeView.set(view);this.syncSelection(this.activeMailbox(),view);}\n  ensureSelection(){queueMicrotask(()=>{const visible=this.visibleRows();if(!visible.some(row=>row.id===this.selected()?.id))this.selected.set(visible[0]??null);});}\n  private syncSelection(box:MailboxId,view:MailView){const q=this.query().trim().toLowerCase();const visible=this.rows().filter(row=>this.belongsToView(row,view)&&(box==='all'||row.mailbox===box)&&(!q||`${row.correspondent} ${row.email} ${row.subject} ${row.preview} ${row.linked_order||''}`.toLowerCase().includes(q)));this.selected.set(visible[0]??null);}\n"""
          new="""  setMailbox(box:MailboxId){this.activeMailbox.set(box);void this.loadMail();}\n  setView(view:MailView){this.activeView.set(view);void this.loadMail();}\n  ensureSelection(){queueMicrotask(()=>{const visible=this.visibleRows();if(!visible.some(row=>row.id===this.selected()?.id))this.selected.set(visible[0]??null);});}\n  private async loadMail(){\n    const view=this.activeView();\n    if(view==='Needs reply'){this.rows.set([]);this.selected.set(null);return;}\n    this.mailLoading.set(true);this.mailError.set('');\n    try{\n      const box=this.activeMailbox();\n      const keys:('info'|'support')[]=box==='all'?['info','support']:[box];\n      const batches=await Promise.all(keys.map(key=>this.email.list(key,view)));\n      const rows=batches.flat().map(row=>this.toMailRow(row)).sort((a,b)=>this.dateValue(b.received_at)-this.dateValue(a.received_at));\n      this.rows.set(rows);\n      this.selected.set(null);\n      if(rows[0])await this.openMail(rows[0]);\n    }catch(e){this.rows.set([]);this.selected.set(null);this.mailError.set(String((e as Error)?.message||e));}\n    finally{this.mailLoading.set(false);}\n  }\n  private toMailRow(row:GmailMessageRow):MailRow{\n    return {...row,body:'',ai_state:'Not analysed',linked_order:null,intent:null,needs_reply:false,confidence:null,draft_reply:'',time:this.formatMailTime(row.received_at)};\n  }\n  async openMail(mail:MailRow){\n    this.selected.set(mail);\n    if(mail.body)return;\n    try{const full=await this.email.getMessage(mail.mailbox,mail.id);const updated={...mail,body:full.body||mail.preview,received_at:full.date||mail.received_at,time:this.formatMailTime(full.date||mail.received_at)};this.rows.update(rows=>rows.map(row=>row.id===mail.id&&row.mailbox===mail.mailbox?updated:row));this.selected.set(updated);}\n    catch(e){this.mailError.set(String((e as Error)?.message||e));}\n  }\n  private dateValue(value:string){const n=Date.parse(value);return Number.isFinite(n)?n:0;}\n  private formatMailTime(value:string){const d=new Date(value);if(Number.isNaN(d.getTime()))return value;const now=new Date();if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});}\n"""
          if old not in s: raise SystemExit('mail methods anchor not found')
          s=s.replace(old,new)
          s=s.replace('.mail-status>span{width:7px;height:7px;border-radius:50%;background:#f59e0b;', '.mail-status>span{width:7px;height:7px;border-radius:50%;background:#12b76a;')
          p.write_text(s)
          PY
      - name: Commit live Gmail UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add angular-app/src/app/features/email/email.component.ts
          git commit -m "Use live Gmail data in Email workspace"
          git push
