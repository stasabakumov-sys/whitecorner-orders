<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White Corner Orders v0.6.2</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}iframe{position:fixed;inset:0}</style></head><body><iframe id="appframe" src="../v06/" title="White Corner Orders v0.6.2"></iframe><script>
const f=document.getElementById('appframe');
f.addEventListener('load',()=>{
 const d=f.contentDocument||f.contentWindow.document;
 const style=d.createElement('style');
 style.textContent=`
 .homepanel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;max-width:620px}.homepanel h2{margin:0 0 18px;font-size:20px}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.homebox{border:1px solid var(--line);border-radius:9px;padding:14px;background:#fbfcfd}.homebox .label{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:6px}.homebox .value{font-size:14px}.home-signout{margin-top:16px;border:1px solid #cfd8e6;background:#fff;color:var(--txt);border-radius:8px;padding:9px 14px;cursor:pointer}.foot,.account,.logout{display:none!important}
 #productTypeFilter{min-width:155px}.statusline{display:flex;align-items:center;gap:8px;margin-top:8px}.statuscaption{font-size:11px;color:var(--mut);font-weight:600}.status-select{width:auto!important;min-width:118px!important;max-width:145px!important;border-radius:18px!important;padding:6px 28px 6px 10px!important;font-size:12px!important;font-weight:600!important;background:#f7f9fb!important;border:1px solid #cfd8e6!important;cursor:pointer!important}.status-select:hover{border-color:#9ebcf0!important}.status-select:focus{border-color:var(--blue)!important;box-shadow:0 0 0 2px #116dff18!important}
 .unitrow{display:grid!important;grid-template-columns:72px 48px minmax(118px,145px)!important;justify-content:start!important;align-items:center!important;gap:8px!important}.unitrow .statuscaption{font-size:11px}.unitrow .status-select{margin:0!important;width:100%!important}
 .addon-heading{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:700;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
 @media(max-width:900px){.homegrid{grid-template-columns:1fr}.unitrow{grid-template-columns:62px 44px minmax(110px,135px)!important}}
 `;
 d.head.appendChild(style);
 const aside=d.querySelector('.side'),ordersBtn=d.querySelector('.nav[data-v="orders"]'),boardBtn=d.querySelector('.nav[data-v="board"]'),content=d.querySelector('.content');
 if(!aside||!ordersBtn||!content)return;
 const homeBtn=d.createElement('button');homeBtn.className='nav on';homeBtn.dataset.v='home';homeBtn.textContent='Home';aside.insertBefore(homeBtn,ordersBtn);ordersBtn.classList.remove('on');
 const home=d.createElement('div');home.id='home';home.innerHTML=`<div class="homepanel"><h2>White Corner Orders</h2><div class="homegrid"><div class="homebox"><div class="label">Version</div><div class="value"><b>v0.6.2 Live</b></div></div><div class="homebox"><div class="label">Account status</div><div class="value">Signed in</div></div><div class="homebox" style="grid-column:1/-1"><div class="label">Signed in as</div><div class="value" id="homeEmail">—</div></div></div><button class="home-signout" id="homeSignout">Sign out</button></div>`;content.insertBefore(home,content.firstChild);
 const stats=d.querySelector('#stats'),tools=d.querySelector('.tools'),orders=d.querySelector('#orders'),board=d.querySelector('#board'),pt=d.querySelector('#pt');
 const typeFilter=d.createElement('select');typeFilter.id='productTypeFilter';typeFilter.innerHTML='<option value="all">All product types</option><option value="cart">Carts</option><option value="other">Others</option>';if(tools)tools.insertBefore(typeFilter,tools.firstChild);
 function view(v){d.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.v===v));home.classList.toggle('hidden',v!=='home');stats?.classList.toggle('hidden',v!=='orders');tools?.classList.toggle('hidden',v==='home');orders?.classList.toggle('hidden',v!=='orders');board?.classList.toggle('hidden',v!=='board');typeFilter.style.display=v==='board'?'':'none';if(pt)pt.textContent=v==='home'?'Home':v==='orders'?'Orders':'Production Board';if(v==='board')applyBoardTypeFilter();}
 homeBtn.onclick=()=>view('home');ordersBtn.addEventListener('click',()=>view('orders'));boardBtn?.addEventListener('click',()=>view('board'));d.querySelector('#homeSignout').onclick=()=>d.querySelector('#logout')?.click();
 function syncAccount(){const email=(d.querySelector('#account')?.textContent||'').trim();const he=d.querySelector('#homeEmail');if(he&&email)he.textContent=email;}setInterval(syncAccount,700);syncAccount();
 const cartTerms=['cart','mobile bar','mobile cart','bar cart'];
 function isCartName(name){const n=(name||'').toLowerCase();return cartTerms.some(t=>n.includes(t));}
 function classifyCard(card){const p=card.querySelector('.product')?.textContent||'';const type=isCartName(p)?'cart':'other';card.dataset.productType=type;return type;}
 function applyBoardTypeFilter(){if(!board)return;const wanted=typeFilter.value;board.querySelectorAll('.pcard').forEach(c=>{const t=classifyCard(c);c.style.display=(wanted==='all'||t===wanted)?'':'none'});board.querySelectorAll('.col').forEach(col=>{const visible=[...col.querySelectorAll('.pcard')].filter(c=>c.style.display!=='none').length;const badge=col.querySelector('.ch span:last-child');if(badge)badge.textContent=visible;});}
 typeFilter.onchange=applyBoardTypeFilter;
 function enhanceStatuses(root=d){root.querySelectorAll('.pcard select:not(.status-select)').forEach(sel=>{sel.classList.add('status-select');const line=d.createElement('div');line.className='statusline';const lab=d.createElement('span');lab.className='statuscaption';lab.textContent='Status';sel.parentNode.insertBefore(line,sel);line.append(lab,sel);});root.querySelectorAll('.unitrow select:not(.status-select)').forEach(sel=>{sel.classList.add('status-select');if(!sel.parentNode.querySelector('.statuscaption')){const lab=d.createElement('span');lab.className='statuscaption';lab.textContent='Status';sel.parentNode.insertBefore(lab,sel);}});}
 const addonTerms=['umbrella hole','delivery','customisation','customization','back panel with'];
 function isAddonItem(el){const title=(el.querySelector('b')?.textContent||el.textContent||'').toLowerCase();return addonTerms.some(t=>title.includes(t));}
 function tidyDrawer(){const drawer=d.querySelector('.drawer');if(!drawer)return;
  drawer.querySelectorAll('.item').forEach(item=>{[...item.querySelectorAll('.pill,.note,div,span')].forEach(el=>{const txt=(el.textContent||'').toLowerCase();if(!(txt.includes('ready-to-use svg')||txt.includes('please email us')||txt.includes('i would like to add a logo but i dont have it in that file type')))return;const clone=item.cloneNode(true);clone.querySelectorAll('.pill,.note,div,span').forEach(x=>{const t=(x.textContent||'').toLowerCase();if(t.includes('ready-to-use svg')||t.includes('please email us')||t.includes('i would like to add a logo but i dont have it in that file type'))x.remove();});const rest=(clone.textContent||'').toLowerCase();if(!/(logo|branding|brand logo|custom logo)/.test(rest))el.style.display='none';});});
  drawer.querySelectorAll('.sec').forEach(sec=>{const arr=[...sec.children].filter(x=>x.classList&&x.classList.contains('item'));if(arr.length<2)return;const main=arr.filter(x=>!isAddonItem(x)),adds=arr.filter(isAddonItem);if(!adds.length)return;sec.querySelector('.addon-heading')?.remove();main.forEach(x=>sec.appendChild(x));const h=d.createElement('div');h.className='addon-heading';h.textContent='Add-ons';sec.appendChild(h);adds.forEach(x=>sec.appendChild(x));});
 }
 const observer=new MutationObserver(()=>{enhanceStatuses();applyBoardTypeFilter();tidyDrawer();});observer.observe(d.body,{childList:true,subtree:true});
 enhanceStatuses();tidyDrawer();typeFilter.style.display='none';view('home');
});
</script></body></html>
