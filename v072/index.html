:var(--mut)}.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:600}.paid{background:#c9efdb;color:#17643d}.unpaid{background:#ffdede;color:#8b2e2e}.ship{background:#edeaff;color:#514a9e}.pick{background:#e5f0ff;color:#2d62a8}.statussum{font-size:13px;white-space:nowrap}.review td{background:#fff1f1!important}.reviewtag{display:inline-block;margin-left:7px;padding:3px 7px;border-radius:4px;background:#ffdede;color:#8b2e2e;font-size:10px;font-weight:700}.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:10px;overflow-x:auto;margin-top:18px}.col{background:#f4f6f9;border:1px solid #e0e5eb;border-radius:12px;padding:8px;min-height:500px}.ch{display:flex;justify-content:space-between;font-weight:700;padding:3px 4px 9px}.pcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 66px 9px 10px;margin-bottom:7px;cursor:pointer;min-height:118px}.ordercode,.customer{font-weight:700}.customer{margin-top:5px}.product{margin-top:6px;font-size:12px;font-weight:600}.meta{font-size:11px;color:var(--mut);margin-top:2px}.boardthumb{position:absolute;right:9px;top:9px;width:48px;height:48px;border-radius:7px;border:1px solid var(--line);object-fit:cover;background:#f6f8fa}.homepanel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;max-width:720px}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.homebox{border:1px solid var(--line);border-radius:9px;padding:14px;background:#fbfcfd}.label,.st{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:7px}.shade{display:none;position:fixed;inset:0;background:#0f172a55;z-index:20}.shade.on{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(940px,96vw);background:#fff;overflow:auto;box-shadow:-6px 0 25px #0002}.dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;position:sticky;top:0;background:#fff;z-index:2}.dhmain{min-width:220px}.headstatus{display:flex;align-items:center;gap:10px;margin-left:auto;margin-right:14px}.headstatus label{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}.headstatus select{min-width:185px;height:44px;border-radius:23px;font-weight:700}.close{border:0;background:#eef1f5;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}.db{padding:20px 22px}.sec{margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.box,.item{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfd}.item{background:#fff;margin-bottom:8px}.pill{display:inline-block;background:#f1f4f7;border-radius:5px;padding:4px 6px;font-size:11px;margin:5px 5px 0 0}.addonpill{float:right}.addons-title{font-size:11px;text-transform:uppercase;color:#7a8599;font-weight:700;margin:18px 0 9px;padding-top:14px;border-top:1px solid var(--line)}.note{white-space:pre-wrap;font-size:12px;color:#4a5669;margin-top:8px}.orderitem{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px;background:#fff}.thumb{width:76px;height:76px;border-radius:7px;border:1px solid var(--line);object-fit:cover;background:#f6f8fa}.thumbph{display:flex;align-items:center;justify-content:center;color:#a0a8b5;font-size:11px}.itemname{font-weight:700;font-size:14px;line-height:1.3}.productlink{display:inline-block;margin-top:7px;color:#116dff;text-decoration:none;font-size:12px;font-weight:700}.pricecol{text-align:right;min-width:125px}.unitprice{font-size:12px;color:var(--mut);margin-top:3px}.linetotal{font-size:14px;font-weight:700;margin-top:5px}.totals{margin:14px 0 0 auto;width:min(390px,100%);border-top:1px solid var(--line);padding-top:8px}.totalrow{display:flex;justify-content:space-between;padding:5px 0}.totalrow.final{font-size:16px;font-weight:800;border-top:1px solid var(--line);margin-top:5px;padding-top:10px}.detailitem{di import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://zgvnrpspwluapaxnycrg.supabase.co','sb_publishable_DwutkRc9dxioIdUcdPn4gA_RfDb1-n_',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const S=['New','CNC','Assembly','Painting','Packing','Ready'];
const ADDON_TERMS=['delivery','additional tabletop','custom cutout','custom cutouts','side shelves','integrated ice storage shelf','umbrella hole','support panel','customisation','customization','back panel with','benchtop upgrade'];
const REVIEW_HINTS=['upgrade','additional','cutout','cut-out','accessory','shelf','shelves','support panel','back panel'];
const CART_TERMS=['cart','mobile bar','serving table','event bar'];
const EXCLUDED_ORDERS=new Set(['10242']);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));let O=[];
function items(o){return o.wc_order_items||[]}function units(i){return(i.wc_production_units||[]).sort((a,b)=>a.unit_index-b.unit_index)}function isAddonName(n){n=String(n||'').toLowerCase();return ADDON_TERMS.some(x=>n.includes(x))}function isCartName(n){n=String(n||'').toLowerCase();return CART_TERMS.some(x=>n.includes(x))}function shortName(n){return String(n||'').split(/\s[-–—]\s/)[0].trim()}
function classify(o){if(String(o.order_number)==='10812'){const up=items(o).find(i=>/tasmanian oak timber benchtop upgrade/i.test(i.product_name||''));const main=items(o).find(i=>!/tasmanian oak timber benchtop upgrade/i.test(i.product_name||'')&&!/^delivery$/i.test(i.product_name||''));const us=up?units(up):[];if(main&&us.length>=4)return{review:false,main:[main],addons:[up].filter(Boolean),logical:us.slice(0,4).map((u,k)=>({o,i:main,u,displayIndex:k+1,special:true}))};}const nd=items(o).filter(i=>!/^delivery$/i.test(i.product_name||''));const addons=nd.filter(i=>isAddonName(i.product_name));const main=nd.filter(i=>!isAddonName(i.product_name));if(!main.length&&addons.length)return{review:true,main:[],addons,logical:[]};const names=[...new Set(main.map(i=>i.product_name||''))];if(names.length>1&&names.some(n=>REVIEW_HINTS.some(k=>n.toLowerCase().includes(k))))return{review:true,main,addons,logical:[]};return{review:false,main,addons,logical:main.flatMap(i=>units(i).map(u=>({o,i,u})))} }
function logical(o){return classify(o).logical}function statusSummary(o){const c={};S.forEach(s=>c[s]=0);logical(o).forEach(x=>c[x.u.production_status||'New']++);return S.filter(s=>c[s]).map(s=>`${c[s]} ${s}`).join(' · ')||'—'}
function fmtDate(v){if(!v)return'—';return new Intl.DateTimeFormat('en-AU',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(v))}function fmtMoney(v,c='AUD'){if(v===null||v===undefined||v==='')return'—';try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:c||'AUD'}).format(Number(v))}catch{return String(v)}}function pay(o){const p=String(o.payment_status||'—');return`<span class="badge ${p.toUpperCase()==='PAID'?'paid':'unpaid'}">${esc(p.replaceAll('_',' '))}</span>`}function ful(o){const f=o.delivery_type||'Shipping';return`<span class="badge ${f==='Pickup'?'pick':'ship'}">${esc(f)}</span>`}
function optionText(i){const out=[];const add=obj=>{if(!obj||typeof obj!=='object')return;Object.entries(obj).forEach(([k,v])=>{if(v===null||v===undefined||v==='')return;let val=typeof v==='object'?(v.value||v.name||v.description||''):v;if(val!=='')out.push(`${k}: ${val}`)})};add(i.wix_options);add(i.custom_text_fields);let arr=[...new Set(out)];if(arr.some(x=>/logo or personalization:\s*no/i.test(x)))arr=arr.filter(x=>!/ready-to-use svg|please email us|file type/i.test(x));return arr.slice(0,10)}
function mediaUrl(i){const x=i.image||{},r=i.raw_item||{};return x.url||x.imageUrl||x.imageInfo?.url||r.media?.url||r.image?.url||r.image?.imageInfo?.url||''}function productUrl(i){const r=i.raw_item||{},c=i.catalog_reference||{};const vals=[r.productPageUrl,r.productUrl,r.url,c.productPageUrl,c.url];const u=vals.find(v=>typeof v==='string'&&/^https?:\/\//i.test(v));return u||''}
function filteredOrders(){const q=$('#search').value.toLowerCase(),sf=$('#sf').value,ff=$('#ff').value;return O.filter(o=>(!q||JSON.stringify(o).toLowerCase().includes(q))&&(!ff||o.delivery_type===ff)&&(!sf||logical(o).some(x=>(x.u.production_status||'New')===sf)))}function boardEntries(){let E=[];filteredOrders().forEach(o=>{const c=classify(o);if(!c.review)E.push(...c.logical)});const tf=$('#typef').value;if(tf)E=E.filter(x=>(isCartName(x.i.product_name)?'cart':'other')===tf);return E.sort((a,b)=>new Date(a.o.wix_created_at)-new Date(b.o.wix_created_at)||Number(a.o.order_number)-Number(b.o.order_number))}
function render(){const F=filteredOrders();$('#orders').innerHTML=`<table><thead><tr><th>Order</th><th>Date created</th><th>Customer</th><th>Payment</th><th>Fulfilment</th><th>Total</th><th>Items</th><th>Status</th></tr></thead><tbody>${F.map(o=>{const c=classify(o);return`<tr class="${c.review?'review':''}" data-order="${o.id}"><td><b>#${esc(o.order_number)}</b>${c.review?'<span class="reviewtag">Needs review</span>':''}</td><td>${fmtDate(o.wix_created_at)}</td><td>${esc(o.customer_name||'—')}<div class="mut">${esc(o.company||'')}</div></td><td>${pay(o)}</td><td>${ful(o)}</td><td>${fmtMoney(o.total,o.currency)}</td><td style="color:#116dff">${c.review?'—':c.logical.length}</td><td class="statussum">${c.review?'Needs review':esc(statusSummary(o))}</td></tr>`}).join('')}</tbody></table>`;$('#orders').querySelectorAll('tbody tr').forEach(r=>r.onclick=()=>openOrder(r.dataset.order,null));const E=boardEntries();$('#board').innerHTML=S.map(st=>{const C=E.filter(x=>(x.u.production_status||'New')===st);return`<div class="col"><div class="ch"><span>${st}</span><span>${C.length}</span></div>${C.map(x=>{const total=logical(x.o).length;const idx=x.special?x.displayIndex:(total>1?logical(x.o).findIndex(y=>y.u.id===x.u.id)+1:null);const code=idx?`#${x.o.order_number}-${idx}`:`#${x.o.order_number}`;const img=mediaUrl(x.i);return`<div class="pcard" data-order="${x.o.id}" data-unit="${x.u.id}">${img?`<img class="boardthumb" src="${esc(img)}" alt="">`:''}<div class="ordercode">${code}</div><div class="customer">${esc(x.o.customer_name||'—')}</div><div class="mut">${esc(x.o.company||'')}</div><div class="product">${esc(shortName(x.i.product_name||'Unnamed product'))}</div><div class="meta">${esc(optionText(x.i).slice(0,2).join(' · '))}${x.special?' · Tasmanian Oak Benchtop Upgrade':''}</div></div>`}).join('')}</div>`}).join('');$('#board').querySelectorAll('.pcard').forEach(c=>c.onclick=()=>openOrder(c.dataset.order,c.dataset.unit));$('#oc').textContent=O.length;const all=O.flatMap(o=>logical(o));$('#ic').textContent=all.filter(x=>(x.u.production_status||'New')!=='Ready').length;$('#rc').textContent=all.filter(x=>(x.u.production_status||'New')==='Ready').length}
async function setStatus(unitId,status){for(const o of O)for(const i of items(o)){const u=units(i).find(x=>x.id===unitId);if(u){const old=u.production_status;u.production_status=status;render();const{error}=await sb.from('wc_production_units').update({production_status:status}).eq('id',unitId);if(error){u.production_status=old;render();showErr(error.message)}return}}}
function simpleItemCard(i,addon=false,qtyOverride=null){const img=mediaUrl(i);return`<div class="detailitem"><div>${img?`<img class="detailthumb" src="${esc(img)}" alt="">`:`<div class="detailthumb thumbph">No image</div>`}</div><div><b>${esc(i.product_name||'Unnamed item')}</b>${addon?'<span class="pill addonpill">Add-on</span>':''}<div><span class="pill">qty: ${qtyOverride??i.quantity??1}</span>${optionText(i).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div></div>`}
function pricedItemCard(i,o,addon=false){const qty=Number(i.quantity||1),unit=Number(i.unit_price||0),img=mediaUrl(i),url=productUrl(i);return`<div class="orderitem"><div>${img?`<img class="thumb" src="${esc(img)}" alt="">`:`<div class="thumb thumbph">No image</div>`}</div><div><div class="itemname">${esc(i.product_name||'Unnamed item')} ${addon?'<span class="pill">Add-on</span>':''}</div><div><span class="pill">qty: ${qty}</span>${optionText(i).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>${url?`<a class="productlink" href="${esc(url)}" target="_blank" rel="noopener">View product ↗</a>`:''}</div><div class="pricecol"><div>${fmtMoney(unit,o.currency)} each</div><div class="unitprice">qty ${qty}</div><div class="linetotal">${fmtMoney(unit*qty,o.currency)}</div></div></div>`}
function deliveryAmount(o){const direct=Number(o.shipping||0);if(direct>0)return direct;if((o.delivery_type||'Shipping')!=='Shipping')return 0;const productSum=items(o).filter(i=>!/^delivery$/i.test(i.product_name||'')).reduce((s,i)=>s+Number(i.unit_price||0)*Number(i.quantity||1),0);const total=Number(o.total||0);const fees=Number(o.additional_fees||0);const discount=Math.abs(Number(o.discount||0));const residual=total-productSum-fees+discount;return residual>0.005?residual:0}
function totalsHtml(o){const rows=[];if(o.subtotal!==null&&o.subtotal!==undefined)rows.push(['Subtotal',fmtMoney(o.subtotal,o.currency)]);const delivery=deliveryAmount(o);if(delivery)rows.push(['Delivery',fmtMoney(delivery,o.currency)]);if(Number(o.discount))rows.push(['Discount','− '+fmtMoney(Math.abs(Number(o.discount)),o.currency)]);if(Number(o.additional_fees))rows.push(['Additional fees',fmtMoney(o.additional_fees,o.currency)]);if(o.tax!==null&&o.tax!==undefined&&Number(o.tax)!==0)rows.push(['Tax',fmtMoney(o.tax,o.currency)]);return`<div class="totals">${rows.map(r=>`<div class="totalrow"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}<div class="totalrow final"><span>Total</span><span>${fmtMoney(o.total,o.currency)}</span></div></div>`}
function openOrder(orderId,focusUnit){const o=O.find(x=>x.id===orderId);if(!o)return;const c=classify(o);$('#dn').textContent='#'+o.order_number;$('#dc').textContent=o.customer_name||'';$('#dco').textContent=o.company||'';const a=o.delivery_address&&typeof o.delivery_address==='object'?[o.delivery_address.addressLine,o.delivery_address.city,o.delivery_address.subdivision,o.delivery_address.postalCode].filter(Boolean).join(', '):'';let status='Needs review',count='—';if(!c.review){status=statusSummary(o);count=c.logical.length}const focused=focusUnit?c.logical.find(x=>x.u.id===focusUnit):null;$('#headstatus').innerHTML=focused?`<div class="headstatus"><label>Change status</label><select id="drawerStatus">${S.map(s=>`<option ${s===(focused.u.production_status||'New')?'selected':''}>${s}</option>`).join('')}</select></div>`:'';const overview=`<div class="sec"><div class="st">Overview</div><div class="grid"><div class="box"><b>Payment</b><br>${pay(o)}</div><div class="box"><b>Fulfilment</b><br>${ful(o)}</div><div class="box"><b>Total</b><br>${fmtMoney(o.total,o.currency)}</div><div class="box"><b>Date</b><br>${fmtDate(o.wix_created_at)}</div><div class="box"><b>Status</b><br>${esc(status)}</div><div class="box"><b>Items</b><br>${esc(count)}</div></div>${a?`<div class="note"><b>Delivery:</b> ${esc(a)}</div>`:''}${o.buyer_note?`<div class="note"><b>Buyer note:</b> ${esc(o.buyer_note)}</div>`:''}</div>`;if(focusUnit&&focused){const addHtml=c.addons.filter(Boolean).map(i=>simpleItemCard(i,true,String(o.order_number)==='10812'?1:null)).join('');$('#db').innerHTML=overview+`<div class="sec"><div class="st">Items</div>${simpleItemCard(focused.i,false,1)}${addHtml?`<div class="addons-title">Add-ons</div>${addHtml}`:''}</div>`;$('#drawerStatus').onchange=async e=>{await setStatus(focused.u.id,e.target.value);openOrder(orderId,focusUnit)}}else{const raw=items(o).filter(i=>!/^delivery$/i.test(i.product_name||''));$('#db').innerHTML=overview+`<div class="sec"><div class="st">Order composition</div>${raw.map(i=>pricedItemCard(i,o,isAddonName(i.product_name))).join('')}${totalsHtml(o)}</div>`}$('#shade').classList.add('on')}
