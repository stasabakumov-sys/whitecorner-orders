<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Corner Orders v0.8.7</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}#appframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f6f8}</style>
</head>
<body>
<iframe id="appframe" src="../v085/" title="White Corner Orders v0.8.7"></iframe>
<script>
const frame=document.getElementById('appframe');
function patch(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.body)return;
    d.title='White Corner Orders v0.8.7';
    const vb=[...d.querySelectorAll('.homebox')].find(x=>x.textContent.includes('Version'))?.querySelector('b');
    if(vb)vb.textContent='v0.8.7 Live';

    const ship=d.querySelector('#shipping');
    if(!ship)return;

    // Hide rules that do not affect packaging (No effect / 0 boxes).
    ship.querySelectorAll('.rule').forEach(rule=>{
      const txt=rule.textContent.replace(/\s+/g,' ').trim().toLowerCase();
      const input=rule.querySelector('input[id^="delta_"]');
      const delta=input?Number(input.value||0):null;
      const noEffect=txt.includes('no effect');
      if(noEffect || delta===0) rule.style.display='none';
      else rule.style.display='';
    });

    // Recalculate package completeness from currently visible package rows.
    const rows=[...ship.querySelectorAll('.shipdetail .shiptable tbody tr')];
    if(rows.length){
      const complete=row=>['l_','w_','h_','kg_'].every(p=>{
        const el=row.querySelector('[id^="'+p+'"]');
        return el && String(el.value).trim()!=='';
      });
      const incomplete=rows.filter(r=>!complete(r)).length;
      const badge=ship.querySelector('.shipdetail .badge.warn, .shipdetail .badge.ok');
      if(badge){
        badge.classList.toggle('warn',incomplete>0);
        badge.classList.toggle('ok',incomplete===0);
        badge.textContent=incomplete ? `${incomplete} package${incomplete===1?'':'s'} incomplete` : 'Ready for quoting';
      }
      const selected=ship.querySelector('.shipitem.on .pm');
      if(selected){
        selected.textContent=`${rows.length} base box${rows.length===1?'':'es'} · ${incomplete?`${incomplete} incomplete`:'complete'}`;
      }
    }
  }catch(e){}
}
frame.addEventListener('load',()=>{
  patch();
  try{
    const d=frame.contentDocument;
    const mo=new MutationObserver(()=>patch());
    mo.observe(d.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class','disabled','value']});
    d.addEventListener('click',()=>setTimeout(patch,150),true);
    d.addEventListener('input',()=>setTimeout(patch,50),true);
  }catch(e){}
});
setInterval(patch,500);
</script>
</body>
</html>
