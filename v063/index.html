<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White Corner Orders v0.6.3</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}iframe{position:fixed;inset:0}</style></head><body><iframe id="outer" src="../v062/" title="White Corner Orders v0.6.3"></iframe><script>
const outer=document.getElementById('outer');
function getAppDoc(){try{const od=outer.contentDocument||outer.contentWindow.document;const inner=od?.querySelector('#appframe');return inner?.contentDocument||inner?.contentWindow?.document||null}catch{return null}}
function isBoardVisible(d){const b=d.querySelector('#board');return !!b && !b.classList.contains('hidden') && getComputedStyle(b).display!=='none'}
const CART_TERMS=['cart','mobile bar','mobile cart','bar cart'];
const ADDON_TERMS=['umbrella hole','delivery','customisation','customization','back panel with'];
function isCart(s){s=(s||'').toLowerCase();return CART_TERMS.some(t=>s.includes(t))}
function addStyles(d){if(d.getElementById('v063styles'))return;const s=d.createElement('style');s.id='v063styles';s.textContent=`
#productTypeFilter{min-width:160px}
.status-label{display:block;font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:8px 0 4px}
.pcard select.v063-status,.unitrow select.v063-status{width:auto!important;min-width:112px!important;max-width:145px!important;border-radius:16px!important;padding:6px 28px 6px 10px!important;font-size:12px!important;font-weight:600!important;background:#f7f9fb!important;border:1px solid #cfd8e6!important;cursor:pointer!important;margin-top:0!important}
.pcard select.v063-status:hover,.unitrow select.v063-status:hover{border-color:#9ebcf0!important}
.unitrow{align-items:flex-end!important}.unitrow .status-wrap{display:flex;flex-direction:column;align-items:flex-start}
.addon-heading{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:700;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
`;d.head.appendChild(s)}
function ensureFilter(d){const tools=d.querySelector('.tools');if(!tools)return null;let f=d.querySelector('#productTypeFilter');if(!f){f=d.createElement('select');f.id='productTypeFilter';f.innerHTML='<option value="all">All product types</option><option value="cart">Carts</option><option value="other">Others</option>';tools.insertBefore(f,tools.firstChild);f.addEventListener('change',()=>applyFilter(d,f));}f.style.display=isBoardVisible(d)?'':'none';return f}
function applyFilter(d,f){const board=d.querySelector('#board');if(!board||!f)return;const wanted=f.value;board.querySelectorAll('.pcard').forEach(card=>{const name=card.querySelector('.product')?.textContent||'';const type=isCart(name)?'cart':'other';card.dataset.productType=type;card.style.display=(wanted==='all'||wanted===type)?'':'none'});board.querySelectorAll('.col').forEach(col=>{const count=[...col.querySelectorAll('.pcard')].filter(c=>c.style.display!=='none').length;const badge=col.querySelector('.ch span:last-child');if(badge)badge.textContent=String(count)})}
function enhanceStatuses(d){d.querySelectorAll('.pcard select:not(.v063-status)').forEach(sel=>{sel.classList.add('v063-status');if(!sel.previousElementSibling?.classList.contains('status-label')){const l=d.createElement('span');l.className='status-label';l.textContent='Change status';sel.parentNode.insertBefore(l,sel)}});d.querySelectorAll('.unitrow select:not(.v063-status)').forEach(sel=>{sel.classList.add('v063-status');if(sel.parentElement?.classList.contains('status-wrap'))return;const w=d.createElement('span');w.className='status-wrap';const l=d.createElement('span');l.className='status-label';l.textContent='Change status';sel.parentNode.insertBefore(w,sel);w.append(l,sel)})}
function isAddonItem(item){const title=(item.querySelector('b')?.textContent||'').toLowerCase();return ADDON_TERMS.some(t=>title.includes(t))}
function hideTechLogoText(item){const raw=(item.textContent||'').toLowerCase();const logoSelected=/logo\s*:\s*(yes|add|included)|branding\s*:\s*(yes|add|included)/i.test(raw);if(logoSelected)return;item.querySelectorAll('.pill,.note,div,span').forEach(el=>{const t=(el.textContent||'').toLowerCase();if(t.includes('ready-to-use svg')||t.includes('please email us')||t.includes('i would like to add a logo but i dont have it in that file type'))el.style.display='none'})}
function tidyDrawer(d){const shade=d.querySelector('#shade');if(!shade?.classList.contains('on'))return;const drawer=d.querySelector('.drawer');if(!drawer)return;drawer.querySelectorAll('.item').forEach(hideTechLogoText);drawer.querySelectorAll('.sec').forEach(sec=>{if(sec.dataset.v063sorted==='1')return;const arr=[...sec.children].filter(x=>x.classList?.contains('item'));if(arr.length<2)return;const main=arr.filter(x=>!isAddonItem(x));const adds=arr.filter(isAddonItem);if(!adds.length)return;main.forEach(x=>sec.appendChild(x));const h=d.createElement('div');h.className='addon-heading';h.textContent='Add-ons';sec.appendChild(h);adds.forEach(x=>sec.appendChild(x));sec.dataset.v063sorted='1'})}
function updateVersion(d){const vals=[...d.querySelectorAll('.homepanel .value b')];if(vals.length)vals[0].textContent='v0.6.3 Live'}
function tick(){const d=getAppDoc();if(!d)return;addStyles(d);updateVersion(d);const f=ensureFilter(d);enhanceStatuses(d);tidyDrawer(d);if(isBoardVisible(d))applyFilter(d,f)}
outer.addEventListener('load',()=>{setTimeout(tick,500);setInterval(tick,900)});
</script></body></html>
